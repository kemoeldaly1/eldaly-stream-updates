<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ELDALY STREAM — Goal Potion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Cairo', sans-serif; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

/* ================= مشترك ================= */
.gw { position: relative; transform-origin: center center; animation: gwFloat 5s ease-in-out infinite; will-change: transform; }
@keyframes gwFloat { 0%,100% { transform: translateY(0) scale(var(--s, 1)); } 50% { transform: translateY(-9px) scale(calc(var(--s, 1) * 1.01)); } }
.gw svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pct {
  position: absolute; z-index: 15; font-family: 'Orbitron', sans-serif; font-weight: 900;
  letter-spacing: .02em; line-height: 1; direction: ltr; white-space: nowrap;
  background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 4px 9px rgba(0,0,0,.5));
}
.pill {
  position: absolute; z-index: 20; white-space: nowrap; font-weight: 900; color: #fff;
  padding: 5px 14px; border-radius: 999px; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  box-shadow: 0 6px 22px rgba(0,0,0,.45);
}
.pill::after { content: ""; position: absolute; width: 0; height: 0; }
.glow-val { position: absolute; z-index: 20; font-family: 'Orbitron', sans-serif; font-weight: 800;
  direction: ltr; white-space: nowrap; letter-spacing: 1px; }

/* ================= 1) الزجاجة ================= */
#shape-bottle .pct { top: 47%; left: 50%; transform: translate(-50%,-50%); font-size: 46px; }
#shape-bottle .pill { top: 148px; right: 96px; font-size: 19px; }
#shape-bottle .pill::after { bottom: -16px; right: 18px; border-left: 17px solid transparent; border-top: 17px solid var(--pill); filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
#shape-bottle .glow-val { top: 205px; right: 74px; font-size: 21px; color: var(--v-col); text-shadow: 0 1px 0 rgba(0,0,0,.9), 0 0 10px var(--c), 0 0 22px var(--c); }

/* ================= 2) القلب الكرتوني ================= */
#shape-heart .gw { animation: gwFloat 4.2s ease-in-out infinite; }
#shape-heart .pill { left: 50%; bottom: -26px; transform: translateX(-50%); font-family: 'Orbitron',sans-serif;
  font-size: 20px; direction: ltr; color: #fff; background: linear-gradient(180deg,#ffb020,#f97316);
  border: 2.5px solid #ffedc2; padding: 6px 30px; letter-spacing: 1px;
  box-shadow: 0 0 16px rgba(255,200,90,.85), 0 0 34px rgba(255,160,40,.5), 0 6px 16px rgba(0,0,0,.45); }
.spark { position: absolute; z-index: 6; animation: twinkle 2.2s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(18deg); } }

/* ================= 3) قلب الزجاجة ================= */
#shape-heartpotion .pct { top: 54%; left: 53%; transform: translate(-50%,-50%); font-size: 40px; }
#shape-heartpotion .pill { top: 12px; left: 6px; font-size: 16px; }
#shape-heartpotion .pill::after { display: none; }
#shape-heartpotion .glow-val { display: none; }

/* ================= 4) نوتة تيك توك ================= */
#shape-tik .t-title { position: absolute; z-index: 20; top: 118px; left: 4px; font-family: 'Orbitron',sans-serif;
  font-weight: 900; font-size: 26px; direction: ltr; color: var(--c);
  text-shadow: 0 0 6px var(--c), 0 0 16px var(--cm), 0 2px 0 rgba(0,0,0,.6); white-space: nowrap; }
#shape-tik .glow-val { top: 158px; left: 6px; font-size: 19px; color: #fff;
  text-shadow: 0 0 8px var(--c), 0 0 18px var(--c), 0 2px 3px rgba(0,0,0,.7); }
#shape-tik .pct { display: none; }
</style>
</head>
<body>
<div id="stage"><div class="gw" id="gw"></div></div>
<script>
/* إعداد الويدجت — على الباك اند __INITIAL_CONFIG__ بتتعوض بكونفج الحساب،
   وعلى الموقع الثابت السطر بيرمي ReferenceError بيتلقط ونكمل ديمو */
let CONFIG = {};
try { CONFIG = __INITIAL_CONFIG__; } catch (e) {}

const params = new URLSearchParams(location.search);
const PAGE_ID = params.get("id") || "goal-potion";
const shape  = (params.get("shape")  || CONFIG.shape  || "bottle").toLowerCase();
const type   = (params.get("type")   || CONFIG.type   || "likes").toLowerCase();
const goal   = parseInt(params.get("goal") || params.get("target") || CONFIG.target || 100) || 100;
const titleOverride = params.get("title") || CONFIG.title || "";

const TYPES = {
  likes:    { label: "لايكات",    statsKey: "likes",      emoji: "❤️" },
  follows:  { label: "متابعين",   statsKey: "followers",  emoji: "👥" },
  coins:    { label: "كوينز",     statsKey: "totalCoins", emoji: "🪙" },
  gifts:    { label: "هدايا",     statsKey: "gifts",      emoji: "🎁" },
  shares:   { label: "مشاركات",   statsKey: "shares",     emoji: "🔁" },
};
const T = TYPES[type] || TYPES.likes;
const LABEL = titleOverride || (T.emoji + " هدف " + T.label);

/* الألوان — كل شكل له هوية مغايرة، وباراميتر color بيعدها */
const DEF_COL = { bottle: "#f43f5e", heart: "#ff4d6d", heartpotion: "#d946ef", tik: "#06b6d4" };
const C = (params.get("color") || CONFIG.color || DEF_COL[shape] || "#f43f5e").replace("#", "");

/* أدوات لون */
function rgb(hex) { return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]; }
function shade(f) { const [r,g,b] = rgb(C); const m = v => Math.max(0, Math.min(255, Math.round(v * f))); return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")"; }
function colA(a) { const [r,g,b] = rgb(C); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }

document.documentElement.style.setProperty("--c", "#" + C);
document.documentElement.style.setProperty("--cm", colA(0.65));
document.documentElement.style.setProperty("--v-col", shade(1.25));
document.documentElement.style.setProperty("--pill", shade(0.85));

/* ================= عداد وديمو ================= */
let cur = Math.round(goal * 0.42);
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function pct() { return Math.max(0, Math.min(100, Math.round((cur / goal) * 100))); }

/* ================= بناء SVG لكل شكل ================= */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

const gw = document.getElementById("gw");
gw.id = "shape-" + shape;
let waveState = null; // { ctx: {W,H,liquidY(),...} }

/* مسار موجة سينية مغلقة لأسفل */
function waveD(W, H, yBase, amp, phase) {
  let d = "M -30 " + (H + 30) + " L -30 " + (yBase + Math.sin(phase) * amp).toFixed(1);
  for (let x = -30; x <= W + 30; x += 14) {
    const y = yBase + Math.sin(x / 58 + phase) * amp + Math.sin(x / 21 - phase * 1.7) * amp * 0.32;
    d += " L " + x + " " + y.toFixed(1);
  }
  d += " L " + (W + 30) + " " + (H + 30) + " Z";
  return d;
}
function waveTopD(W, H, yBase, amp, phase) {
  let d = "";
  for (let x = -30; x <= W + 30; x += 14) {
    const y = yBase + Math.sin(x / 58 + phase) * amp + Math.sin(x / 21 - phase * 1.7) * amp * 0.32;
    d += (d ? " L " : "M ") + x + " " + y.toFixed(1);
  }
  return d;
}

/* فقاعات جوه السائل */
function makeBubbles(parent, n, W, H, zone) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const c = el("circle", { r: (2 + Math.random() * 4).toFixed(1), fill: "rgba(255,255,255,0.5)", opacity: 0, cx: (Math.random() * W).toFixed(1), cy: H }, parent);
    arr.push({ c, x: Math.random(), v: 0.10 + Math.random() * 0.16, off: Math.random(), w: 0.5 + Math.random() * 1.4 });
  }
  return { arr, zone, W, H };
}

function startWaves(cfg) {
  waveState = cfg;
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const s = waveState; if (!s) return;
    s.phase += dt * s.speed;
    const yb = s.liquidY();
    s.back.setAttribute("d", waveD(s.W, s.H, yb + 5, s.amp * 1.15, s.phase * 0.82 + 1.4));
    s.front.setAttribute("d", waveD(s.W, s.H, yb, s.amp, s.phase));
    s.line.setAttribute("d", waveTopD(s.W, s.H, yb, s.amp, s.phase));
    for (const b of s.bub.arr) {
      b.off += dt * b.v;
      if (b.off > 1) { b.off = 0; b.c.setAttribute("cx", (Math.random() * s.W)); }
      const yy = s.H - b.off * (s.H - yb);
      b.c.setAttribute("cx", parseFloat(b.c.getAttribute("cx") || 0) + Math.sin(t / 400 * b.w) * 0.35);
      b.c.setAttribute("cy", yy);
      b.c.setAttribute("opacity", b.off < 0.12 ? (b.off / 0.12) * 0.75 : Math.max(0, 0.75 * (1 - (b.off - 0.12) / 0.9)));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- الشكل 1: الزجاجة ---------- */
function buildBottle() {
  const W = 520, H = 560;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  // جسم الزجاجة (رسم فيكتور أصلي): رقبة + أكتاف + جسم مستدير
  const bodyD = "M 218 108 L 218 168 C 218 190 192 202 168 220 C 128 250 106 286 106 330 L 106 452 C 106 492 138 516 182 516 L 338 516 C 382 516 414 492 414 452 L 414 330 C 414 286 392 250 352 220 C 328 202 302 190 302 168 L 302 108 Z";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  const clip = el("clipPath", { id: "bottleClip" }, defs);
  el("path", { d: bodyD }, clip);
  const gGrad = el("linearGradient", { id: "liqGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(0.45) }, gGrad);
  el("stop", { offset: "55%", "stop-color": shade(0.85) }, gGrad);
  el("stop", { offset: "100%", "stop-color": "#" + C }, gGrad);
  const bGrad = el("linearGradient", { id: "backGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(0.62) }, bGrad);
  el("stop", { offset: "100%", "stop-color": shade(0.38) }, bGrad);

  // السائل (مقصوص جوه جسم الزجاجة)
  const liq = el("g", { "clip-path": "url(#bottleClip)" }, svg);
  const back = el("path", { fill: "url(#backGrad)", opacity: 0.85 }, liq);
  const front = el("path", { fill: "url(#liqGrad)" }, liq);
  const line = el("path", { fill: "none", stroke: "rgba(255,255,255,0.5)", "stroke-width": 2.5, "stroke-linecap": "round" }, liq);
  const bub = makeBubbles(liq, 9, W, H);

  // الزجاج فوق السائل
  el("path", { d: bodyD, fill: "rgba(210,230,255,0.10)", stroke: "rgba(235,245,255,0.5)", "stroke-width": 3 }, svg);
  // لمعة جانبية
  el("path", { d: "M 150 250 C 138 274 132 300 132 330 L 132 440", fill: "none", stroke: "rgba(255,255,255,0.55)", "stroke-width": 10, "stroke-linecap": "round", opacity: 0.5 }, svg);
  el("path", { d: "M 236 128 L 236 162", fill: "none", stroke: "rgba(255,255,255,0.4)", "stroke-width": 6, "stroke-linecap": "round", opacity: 0.5 }, svg);

  // الفلينة
  const cork = el("g", {}, svg);
  el("rect", { x: 230, y: 44, width: 60, height: 74, rx: 10, fill: "#c98d4f", stroke: "#8a5a2b", "stroke-width": 2 }, cork);
  el("ellipse", { cx: 260, cy: 48, rx: 30, ry: 9, fill: "#dba568" }, cork);
  el("path", { d: "M 240 66 h 40 M 238 84 h 44 M 242 102 h 36", stroke: "rgba(90,55,20,0.45)", "stroke-width": 2.5, "stroke-linecap": "round" }, cork);
  el("ellipse", { cx: 252, cy: 62, rx: 3, ry: 5, fill: "rgba(90,55,20,0.5)" }, cork);
  el("ellipse", { cx: 272, cy: 92, rx: 3, ry: 4.5, fill: "rgba(90,55,20,0.5)" }, cork);
  // حلقة الرقبة
  el("rect", { x: 208, y: 100, width: 104, height: 14, rx: 7, fill: "rgba(235,245,255,0.16)", stroke: "rgba(255,255,255,0.5)", "stroke-width": 2 }, svg);

  // نصوص
  const pill = document.createElement("div");
  pill.className = "pill"; pill.id = "pill";
  pill.style.background = "linear-gradient(135deg," + shade(0.8) + " 0%,#" + C + " 100%)";
  pill.style.boxShadow = "0 6px 25px " + colA(0.55) + ", 0 3px 10px rgba(0,0,0,0.3)";
  pill.textContent = LABEL;
  const val = document.createElement("div");
  val.className = "glow-val"; val.id = "val";
  const p = document.createElement("div");
  p.className = "pct"; p.id = "pct";
  p.style.backgroundImage = "linear-gradient(180deg,#fff 0%,#" + C + " 90%)";
  gw.appendChild(pill); gw.appendChild(val); gw.appendChild(p);

  startWaves({
    W, H, back, front, line, bub, phase: 0, speed: 1.6, amp: 7,
    liquidY: () => 516 - (Math.max(0, Math.min(1, cur / goal))) * 380,
  });
}

/* ---------- الشكل 2: القلب الكرتوني ---------- */
function buildHeart() {
  const W = 340, H = 330;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  const g = el("radialGradient", { id: "heartG", cx: "0.35", cy: "0.28", r: "1" }, defs);
  el("stop", { offset: "0%", "stop-color": shade(1.45) }, g);
  el("stop", { offset: "45%", "stop-color": "#" + C }, g);
  el("stop", { offset: "100%", "stop-color": shade(0.62) }, g);
  const heartD = "M 170 296 C 88 240 26 190 26 118 C 26 60 70 26 118 26 C 141 26 160 37 170 52 C 180 37 199 26 222 26 C 270 26 314 60 314 118 C 314 190 252 240 170 296 Z";

  // توهج
  el("path", { d: heartD, fill: "none", stroke: colA(0.55), "stroke-width": 22, "stroke-linejoin": "round", opacity: 0.5, filter: "blur(2px)" }, svg);
  // جسم القلب
  el("path", { d: heartD, fill: "url(#heartG)", stroke: shade(0.55), "stroke-width": 4, "stroke-linejoin": "round" }, svg);
  // لمعة
  el("path", { d: "M 62 96 C 58 74 74 52 96 46 C 104 44 108 52 102 58 C 86 66 76 82 78 98 C 78 106 64 106 62 96 Z", fill: "rgba(255,255,255,0.85)" }, svg);
  el("ellipse", { cx: 92, cy: 44, rx: 10, ry: 6, fill: "rgba(255,255,255,0.6)", transform: "rotate(-18 92 44)" }, svg);

  // الوش: عيون + ابتسامة + خدود
  const face = el("g", {}, svg);
  el("ellipse", { cx: 122, cy: 130, rx: 17, ry: 21, fill: "#3a1220" }, face);
  el("ellipse", { cx: 218, cy: 130, rx: 17, ry: 21, fill: "#3a1220" }, face);
  el("circle", { cx: 117, cy: 122, r: 6, fill: "#fff" }, face);
  el("circle", { cx: 213, cy: 122, r: 6, fill: "#fff" }, face);
  el("path", { d: "M 140 168 C 152 186 188 186 200 168 C 196 196 144 196 140 168 Z", fill: "#5c1626", stroke: "#3a1220", "stroke-width": 3, "stroke-linejoin": "round" }, face);
  el("path", { d: "M 152 184 C 160 193 180 193 188 184 C 182 176 158 176 152 184 Z", fill: "#ff7d94" }, face);
  el("ellipse", { cx: 88, cy: 158, rx: 13, ry: 8, fill: "#ff8fa3", opacity: 0.75 }, face);
  el("ellipse", { cx: 252, cy: 158, rx: 13, ry: 8, fill: "#ff8fa3", opacity: 0.75 }, face);

  // التاج الذهبي
  const crown = el("g", { transform: "translate(170,10) rotate(6)" }, svg);
  el("path", { d: "M -34 22 L -40 -12 L -18 4 L 0 -18 L 18 4 L 40 -12 L 34 22 Z", fill: "#ffc531", stroke: "#d99a12", "stroke-width": 3, "stroke-linejoin": "round" }, crown);
  el("rect", { x: -36, y: 20, width: 72, height: 12, rx: 5, fill: "#ffd764", stroke: "#d99a12", "stroke-width": 2.5 }, crown);
  el("circle", { cx: 0, cy: 8, r: 4.5, fill: "#ff4d6d", stroke: "#d99a12", "stroke-width": 1.5 }, crown);
  el("circle", { cx: 40, cy: -14, r: 4, fill: "#fff", opacity: 0.9 }, crown);

  // لمّعات حوالين
  const sparkPts = [[28, 40, 13], [308, 66, 11], [40, 220, 10], [300, 210, 12], [180, 8, 9]];
  for (const [sx, sy, ss] of sparkPts) {
    const sp = el("path", { class: "spark", d: sparkD(ss), fill: "#ffe9a8", transform: "translate(" + sx + "," + sy + ")" }, svg);
    sp.style.animationDelay = (Math.random() * 2).toFixed(2) + "s";
  }

  const pill = document.createElement("div");
  pill.className = "pill"; pill.id = "val";
  gw.appendChild(pill);
}

function sparkD(s) {
  return "M 0 " + (-s) + " C " + (s * 0.18) + " " + (-s * 0.18) + " " + (s * 0.18) + " " + (-s * 0.18) + " " + s + " 0 C " + (s * 0.18) + " " + (s * 0.18) + " " + (s * 0.18) + " " + (s * 0.18) + " 0 " + s + " C " + (-s * 0.18) + " " + (s * 0.18) + " " + (-s * 0.18) + " " + (s * 0.18) + " " + (-s) + " 0 C " + (-s * 0.18) + " " + (-s * 0.18) + " " + (-s * 0.18) + " " + (-s * 0.18) + " 0 " + (-s) + " Z";
}

/* ---------- الشكل 3: قلب الزجاجة ---------- */
function buildHeartPotion() {
  const W = 400, H = 470;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  // قلب زجاجة: جسم القلب + فوهة فوق
  const innerD = "M 200 428 C 116 372 52 316 52 232 C 52 170 100 132 152 132 C 174 132 192 141 200 156 C 208 141 226 132 248 132 C 300 132 348 170 348 232 C 348 316 284 372 200 428 Z";
  const glassD = "M 200 440 C 112 382 42 322 42 232 C 42 164 94 122 152 122 C 174 122 192 131 200 146 C 208 131 226 122 248 122 C 306 122 358 164 358 232 C 358 322 288 382 200 440 Z";
  const clip = el("clipPath", { id: "hpClip" }, defs);
  el("path", { d: innerD }, clip);
  const gGrad = el("linearGradient", { id: "hpGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(0.55) }, gGrad);
  el("stop", { offset: "100%", "stop-color": shade(1.15) }, gGrad);

  const liq = el("g", { "clip-path": "url(#hpClip)" }, svg);
  const back = el("path", { fill: shade(0.45), opacity: 0.8 }, liq);
  const front = el("path", { fill: "url(#hpGrad)" }, liq);
  const line = el("path", { fill: "none", stroke: "rgba(255,255,255,0.55)", "stroke-width": 2.5 }, liq);

  // عيون بتسبح جوه السايل
  const eyes = [];
  for (let i = 0; i < 5; i++) {
    const gE = el("g", { opacity: 0 }, liq);
    el("circle", { r: 9 + Math.random() * 5, fill: "#fff" }, gE);
    const iris = el("circle", { r: 4.5, fill: shade(0.6), cx: 0, cy: 0 }, gE);
    el("circle", { r: 2.2, fill: "#141420" }, iris);
    el("circle", { r: 1.6, fill: "#fff", cx: -1.5, cy: -1.5 }, gE);
    eyes.push({ g: gE, x: 0.2 + Math.random() * 0.6, off: Math.random(), v: 0.05 + Math.random() * 0.07 });
  }

  // الزجاج فوق
  el("path", { d: glassD, fill: "rgba(235,215,255,0.10)", stroke: "rgba(250,240,255,0.55)", "stroke-width": 3.5, "stroke-linejoin": "round" }, svg);
  el("path", { d: "M 86 232 C 82 268 92 302 114 330", fill: "none", stroke: "rgba(255,255,255,0.5)", "stroke-width": 9, "stroke-linecap": "round", opacity: 0.45 }, svg);
  el("path", { d: "M 130 160 C 120 168 110 180 104 194", fill: "none", stroke: "rgba(255,255,255,0.55)", "stroke-width": 7, "stroke-linecap": "round", opacity: 0.5 }, svg);

  // الفلينة + الحبل
  el("path", { d: "M 168 66 L 232 66 L 222 122 L 178 122 Z", fill: "#c98d4f", stroke: "#8a5a2b", "stroke-width": 2.5 }, svg);
  el("ellipse", { cx: 200, cy: 66, rx: 32, ry: 10, fill: "#dba568", stroke: "#8a5a2b", "stroke-width": 2 }, svg);
  el("path", { d: "M 160 128 C 180 146 220 146 240 128", fill: "none", stroke: "#b5793a", "stroke-width": 8, "stroke-linecap": "round" }, svg);
  el("path", { d: "M 162 136 C 182 154 218 154 238 136", fill: "none", stroke: "#96602c", "stroke-width": 8, "stroke-linecap": "round", opacity: 0.85 }, svg);
  el("circle", { cx: 244, cy: 148, r: 7, fill: "#b5793a", stroke: "#7c4c1e", "stroke-width": 2 }, svg);
  el("path", { d: "M 248 154 C 258 172 252 186 240 196", fill: "none", stroke: "#b5793a", "stroke-width": 6, "stroke-linecap": "round" }, svg);

  // نصوص
  const p = document.createElement("div");
  p.className = "pct"; p.id = "pct";
  p.style.backgroundImage = "linear-gradient(180deg,#fff 0%,#" + C + " 95%)";
  const pill = document.createElement("div");
  pill.className = "pill"; pill.id = "pill";
  pill.style.background = "linear-gradient(135deg," + shade(0.8) + " 0%,#" + C + " 100%)";
  pill.textContent = LABEL;
  gw.appendChild(p); gw.appendChild(pill);

  startWaves({
    W, H, back, front, line, phase: 2, speed: 1.4, amp: 6,
    bub: { arr: [] },
    liquidY: () => 428 - (Math.max(0, Math.min(1, cur / goal))) * 280,
    eyes, eyeBase: { W: 400, top: 150, bottom: 428 },
  });
  // حركة العيون — نفس اللوب بس معالجة منفصلة بسيطة
  let last = performance.now();
  (function eyeFrame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const yb = waveState.liquidY();
    for (const e of eyes) {
      e.off += dt * e.v;
      if (e.off > 1) { e.off = 0; e.x = 0.2 + Math.random() * 0.6; }
      const yy = 428 - e.off * (428 - Math.max(yb, 160));
      e.g.setAttribute("transform", "translate(" + (40 + e.x * 320 + Math.sin(t / 500 + e.off * 9) * 6) + "," + yy + ")");
      e.g.setAttribute("opacity", e.off < 0.1 ? e.off / 0.1 : Math.max(0, 1 - (e.off - 0.55) / 0.45));
    }
    requestAnimationFrame(eyeFrame);
  })(last);
}

/* ---------- الشكل 4: نوتة تيك توك ---------- */
function buildTik() {
  const W = 380, H = 520;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  // نوتة موسيقية زجاجية: رأس بيضاوي تحت + ساق مستقيمة + لفّة على اليمين
  const headD = "M 180 508 C 108 508 52 464 52 400 C 52 336 108 292 180 292 C 252 292 308 336 308 400 C 308 464 252 508 180 508 Z";
  const headOuter = "M 180 520 C 100 520 40 472 40 400 C 40 328 100 280 180 280 C 260 280 320 328 320 400 C 320 472 260 520 180 520 Z";
  const stemD = "M 272 420 L 272 92 Q 272 82 282 82 L 302 82 Q 312 82 312 92 L 312 420 Z";
  const flagD = "M 312 96 C 342 106 360 130 354 162 C 350 182 336 196 318 202 C 332 184 334 162 324 144 C 318 132 314 118 312 106 Z";
  const clip = el("clipPath", { id: "tikClip" }, defs);
  el("path", { d: headD }, clip);
  el("path", { d: stemD }, clip);
  const gGrad = el("linearGradient", { id: "tikGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(1.25) }, gGrad);
  el("stop", { offset: "100%", "stop-color": shade(0.5) }, gGrad);

  // توهج خارجي
  el("path", { d: headOuter, fill: colA(0.4), stroke: "none", filter: "blur(14px)", opacity: 0.8 }, svg);

  const liq = el("g", { "clip-path": "url(#tikClip)" }, svg);
  const back = el("path", { fill: shade(0.42), opacity: 0.85 }, liq);
  const front = el("path", { fill: "url(#tikGrad)" }, liq);
  const line = el("path", { fill: "none", stroke: "rgba(255,255,255,0.6)", "stroke-width": 2.5 }, liq);
  const bub = makeBubbles(liq, 8, W, H);

  // زجاج
  el("path", { d: headOuter, fill: "rgba(220,245,255,0.09)", stroke: "rgba(240,252,255,0.55)", "stroke-width": 3.5 }, svg);
  el("path", { d: stemD, fill: "rgba(220,245,255,0.09)", stroke: "rgba(240,252,255,0.55)", "stroke-width": 3, "stroke-linejoin": "round" }, svg);
  el("path", { d: flagD, fill: colA(0.18), stroke: "rgba(240,252,255,0.5)", "stroke-width": 3, "stroke-linejoin": "round" }, svg);
  el("path", { d: "M 82 380 C 78 420 98 458 136 478", fill: "none", stroke: "rgba(255,255,255,0.5)", "stroke-width": 10, "stroke-linecap": "round", opacity: 0.5 }, svg);

  // فلينة فوق الساق
  el("rect", { x: 268, y: 24, width: 48, height: 62, rx: 9, fill: "#c98d4f", stroke: "#8a5a2b", "stroke-width": 2.5 }, svg);
  el("ellipse", { cx: 292, cy: 28, rx: 24, ry: 8, fill: "#dba568" }, svg);
  el("path", { d: "M 277 46 h 30 M 275 62 h 34", stroke: "rgba(90,55,20,0.45)", "stroke-width": 2.5, "stroke-linecap": "round" }, svg);

  // نصوص
  const t = document.createElement("div");
  t.className = "t-title"; t.id = "pill"; t.textContent = LABEL;
  const v = document.createElement("div");
  v.className = "glow-val"; v.id = "val";
  gw.appendChild(t); gw.appendChild(v);

  startWaves({
    W, H, back, front, line, bub, phase: 1, speed: 1.5, amp: 6,
    liquidY: () => 520 - (Math.max(0, Math.min(1, cur / goal))) * 230,
  });
}

const BUILDERS = { bottle: buildBottle, heart: buildHeart, heartpotion: buildHeartPotion, tik: buildTik };
(BUILDERS[shape] || buildBottle)();

/* تحجيم تلقائي لمقاس المصدر في OBS */
function fit() {
  const w = gw.offsetWidth, h = gw.offsetHeight;
  if (!w || !h) return;
  const s = Math.min(window.innerWidth / w, window.innerHeight / h) * 0.96;
  gw.style.setProperty("--s", s.toFixed(3));
}
window.addEventListener("resize", fit);
fit(); setTimeout(fit, 300);

/* ================= تحديث العداد ================= */
function render() {
  const p = document.getElementById("pct");
  if (p) p.textContent = pct() + "%";
  const val = document.getElementById("val");
  if (val) {
    if (shape === "heart") val.textContent = fmt(cur) + " / " + fmt(goal);
    else val.textContent = fmt(cur) + " / " + fmt(goal);
  }
}

/* ديمو دائم — أول stats حقيقية بتعديها */
let gotReal = false;
render();
setInterval(function () {
  if (gotReal) return;
  const drift = (Math.random() - 0.42) * goal * 0.05;
  cur = Math.max(goal * 0.15, Math.min(goal, cur + drift));
  render();
}, 2200);

/* ================= بيانات لايف ================= */
let evtSource = null;
try { evtSource = new EventSource('/widgets/stream'); } catch (e) {}
if (evtSource) {
  evtSource.onmessage = (e) => {
    let m = null;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === "stats" && m.stats) {
      const v = m.stats[T.statsKey];
      if (v !== undefined) { cur = Math.max(0, Number(v) || 0); gotReal = true; render(); }
    } else if (m.type === "config" && m.id === PAGE_ID && m.config) {
      CONFIG = m.config || {};
      location.reload();
    } else if (m.type === "test") {
      cur = Math.min(goal, cur + Math.round(goal * 0.12));
      render();
    }
  };
}
</script>
