<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ELDALY STREAM — Goal Potion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lemon&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Cairo', sans-serif; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

/* ================= مشترك ================= */
.gw { position: relative; transform-origin: center center; animation: gwFloat 5s ease-in-out infinite; will-change: transform; }
@keyframes gwFloat { 0%,100% { transform: translateY(0) scale(var(--s, 1)); } 50% { transform: translateY(-9px) scale(calc(var(--s, 1) * 1.01)); } }
.gw svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pct {
  position: absolute; z-index: 15; font-family: 'Lemon', 'Cairo', serif; font-weight: 400;
  letter-spacing: .02em; line-height: 1; direction: ltr; white-space: nowrap;
  background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 4px 9px rgba(0,0,0,.5));
}
.pill {
  position: absolute; z-index: 20; white-space: nowrap; font-weight: 400; color: #fff;
  font-family: 'Lemon', 'Cairo', serif;
  padding: 4px 12px; border-radius: 999px; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  box-shadow: 0 6px 22px rgba(0,0,0,.45);
}
.pill::after { content: ""; position: absolute; width: 0; height: 0; }
.glow-val { position: absolute; z-index: 20; font-family: 'Lemon', 'Cairo', serif; font-weight: 400;
  direction: ltr; white-space: nowrap; letter-spacing: .5px; }

/* ================= 1) الزجاجة ================= */
#shape-bottle .pct { top: 47%; left: 50%; transform: translate(-45%,-50%); font-size: 42px; }
#shape-bottle .pill { top: 156px; right: 100px; font-size: 20px; }
#shape-bottle .pill::after { bottom: -16px; right: 18px; border-left: 17px solid transparent; border-top: 17px solid var(--pill); filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
#shape-bottle .glow-val { top: 204px; right: 92px; font-size: 21px; color: var(--v-col); text-shadow: 0 1px 0 rgba(0,0,0,.9), 0 0 10px var(--c), 0 0 22px var(--c); }

/* ================= 2) القلب الكرتوني ================= */
#shape-heart .gw { animation: gwFloat 4.2s ease-in-out infinite; }
#shape-heart .pill { left: 50%; bottom: -24px; transform: translateX(-50%); font-family: Arial, sans-serif;
  font-size: 20px; font-weight: 700; direction: ltr; color: #fff; background: #d4522d;
  border: 2px solid #ffe5a5; padding: 4px 26px; letter-spacing: .5px;
  box-shadow: 0 0 12px rgba(255,255,255,.85), 0 4px 14px rgba(0,0,0,.4); }
.spark { position: absolute; z-index: 6; animation: twinkle 2.2s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(18deg); } }

/* ================= 3) قلب الزجاجة ================= */
#shape-heartpotion .pct { top: 54%; left: 53%; transform: translate(-50%,-50%); font-size: 40px; }
#shape-heartpotion .pill { top: auto; bottom: -26px; left: 50%; right: auto; transform: translateX(-50%);
  font-size: 19px; direction: ltr; padding: 5px 22px;
  background: linear-gradient(180deg, #e23a3a, #9c1414);
  border: 3px solid #f7e6c8;
  box-shadow: 0 0 18px rgba(226,58,58,.55), 0 6px 18px rgba(0,0,0,.5); }
#shape-heartpotion .pill::after { display: none; }
#shape-heartpotion .pill .sep { opacity: .65; margin: 0 10px; }
#shape-heartpotion .glow-val { display: none; }

/* ================= 4) نوتة تيك توك ================= */
#shape-tik .t-title { position: absolute; z-index: 20; top: 88px; left: 4px;
  font-family: 'Lemon', 'Cairo', serif; font-size: 26px; direction: ltr;
  white-space: nowrap;
  background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)) drop-shadow(0 0 12px var(--cm)); }
#shape-tik .glow-val { top: 128px; left: 6px; font-size: 20px; color: var(--v-col);
  text-shadow: 0 1px 0 rgba(0,0,0,.85), 0 0 12px var(--c); }
#shape-tik .pct { display: none; }
</style>
</head>
<body>
<div id="stage"><div class="gw" id="gw"></div></div>
<script>
/* إعداد الويدجت — على الباك اند __INITIAL_CONFIG__ بتتعوض بكونفج الحساب،
   وعلى الموقع الثابت السطر بيرمي ReferenceError بيتلقط ونكمل ديمو */
let CONFIG = {};
try { CONFIG = __INITIAL_CONFIG__; } catch (e) {}

const params = new URLSearchParams(location.search);
const PAGE_ID = params.get("id") || "goal-potion";
const shape  = (params.get("shape")  || CONFIG.shape  || "bottle").toLowerCase();
const type   = (params.get("type")   || CONFIG.type   || "likes").toLowerCase();
const goal   = parseInt(params.get("goal") || params.get("target") || CONFIG.target || 100) || 100;
const titleOverride = params.get("title") || CONFIG.title || "";

const TYPES = {
  likes:    { label: "Like Goal",   statsKey: "likes",      emoji: "❤️" },
  follows:  { label: "Follow Goal", statsKey: "followers",  emoji: "👥" },
  coins:    { label: "Gift Goal",   statsKey: "totalCoins", emoji: "🪙" },
  gifts:    { label: "Gift Goal",   statsKey: "gifts",      emoji: "🎁" },
  shares:   { label: "Share Goal",  statsKey: "shares",     emoji: "🔁" },
};
const T = TYPES[type] || TYPES.likes;
const LABEL = titleOverride || T.label;

/* الألوان — قريبة من الهوية المرجعية مع لمسة تغيير بسيطة، وباراميتر color بيعدها */
const DEF_COL = { bottle: "#ff1f1f", heart: "#f0447a", heartpotion: "#f25fc0", tik: "#0a84ff" };
const C = (params.get("color") || CONFIG.color || DEF_COL[shape] || "#f43f5e").replace("#", "");

/* أدوات لون */
function rgb(hex) { return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]; }
function shade(f) { const [r,g,b] = rgb(C); const m = v => Math.max(0, Math.min(255, Math.round(v * f))); return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")"; }
function colA(a) { const [r,g,b] = rgb(C); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }

document.documentElement.style.setProperty("--c", "#" + C);
document.documentElement.style.setProperty("--cm", colA(0.65));
document.documentElement.style.setProperty("--v-col", shade(1.25));
document.documentElement.style.setProperty("--pill", shade(0.85));

/* ================= عداد وديمو ================= */
let cur = Math.round(goal * 0.42);
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function pct() { return Math.max(0, Math.min(100, Math.round((cur / goal) * 100))); }

/* ================= بناء SVG لكل شكل ================= */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

const gw = document.getElementById("gw");
gw.id = "shape-" + shape;
let waveState = null; // { ctx: {W,H,liquidY(),...} }

/* مسار موجة سينية مغلقة لأسفل */
function waveD(W, H, yBase, amp, phase) {
  let d = "M -30 " + (H + 30) + " L -30 " + (yBase + Math.sin(phase) * amp).toFixed(1);
  for (let x = -30; x <= W + 30; x += 14) {
    const y = yBase + Math.sin(x / 58 + phase) * amp + Math.sin(x / 21 - phase * 1.7) * amp * 0.32;
    d += " L " + x + " " + y.toFixed(1);
  }
  d += " L " + (W + 30) + " " + (H + 30) + " Z";
  return d;
}
function waveTopD(W, H, yBase, amp, phase) {
  let d = "";
  for (let x = -30; x <= W + 30; x += 14) {
    const y = yBase + Math.sin(x / 58 + phase) * amp + Math.sin(x / 21 - phase * 1.7) * amp * 0.32;
    d += (d ? " L " : "M ") + x + " " + y.toFixed(1);
  }
  return d;
}

/* فقاعات جوه السائل */
function makeBubbles(parent, n, W, H, zone) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const c = el("circle", { r: (2 + Math.random() * 4).toFixed(1), fill: "rgba(255,255,255,0.5)", opacity: 0, cx: (Math.random() * W).toFixed(1), cy: H }, parent);
    arr.push({ c, x: Math.random(), v: 0.10 + Math.random() * 0.16, off: Math.random(), w: 0.5 + Math.random() * 1.4 });
  }
  return { arr, zone, W, H };
}

function startWaves(cfg) {
  waveState = cfg;
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const s = waveState; if (!s) return;
    s.phase += dt * s.speed;
    const yb = s.liquidY();
    s.back.setAttribute("d", waveD(s.W, s.H, yb + 5, s.amp * 1.15, s.phase * 0.82 + 1.4));
    s.front.setAttribute("d", waveD(s.W, s.H, yb, s.amp, s.phase));
    s.line.setAttribute("d", waveTopD(s.W, s.H, yb, s.amp, s.phase));
    for (const b of s.bub.arr) {
      b.off += dt * b.v;
      if (b.off > 1) { b.off = 0; b.c.setAttribute("cx", (Math.random() * s.W)); }
      const yy = s.H - b.off * (s.H - yb);
      b.c.setAttribute("cx", parseFloat(b.c.getAttribute("cx") || 0) + Math.sin(t / 400 * b.w) * 0.35);
      b.c.setAttribute("cy", yy);
      b.c.setAttribute("opacity", b.off < 0.12 ? (b.off / 0.12) * 0.75 : Math.max(0, 0.75 * (1 - (b.off - 0.12) / 0.9)));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- الشكل 1: الزجاجة ---------- */
function buildBottle() {
  const W = 520, H = 560;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  // جسم الزجاجة: رقبة طويلة ضيقة + أكتاف ملسا + جسم شبه أسطواني بقاع مستدير
  const bodyD = "M 228 98 L 228 165 C 228 184 216 194 198 206 C 162 230 146 260 146 296 L 146 450 C 146 478 168 495 198 495 L 322 495 C 352 495 374 478 374 450 L 374 296 C 374 260 358 230 322 206 C 304 194 292 184 292 165 L 292 98 Z";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  const clip = el("clipPath", { id: "bottleClip" }, defs);
  el("path", { d: bodyD }, clip);
  const gGrad = el("linearGradient", { id: "liqGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(0.5) }, gGrad);
  el("stop", { offset: "100%", "stop-color": "#" + C }, gGrad);
  const bGrad = el("linearGradient", { id: "backGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(0.66) }, bGrad);
  el("stop", { offset: "100%", "stop-color": shade(0.4) }, bGrad);

  // السائل (مقصوص جوه جسم الزجاجة)
  const liq = el("g", { "clip-path": "url(#bottleClip)" }, svg);
  const back = el("path", { fill: "url(#backGrad)", opacity: 0.9 }, liq);
  const front = el("path", { fill: "url(#liqGrad)" }, liq);
  const line = el("path", { fill: "none", stroke: "rgba(255,255,255,0.45)", "stroke-width": 2 }, liq);
  const bub = makeBubbles(liq, 9, W, H);

  // الزجاج فوق السائل — حد أبيض مضيء
  el("path", { d: bodyD, fill: "rgba(215,232,255,0.08)", stroke: "rgba(240,248,255,0.75)", "stroke-width": 3.5 }, svg);
  // لمعة رأسية طويلة على الشمال + لمعة قصيرة على اليمين
  el("path", { d: "M 178 252 C 166 282 160 314 160 348 L 160 430", fill: "none", stroke: "rgba(255,255,255,0.65)", "stroke-width": 11, "stroke-linecap": "round", opacity: 0.55 }, svg);
  el("path", { d: "M 358 300 L 358 400", fill: "none", stroke: "rgba(255,255,255,0.4)", "stroke-width": 7, "stroke-linecap": "round", opacity: 0.45 }, svg);
  el("path", { d: "M 244 122 L 244 158", fill: "none", stroke: "rgba(255,255,255,0.5)", "stroke-width": 6, "stroke-linecap": "round", opacity: 0.5 }, svg);

  // حلقة الفم
  el("rect", { x: 220, y: 92, width: 80, height: 14, rx: 7, fill: "rgba(235,245,255,0.2)", stroke: "rgba(255,255,255,0.7)", "stroke-width": 2.5 }, svg);

  // الفلينة — بسن وطرف داير
  const cork = el("g", {}, svg);
  el("path", { d: "M 234 46 C 234 40 240 36 246 36 L 274 36 C 280 36 286 40 286 46 L 286 96 L 234 96 Z", fill: "#c98d4f", stroke: "#7e5228", "stroke-width": 2.5 }, cork);
  el("ellipse", { cx: 260, cy: 42, rx: 26, ry: 8, fill: "#dfa96c" }, cork);
  el("path", { d: "M 241 58 h 38 M 239 72 h 42 M 241 86 h 38", stroke: "rgba(88,54,20,0.4)", "stroke-width": 2.5, "stroke-linecap": "round" }, cork);
  el("ellipse", { cx: 251, cy: 64, rx: 2.6, ry: 4.5, fill: "rgba(88,54,20,0.5)" }, cork);
  el("ellipse", { cx: 271, cy: 80, rx: 2.6, ry: 4, fill: "rgba(88,54,20,0.5)" }, cork);
  el("ellipse", { cx: 265, cy: 52, rx: 2, ry: 3.5, fill: "rgba(88,54,20,0.4)" }, cork);

  // نصوص
  const pill = document.createElement("div");
  pill.className = "pill"; pill.id = "pill";
  pill.style.background = "linear-gradient(135deg," + shade(0.8) + " 0%,#" + C + " 100%)";
  pill.style.boxShadow = "0 6px 25px " + colA(0.55) + ", 0 3px 10px rgba(0,0,0,0.3)";
  pill.textContent = LABEL;
  const val = document.createElement("div");
  val.className = "glow-val"; val.id = "val";
  const p = document.createElement("div");
  p.className = "pct"; p.id = "pct";
  p.style.backgroundImage = "linear-gradient(180deg,#fff 0%,#" + C + " 90%)";
  gw.appendChild(pill); gw.appendChild(val); gw.appendChild(p);

  startWaves({
    W, H, back, front, line, bub, phase: 0, speed: 1.6, amp: 7,
    liquidY: () => 495 - (Math.max(0, Math.min(1, cur / goal))) * 285,
  });
}

/* ---------- الشكل 2: القلب الكرتوني ---------- */
function buildHeart() {
  const W = 340, H = 310;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  const g = el("radialGradient", { id: "heartG", cx: "0.33", cy: "0.26", r: "1.05" }, defs);
  el("stop", { offset: "0%", "stop-color": shade(1.55) }, g);
  el("stop", { offset: "42%", "stop-color": "#" + C }, g);
  el("stop", { offset: "100%", "stop-color": shade(0.55) }, g);
  // قلب تخين ملمع
  const heartD = "M 170 296 C 82 244 18 190 18 114 C 18 54 66 20 117 20 C 142 20 162 33 170 50 C 178 33 198 20 223 20 C 274 20 322 54 322 114 C 322 190 258 244 170 296 Z";

  // توهج خارجي
  el("path", { d: heartD, fill: "none", stroke: colA(0.5), "stroke-width": 26, "stroke-linejoin": "round", opacity: 0.55, filter: "blur(3px)" }, svg);
  // جسم القلب
  el("path", { d: heartD, fill: "url(#heartG)", stroke: shade(0.5), "stroke-width": 4, "stroke-linejoin": "round" }, svg);
  // لمعة كبيرة
  el("path", { d: "M 58 100 C 52 74 70 48 96 40 C 106 37 112 47 104 54 C 84 64 72 82 74 102 C 74 112 60 112 58 100 Z", fill: "rgba(255,255,255,0.9)" }, svg);
  el("ellipse", { cx: 96, cy: 42, rx: 12, ry: 6.5, fill: "rgba(255,255,255,0.65)", transform: "rotate(-20 96 42)" }, svg);
  el("ellipse", { cx: 262, cy: 56, rx: 8, ry: 4.5, fill: "rgba(255,255,255,0.45)", transform: "rotate(24 262 56)" }, svg);

  // الوش: عيون لامعة + ابتسامة مفتوحة + خدود
  const face = el("g", {}, svg);
  el("ellipse", { cx: 120, cy: 128, rx: 18, ry: 22, fill: "#38101f" }, face);
  el("ellipse", { cx: 220, cy: 128, rx: 18, ry: 22, fill: "#38101f" }, face);
  el("circle", { cx: 114, cy: 119, r: 6.5, fill: "#fff" }, face);
  el("circle", { cx: 214, cy: 119, r: 6.5, fill: "#fff" }, face);
  el("circle", { cx: 125, cy: 134, r: 3, fill: "rgba(255,255,255,0.75)" }, face);
  el("circle", { cx: 225, cy: 134, r: 3, fill: "rgba(255,255,255,0.75)" }, face);
  el("path", { d: "M 140 164 C 152 184 188 184 200 164 C 197 194 143 194 140 164 Z", fill: "#5c1626", stroke: "#38101f", "stroke-width": 3, "stroke-linejoin": "round" }, face);
  el("path", { d: "M 153 182 C 161 192 179 192 187 182 C 180 173 160 173 153 182 Z", fill: "#ff8298" }, face);
  el("ellipse", { cx: 86, cy: 156, rx: 14, ry: 9, fill: "#ff97ab", opacity: 0.8 }, face);
  el("ellipse", { cx: 254, cy: 156, rx: 14, ry: 9, fill: "#ff97ab", opacity: 0.8 }, face);

  // التاج الدهبي — مايل شوية
  const crown = el("g", { transform: "translate(168,8) rotate(9)" }, svg);
  el("path", { d: "M -38 24 L -45 -14 L -20 4 L 0 -20 L 20 4 L 45 -14 L 38 24 Z", fill: "#ffc531", stroke: "#d3940f", "stroke-width": 3, "stroke-linejoin": "round" }, crown);
  el("rect", { x: -40, y: 22, width: 80, height: 14, rx: 6, fill: "#ffd764", stroke: "#d3940f", "stroke-width": 2.5 }, crown);
  el("circle", { cx: 0, cy: 9, r: 5, fill: "#ff4d6d", stroke: "#d3940f", "stroke-width": 1.5 }, crown);
  el("circle", { cx: -30, cy: 9, r: 3.5, fill: "#4dc3ff", stroke: "#d3940f", "stroke-width": 1.5 }, crown);
  el("circle", { cx: 45, cy: -16, r: 4.5, fill: "#fff", opacity: 0.95 }, crown);

  // لمّعات حوالين
  const sparkPts = [[22, 34, 14], [318, 60, 12], [30, 214, 11], [312, 200, 13], [196, 2, 9], [268, 12, 8]];
  for (const [sx, sy, ss] of sparkPts) {
    const sp = el("path", { class: "spark", d: sparkD(ss), fill: "#ffe9a8", transform: "translate(" + sx + "," + sy + ")" }, svg);
    sp.style.animationDelay = (Math.random() * 2).toFixed(2) + "s";
  }

  const pill = document.createElement("div");
  pill.className = "pill"; pill.id = "val";
  gw.appendChild(pill);
}

function sparkD(s) {
  return "M 0 " + (-s) + " C " + (s * 0.18) + " " + (-s * 0.18) + " " + (s * 0.18) + " " + (-s * 0.18) + " " + s + " 0 C " + (s * 0.18) + " " + (s * 0.18) + " " + (s * 0.18) + " " + (s * 0.18) + " 0 " + s + " C " + (-s * 0.18) + " " + (s * 0.18) + " " + (-s * 0.18) + " " + (s * 0.18) + " " + (-s) + " 0 C " + (-s * 0.18) + " " + (-s * 0.18) + " " + (-s * 0.18) + " " + (-s * 0.18) + " 0 " + (-s) + " Z";
}

/* ---------- الشكل 3: قلب الزجاجة ---------- */
function buildHeartPotion() {
  const W = 400, H = 470;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  // قلب زجاجة عريض — فصوص دايرية ونقطة مدببة تحت
  const innerD = "M 200 428 C 120 378 52 316 52 230 C 52 158 106 118 158 118 C 180 118 194 128 200 142 C 206 128 220 118 242 118 C 294 118 348 158 348 230 C 348 316 280 378 200 428 Z";
  const glassD = "M 200 440 C 116 388 42 322 42 230 C 42 152 100 108 158 108 C 182 108 196 118 200 132 C 204 118 218 108 242 108 C 300 108 358 152 358 230 C 358 322 284 388 200 440 Z";
  const clip = el("clipPath", { id: "hpClip" }, defs);
  el("path", { d: innerD }, clip);
  const gGrad = el("linearGradient", { id: "hpGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(0.6) }, gGrad);
  el("stop", { offset: "100%", "stop-color": shade(1.2) }, gGrad);

  const liq = el("g", { "clip-path": "url(#hpClip)" }, svg);
  const back = el("path", { fill: shade(0.48), opacity: 0.8 }, liq);
  const front = el("path", { fill: "url(#hpGrad)" }, liq);
  const line = el("path", { fill: "none", stroke: "rgba(255,255,255,0.55)", "stroke-width": 2.5 }, liq);

  // عيون بتسبح جوه السايل — كبيرة لامعة
  const eyes = [];
  for (let i = 0; i < 5; i++) {
    const r = 11 + Math.random() * 5;
    const gE = el("g", { opacity: 0 }, liq);
    el("circle", { r: r, fill: "#fdfbf5" }, gE);
    el("circle", { r: r * 0.42, fill: shade(0.55), cx: r * 0.15, cy: 0 }, gE);
    el("circle", { r: r * 0.22, fill: "#17141f", cx: r * 0.2, cy: 0 }, gE);
    el("circle", { r: r * 0.14, fill: "#fff", cx: -r * 0.25, cy: -r * 0.3 }, gE);
    el("circle", { r: r * 0.08, fill: "rgba(255,255,255,0.8)", cx: r * 0.4, cy: r * 0.25 }, gE);
    eyes.push({ g: gE, x: 0.2 + Math.random() * 0.6, off: Math.random(), v: 0.05 + Math.random() * 0.07 });
  }

  // الزجاج فوق — حد أبيض قوي
  el("path", { d: glassD, fill: "rgba(240,225,255,0.09)", stroke: "rgba(252,246,255,0.8)", "stroke-width": 4, "stroke-linejoin": "round" }, svg);
  el("path", { d: "M 84 230 C 80 268 92 306 116 336", fill: "none", stroke: "rgba(255,255,255,0.6)", "stroke-width": 10, "stroke-linecap": "round", opacity: 0.5 }, svg);
  el("path", { d: "M 128 158 C 116 168 106 182 100 198", fill: "none", stroke: "rgba(255,255,255,0.6)", "stroke-width": 8, "stroke-linecap": "round", opacity: 0.5 }, svg);

  // عنق قصير + فلينة فوق فتحة القلب
  el("path", { d: "M 176 74 L 224 74 L 218 126 L 182 126 Z", fill: "rgba(240,225,255,0.12)", stroke: "rgba(252,246,255,0.7)", "stroke-width": 3 }, svg);
  el("path", { d: "M 172 44 C 172 36 178 32 186 32 L 214 32 C 222 32 228 36 228 44 L 228 82 L 172 82 Z", fill: "#c98d4f", stroke: "#7e5228", "stroke-width": 2.5 }, svg);
  el("ellipse", { cx: 200, cy: 39, rx: 28, ry: 8, fill: "#dfa96c" }, svg);
  el("path", { d: "M 181 52 h 38 M 179 66 h 42", stroke: "rgba(88,54,20,0.4)", "stroke-width": 2.5, "stroke-linecap": "round" }, svg);

  // حبل ملفوف حوالين العنق + تاق متدلي
  el("path", { d: "M 170 104 C 186 122 214 122 230 104", fill: "none", stroke: "#b5793a", "stroke-width": 8, "stroke-linecap": "round" }, svg);
  el("path", { d: "M 172 113 C 188 130 212 130 228 113", fill: "none", stroke: "#96602c", "stroke-width": 8, "stroke-linecap": "round", opacity: 0.9 }, svg);
  el("path", { d: "M 232 116 C 248 128 256 140 254 152", fill: "none", stroke: "#b5793a", "stroke-width": 5, "stroke-linecap": "round" }, svg);
  const tag = el("g", { transform: "translate(262,172) rotate(18)" }, svg);
  el("rect", { x: -22, y: -16, width: 44, height: 34, rx: 6, fill: "#e8d5ae", stroke: "#a5824a", "stroke-width": 2.5 }, tag);
  el("circle", { cx: -13, cy: -8, r: 3, fill: "#8a6a38" }, tag);
  el("path", { d: "M -12 4 h 26 M -12 11 h 18", stroke: "rgba(120,90,45,0.55)", "stroke-width": 3, "stroke-linecap": "round" }, tag);

  // نصوص — بادج أحمر تحت القلب: "♥ Like Goal | 100 / 100"
  const p = document.createElement("div");
  p.className = "pct"; p.id = "pct";
  p.style.backgroundImage = "linear-gradient(180deg,#fff 0%,#" + C + " 95%)";
  const pill = document.createElement("div");
  pill.className = "pill"; pill.id = "pill";
  const labSpan = document.createElement("span");
  labSpan.textContent = "❤ " + LABEL;
  const sepSpan = document.createElement("span");
  sepSpan.className = "sep"; sepSpan.textContent = "|";
  const valSpan = document.createElement("span");
  valSpan.id = "val"; valSpan.textContent = "0 / " + fmt(goal);
  pill.appendChild(labSpan); pill.appendChild(sepSpan); pill.appendChild(valSpan);
  gw.appendChild(p); gw.appendChild(pill);

  startWaves({
    W, H, back, front, line, phase: 2, speed: 1.4, amp: 6,
    bub: { arr: [] },
    liquidY: () => 428 - (Math.max(0, Math.min(1, cur / goal))) * 268,
    eyes,
  });
  // حركة العيون
  let last = performance.now();
  (function eyeFrame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const yb = waveState.liquidY();
    for (const e of eyes) {
      e.off += dt * e.v;
      if (e.off > 1) { e.off = 0; e.x = 0.2 + Math.random() * 0.6; }
      const yy = 428 - e.off * (428 - Math.max(yb, 180));
      e.g.setAttribute("transform", "translate(" + (60 + e.x * 280 + Math.sin(t / 500 + e.off * 9) * 6) + "," + yy + ")");
      e.g.setAttribute("opacity", e.off < 0.1 ? e.off / 0.1 : Math.max(0, 1 - (e.off - 0.55) / 0.45));
    }
    requestAnimationFrame(eyeFrame);
  })(last);
}

/* ---------- الشكل 4: نوتة تيك توك ---------- */
function buildTik() {
  const W = 440, H = 560;
  gw.style.width = W + "px"; gw.style.height = H + "px";
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H }, gw);
  const defs = el("defs", {}, svg);
  // نوتة تيك توك مايلة: رأس بيضاوي كبير تحت + ساق سميكة + لفّة فوق — كلها مايلة 12 درجة
  // والسايل مش بيتمايل (الجاذبية أفقية) — القص نفسه هو اللي مايل
  const ROT = "rotate(12 200 330)";
  const headD = "M 210 492 C 136 492 78 444 78 378 C 78 312 136 264 210 264 C 284 264 342 312 342 378 C 342 444 284 492 210 492 Z";
  const headOuter = "M 210 504 C 128 504 66 452 66 378 C 66 304 128 252 210 252 C 292 252 354 304 354 378 C 354 452 292 504 210 504 Z";
  const stemD = "M 288 292 L 288 78 Q 288 66 300 66 L 322 66 Q 334 66 334 78 L 334 292 Z";
  const flagD = "M 334 80 C 374 90 396 118 392 154 C 389 182 372 204 348 212 C 364 190 366 164 354 142 C 346 126 338 108 334 94 Z";
  const clip = el("clipPath", { id: "tikClip" }, defs);
  el("path", { d: headD, transform: ROT }, clip);
  el("path", { d: stemD, transform: ROT }, clip);
  const gGrad = el("linearGradient", { id: "tikGrad", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": shade(1.3) }, gGrad);
  el("stop", { offset: "100%", "stop-color": shade(0.5) }, gGrad);

  // السايل — أفقي جوه القص المايل
  const liq = el("g", { "clip-path": "url(#tikClip)" }, svg);
  const back = el("path", { fill: shade(0.44), opacity: 0.85 }, liq);
  const front = el("path", { fill: "url(#tikGrad)" }, liq);
  const line = el("path", { fill: "none", stroke: "rgba(255,255,255,0.7)", "stroke-width": 2.5 }, liq);
  const bub = makeBubbles(liq, 8, W, H);

  // توهج الخطوط حوالين النوتة — فلتر جاوس سليم (فلتر CSS على جروب SVG بيبوظ الطبقة)
  const filt = el("filter", { id: "tikGlow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
  el("feGaussianBlur", { stdDeviation: 5 }, filt);
  const glowG = el("g", { transform: ROT, fill: "none", stroke: colA(0.55), "stroke-width": 8, filter: "url(#tikGlow)", opacity: 0.55 }, svg);
  el("path", { d: headOuter }, glowG);
  el("path", { d: stemD }, glowG);
  el("path", { d: flagD }, glowG);

  // زجاج النوتة فوق السايل
  const glassG = el("g", { transform: ROT }, svg);
  el("path", { d: headOuter, fill: "rgba(225,246,255,0.05)", stroke: "rgba(244,253,255,0.8)", "stroke-width": 4 }, glassG);
  el("path", { d: stemD, fill: "rgba(225,246,255,0.05)", stroke: "rgba(244,253,255,0.75)", "stroke-width": 3.5, "stroke-linejoin": "round" }, glassG);
  el("path", { d: flagD, fill: colA(0.14), stroke: "rgba(244,253,255,0.65)", "stroke-width": 3.5, "stroke-linejoin": "round" }, glassG);
  // لمعة جوه الرأس
  el("path", { d: "M 128 356 C 124 398 146 438 186 458", fill: "none", stroke: "rgba(255,255,255,0.55)", "stroke-width": 11, "stroke-linecap": "round", opacity: 0.5 }, glassG);
  el("path", { d: "M 300 120 L 300 250", fill: "none", stroke: "rgba(255,255,255,0.45)", "stroke-width": 7, "stroke-linecap": "round", opacity: 0.5 }, glassG);

  // فلينة فوق الساق — جوه المجموعة المايلة
  el("path", { d: "M 282 20 C 282 12 288 8 296 8 L 330 8 C 338 8 344 12 344 20 L 344 70 L 282 70 Z", fill: "#c98d4f", stroke: "#7e5228", "stroke-width": 2.5 }, glassG);
  el("ellipse", { cx: 313, cy: 15, rx: 30, ry: 8, fill: "#dfa96c" }, glassG);
  el("path", { d: "M 292 32 h 42 M 290 48 h 46", stroke: "rgba(88,54,20,0.4)", "stroke-width": 2.5, "stroke-linecap": "round" }, glassG);
  // حبل ملفوف تحت الفلينة
  el("path", { d: "M 284 76 C 296 88 322 88 342 76", fill: "none", stroke: "#c98a48", "stroke-width": 7, "stroke-linecap": "round" }, glassG);
  el("path", { d: "M 286 84 C 298 96 320 96 340 84", fill: "none", stroke: "#96602c", "stroke-width": 7, "stroke-linecap": "round" }, glassG);
  el("circle", { cx: 346, cy: 92, r: 7, fill: "#c98a48", stroke: "#7c4c1e", "stroke-width": 2 }, glassG);

  // نصوص — عنوان أزرق لامع + عداد تحته
  const t = document.createElement("div");
  t.className = "t-title"; t.id = "pill"; t.textContent = LABEL;
  t.style.backgroundImage = "linear-gradient(180deg,#9fd0ff 0%,#" + C + " 55%,#0a54b0 100%)";
  t.style.textShadow = "none";
  t.style.filter = "drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 14px " + colA(0.5) + ")";
  const v = document.createElement("div");
  v.className = "glow-val"; v.id = "val";
  v.style.textShadow = "0 2px 0 rgba(0,0,0,.6), 0 0 10px " + colA(0.5);
  gw.appendChild(t); gw.appendChild(v);

  startWaves({
    W, H, back, front, line, bub, phase: 1, speed: 1.5, amp: 6,
    liquidY: () => 488 - (Math.max(0, Math.min(1, cur / goal))) * 195,
  });
}

const BUILDERS = { bottle: buildBottle, heart: buildHeart, heartpotion: buildHeartPotion, tik: buildTik };
(BUILDERS[shape] || buildBottle)();

/* تحجيم تلقائي لمقاس المصدر في OBS */
function fit() {
  const w = gw.offsetWidth, h = gw.offsetHeight;
  if (!w || !h) return;
  const s = Math.min(window.innerWidth / w, window.innerHeight / h) * 0.96;
  gw.style.setProperty("--s", s.toFixed(3));
}
window.addEventListener("resize", fit);
fit(); setTimeout(fit, 300);

/* ================= تحديث العداد ================= */
function render() {
  const p = document.getElementById("pct");
  if (p) p.textContent = pct() + "%";
  const val = document.getElementById("val");
  if (val) {
    if (shape === "heart") val.textContent = fmt(cur) + " / " + fmt(goal);
    else val.textContent = fmt(cur) + " / " + fmt(goal);
  }
}

/* ديمو دائم — أول stats حقيقية بتعديها */
let gotReal = false;
render();
setInterval(function () {
  if (gotReal) return;
  const drift = (Math.random() - 0.42) * goal * 0.05;
  cur = Math.max(goal * 0.15, Math.min(goal, cur + drift));
  render();
}, 2200);

/* ================= بيانات لايف ================= */
let evtSource = null;
try { evtSource = new EventSource('/widgets/stream'); } catch (e) {}
if (evtSource) {
  evtSource.onmessage = (e) => {
    let m = null;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === "stats" && m.stats) {
      const v = m.stats[T.statsKey];
      if (v !== undefined) { cur = Math.max(0, Number(v) || 0); gotReal = true; render(); }
    } else if (m.type === "config" && m.id === PAGE_ID && m.config) {
      CONFIG = m.config || {};
      location.reload();
    } else if (m.type === "test") {
      cur = Math.min(goal, cur + Math.round(goal * 0.12));
      render();
    }
  };
}
</script>
