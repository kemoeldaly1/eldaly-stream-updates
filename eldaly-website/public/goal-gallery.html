<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ELDALY STREAM — Goal Widgets</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; background:
    radial-gradient(900px 500px at 12% -6%, rgba(255,166,60,0.10), transparent 60%), #050508;
    min-height: 100vh; color: #ece9e1; }
.head { text-align: center; padding: 36px 14px 20px; }
.head h1 { font-size: 24px; font-weight: 900; color: #f2dc93;
    text-shadow: 0 0 20px rgba(212,175,55,0.3); margin-bottom: 6px; }
.head p { font-size: 13px; color: #6d6960; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 18px; max-width: 1200px; margin: 0 auto 40px; padding: 0 14px; }
.gcard { position: relative; background: #0d0d12; border: 2px solid rgba(255,255,255,0.08);
    border-radius: 16px; overflow: hidden; cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .18s; }
.gcard:hover { transform: translateY(-4px); border-color: rgba(212,175,55,0.4); }
.gcard.sel { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212,175,55,0.15), 0 0 50px rgba(212,175,55,0.1); }
.gframe { width: 100%; height: 420px; border: 0; pointer-events: none; display: block; background: #060609; }
.gname { text-align: center; font-size: 14.5px; font-weight: 800; color: #ece9e1;
    padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.06); background: #101016; }
.gname small { display: block; font-size: 10.5px; color: #6d6960; font-weight: 600; margin-top: 2px; }
.gradio { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.5); z-index: 5;
    display: flex; align-items: center; justify-content: center; }
.gcard.sel .gradio { border-color: #d4af37; }
.gcard.sel .gradio::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #d4af37; }
.glink { position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%);
    z-index: 5; background: rgba(0,0,0,0.65); border: 1px solid rgba(212,175,55,0.3);
    color: #ecd28a; font-size: 10px; padding: 3px 10px; border-radius: 4px;
    font-family: monospace; direction: ltr; cursor: pointer; white-space: nowrap; }
.glink:hover { border-color: #d4af37; }
.typebar { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
.typebar button { font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 800;
    background: #14141b; color: #b9b4a6; border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 7px 18px; cursor: pointer; transition: all .15s; }
.typebar button.on { background: rgba(212,175,55,0.16); color: #f2dc93; border-color: #d4af37; }
</style>
</head>
<body>
<div class="head">
  <h1>🎯 ELDALY STREAM — Goal Widgets</h1>
  <p>اضغط على الشكل اللي عاجبك ليتم نسخ لينك OBS — واختار نوع الهدف من فوق</p>
</div>
<div class="typebar" id="typebar"></div>
<div class="grid" id="grid"></div>
<div style="text-align:center; color: #6d6960; font-size: 12px; padding: 10px 20px 50px; direction: rtl;">
  اللينك بيتحط في OBS كمصدر Browser — العداد بيشتغل لايف مع اللايف بتاعك
</div>
<script>
(function() {
  const SHAPES = [
    { id: "bottle",      name: "🧪 زجاجة الهدف",        desc: "زجاجة زجاجية بتملى من تحت — الاسم والنسبة فوق" },
    { id: "heart",       name: "💗 القلب الملك",         desc: "قلب كرتوني بتاج — العداد في بادج دهبي تحت" },
    { id: "heartpotion", name: "💜 جرعة القلوب",         desc: "قلب زجاجي بفلينة وحبل — عيون بتسبح في السايل" },
    { id: "tik",         name: "🎵 نوتة تيك توك",        desc: "نوتة زجاجية مضيئة — الاسم والعداد فوق" },
  ];
  const TYPES = [
    { id: "likes",   name: "❤️ لايكات" },
    { id: "follows", name: "👥 متابعين" },
    { id: "coins",   name: "🪙 كوينز" },
    { id: "shares",  name: "🔁 مشاركات" },
  ];
  const grid = document.getElementById("grid");
  const typebar = document.getElementById("typebar");
  let selType = localStorage.getItem("eldaly_goal_type") || "likes";
  let selected = localStorage.getItem("eldaly_goal_shape") || "bottle";

  TYPES.forEach(function(t) {
    const b = document.createElement("button");
    b.textContent = t.name;
    b.className = t.id === selType ? "on" : "";
    b.onclick = function() {
      selType = t.id;
      localStorage.setItem("eldaly_goal_type", selType);
      typebar.querySelectorAll("button").forEach(function(x, i) { x.classList.toggle("on", TYPES[i].id === selType); });
      document.querySelectorAll(".gframe").forEach(function(f) {
        const s = f.dataset.shape;
        f.src = "goal-widget.html?shape=" + s + "&type=" + selType + "&goal=100";
      });
    };
    typebar.appendChild(b);
  });

  SHAPES.forEach(function(l) {
    const card = document.createElement("div");
    card.className = "gcard" + (l.id === selected ? " sel" : "");
    card.dataset.id = l.id;
    card.innerHTML =
      '<div class="gradio"></div>'
      + '<iframe class="gframe" data-shape="' + l.id + '" src="goal-widget.html?shape=' + l.id + '&type=' + selType + '&goal=100"></iframe>'
      + '<div class="glink">goal-potion?shape=' + l.id + '</div>'
      + '<div class="gname">' + l.name + '<small>' + l.desc + '</small></div>';
    card.onclick = function() {
      selected = l.id;
      localStorage.setItem("eldaly_goal_shape", selected);
      document.querySelectorAll(".gcard").forEach(function(c) { c.classList.toggle("sel", c.dataset.id === l.id); });
      const obs = "https://eldaly-stream-backend.onrender.com/widgets/<TOKEN>/goal-potion?shape=" + l.id + "&type=" + selType + "&goal=100";
      navigator.clipboard.writeText(obs).then(function() {
        card.querySelector(".gname").childNodes[0].textContent = l.name + " ✅ تم النسخ!";
        setTimeout(function() { card.querySelector(".gname").childNodes[0].textContent = l.name; }, 1600);
      });
    };
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
