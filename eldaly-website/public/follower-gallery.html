<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ELDALY STREAM — Follower Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; background:
    radial-gradient(900px 500px at 12% -6%, rgba(255,166,60,0.10), transparent 60%), #050508;
    min-height: 100vh; color: #ece9e1; }
.head { text-align: center; padding: 36px 14px 20px; }
.head h1 { font-size: 24px; font-weight: 900; color: #f2dc93;
    text-shadow: 0 0 20px rgba(212,175,55,0.3); margin-bottom: 6px; }
.head p { font-size: 13px; color: #6d6960; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 18px; max-width: 1300px; margin: 0 auto 40px; padding: 0 14px; }
.gcard { position: relative; background: #0d0d12; border: 2px solid rgba(255,255,255,0.08);
    border-radius: 16px; overflow: hidden; cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .18s; }
.gcard:hover { transform: translateY(-4px); border-color: rgba(212,175,55,0.4); }
.gcard.sel { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212,175,55,0.15), 0 0 50px rgba(212,175,55,0.1); }
.gframe { width: 100%; height: 330px; border: 0; pointer-events: none; display: block; background: #060609; }
.gname { text-align: center; font-size: 14.5px; font-weight: 800; color: #ece9e1;
    padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.06); background: #101016; }
.gname small { display: block; font-size: 10.5px; color: #6d6960; font-weight: 600; margin-top: 2px; }
.gradio { position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.5); z-index: 5;
    display: flex; align-items: center; justify-content: center; }
.gcard.sel .gradio { border-color: #d4af37; }
.gcard.sel .gradio::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #d4af37; }
.note { text-align:center; color: #6d6960; font-size: 12px; padding: 10px 20px 50px; direction: rtl; }
</style>
</head>
<body>
<div class="head">
  <h1>👥 ELDALY STREAM — كرت المتابعين</h1>
  <p>الصورة + اسم اللايف + إجمالي المتابعين — وكل فولو جديد: صوت + حركة داخل الكرت</p>
</div>
<div class="grid" id="grid"></div>
<div class="note">الصوت مقفول في المعاينة — افتح لينك الشكل لوحدك عشان تسمعه — عداد الديمو بيزيد لوحده لحد ما توصل stats حقيقية من اللايف</div>
<script>
(function() {
  const SHAPES = [
    { id: "classic", name: "🏆 كلاسيك",  desc: "كرت طولي: الصورة فوق والاسم والعداد تحت", h: 430 },
    { id: "glass",   name: "🪞 جلاس",    desc: "كرت أفقي زجاجي: الصورة يمين والعداد شمال", h: 260 },
    { id: "bar",     name: "📏 بار",      desc: "شريط نحيف لتحت الشاشة", h: 220 },
    { id: "neon",    name: "🌈 نيون",     desc: "إطار ملون متحرك حوالين الكرت", h: 450 },
  ];
  const grid = document.getElementById("grid");
  let selected = localStorage.getItem("eldaly_fav_shape") || "classic";

  SHAPES.forEach(function(l) {
    const card = document.createElement("div");
    card.className = "gcard" + (l.id === selected ? " sel" : "");
    card.dataset.id = l.id;
    card.innerHTML =
      '<div class="gradio"></div>'
      + '<iframe class="gframe" style="height:' + l.h + 'px" src="follower-card.html?shape=' + l.id + '&name=ELDALY%20STREAM&start=12400&mute=1"></iframe>'
      + '<div class="gname">' + l.name + '<small>' + l.desc + '</small></div>';
    card.onclick = function() {
      selected = l.id;
      localStorage.setItem("eldaly_fav_shape", selected);
      document.querySelectorAll(".gcard").forEach(function(c) { c.classList.toggle("sel", c.dataset.id === l.id); });
      const obs = "https://eldaly-stream-backend.onrender.com/widgets/<TOKEN>/follower-card?shape=" + l.id
        + "&name=" + encodeURIComponent("ELDALY STREAM")
        + "&avatar=<رابط-الصورة>&vol=0.7";
      navigator.clipboard.writeText(obs).then(function() {
        card.querySelector(".gname").childNodes[0].textContent = l.name + " ✅ تم النسخ!";
        setTimeout(function() { card.querySelector(".gname").childNodes[0].textContent = l.name; }, 1600);
      });
    };
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
