<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELDALY STREAM — تغيير كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif; min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #16120a 0%, #0a0a0c 55%, #060608 100%);
    color: #ece9e1; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 420px; max-width: 96%;
    background: #131318; border: 1px solid rgba(255,255,255,.07);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 14px 44px rgba(0,0,0,.6), 0 0 0 1px rgba(212,175,55,.07);
  }
  .top { height: 2px; background: linear-gradient(90deg, transparent, #d4af37, transparent); }
  .body { padding: 34px 32px 30px; }
  .brand {
    text-align: center; font-family: 'Cinzel', serif; font-size: 23px; font-weight: 700; letter-spacing: 3px;
    background: linear-gradient(135deg, #f2dc93, #d4af37 60%, #a17c1e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { text-align: center; font-size: 12.5px; color: #6d6960; margin-bottom: 24px; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #a6a198; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; font-size: 14px; font-family: 'Cairo', sans-serif;
    background: #0f0f14; border: 1px solid rgba(255,255,255,.09);
    border-radius: 8px; color: #ece9e1; outline: none; transition: all .18s;
    direction: ltr; text-align: left;
  }
  .field input:focus { border-color: rgba(212,175,55,.55); box-shadow: 0 0 0 3px rgba(212,175,55,.12); }
  .btn {
    width: 100%; padding: 13px; margin-top: 6px;
    font-family: 'Cairo', sans-serif; font-size: 14.5px; font-weight: 800; letter-spacing: .3px;
    background: linear-gradient(180deg, #e8ca74, #c69c2d); color: #201803;
    border: none; border-radius: 8px; cursor: pointer;
    box-shadow: 0 2px 12px rgba(212,175,55,.22), inset 0 1px 0 rgba(255,255,255,.25);
    transition: all .18s;
  }
  .btn:hover { filter: brightness(1.08); }
  .msg { min-height: 20px; margin-top: 14px; text-align: center; font-size: 12.5px; font-weight: 700; }
  .msg.ok { color: #57a273; }
  .msg.bad { color: #c65a54; }
  .msg.info { color: #7391bd; }
  .state { text-align: center; padding: 20px 0; }
  .state .big { font-size: 44px; margin-bottom: 14px; }
  .state h2 { font-size: 17px; color: #ecd28a; margin-bottom: 10px; }
  .state p { font-size: 13px; color: #a6a198; line-height: 2; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 16px;
    border: 3px solid rgba(212,175,55,.2); border-top-color: #d4af37; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { text-align: center; font-size: 11.5px; color: #6d6960; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="top"></div>
  <div class="body">
    <div class="brand">ELDALY STREAM</div>

    <div id="view">
      <div class="state">
        <div class="spinner"></div>
        <p>جاري التحقق من الرابط...</p>
      </div>
    </div>

  </div>
</div>

<script>
  const API_KEY = 'AIzaSyA88qSpFDSQVWFZZWNSjv1XwYFpelpDmWo';
  const view = document.getElementById('view');

  // قراءة الباراميترات من الرابط
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') || '';
  const oobCode = params.get('oobCode') || '';
  const API = (action) => `https://identitytoolkit.googleapis.com/v1/accounts:${action}?key=${API_KEY}`;

  function render(html) { view.innerHTML = html; }

  function showError(title, text) {
    render(`<div class="state">
      <div class="big">⚠️</div>
      <h2>${title}</h2>
      <p>${text}</p>
      <p style="margin-top:12px">ارجع لبرنامج ELDALY STREAM واطلب لينك جديد من «نسيت الباسورد؟»</p>
    </div>`);
  }

  async function start() {
    if (mode !== 'resetPassword' || !oobCode) {
      return showError('الرابط غير صحيح', 'الرابط اللي فتحته ناقص أو غلط.');
    }
    try {
      // التحقق من صلاحية الكود (بيرجع الإيميل لو سليم)
      const r = await fetch(API('resetPassword'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oobCode }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        if ((d.error && d.error.message || '').includes('INVALID_EXPIRED_OOB_CODE')) {
          return showError('الرابط انتهت صلاحيته', 'لينك تغيير الباسورد بيشتغل ساعة واحدة بس — بعدها بيتلغي.');
        }
        return showError('مشكلة في الرابط', (d.error && d.error.message) || 'تعذر التحقق — جرب تاني.');
      }
      renderForm(d.email || '');
    } catch (e) {
      return showError('مشكلة في الاتصال', 'شوف النت وحدث الصفحة.');
    }
  }

  function renderForm(email) {
    const masked = email ? email.replace(/^(.{2}).*(@.*)$/, '$1***$2') : '';
    render(`
      <div class="sub">${masked ? 'تغيير كلمة مرور حساب ' + masked : 'كلمة مرور جديدة'}</div>
      <div class="field">
        <label>كلمة المرور الجديدة (6 حروف على الأقل)</label>
        <input type="password" id="p1" placeholder="••••••••" dir="ltr">
      </div>
      <div class="field">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="p2" placeholder="••••••••" dir="ltr">
      </div>
      <button class="btn" id="saveBtn">تغيير كلمة المرور</button>
      <div class="msg" id="m"></div>
      <div class="note">🔒 الباسورد بيتخزن مشفر عند جوجل — حتى إحنا مش شايفينه</div>
    `);
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const m = document.getElementById('m');
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      if (!p1 || !p2) { m.textContent = 'املأ الخانتين'; m.className = 'msg bad'; return; }
      if (p1 !== p2) { m.textContent = 'الباسورد وتأكيده مش متطابقين'; m.className = 'msg bad'; return; }
      if (p1.length < 6) { m.textContent = 'الباسورد ضعيف — 6 حروف على الأقل'; m.className = 'msg bad'; return; }
      m.textContent = 'جاري الحفظ...';
      m.className = 'msg info';
      try {
        const r = await fetch(API('resetPassword'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oobCode, newPassword: p1 }),
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          m.textContent = (d.error && d.error.message || '').includes('EXPIRED') || (d.error && d.error.message || '').includes('INVALID')
            ? 'الرابط انتهت صلاحيته — اطلب واحد جديد من البرنامج'
            : 'تعذر الحفظ — جرب تاني';
          m.className = 'msg bad';
          return;
        }
        render(`<div class="state">
          <div class="big">✅</div>
          <h2>تم تغيير كلمة المرور بنجاح</h2>
          <p>ارجع لبرنامج ELDALY STREAM وسجّل دخول بالباسورد الجديد</p>
        </div>`);
      } catch (e) {
        m.textContent = 'مشكلة في الاتصال — جرب تاني';
        m.className = 'msg bad';
      }
    });
  }

  start();
</script>
</body>
</html>
