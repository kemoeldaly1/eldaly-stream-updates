<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ELDALY STREAM — Dragon Egg Goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Cairo', sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; left: 50%; top: 50%; width: 640px; height: 640px; transform-origin: center center; pointer-events: none; z-index: 5; }
.pill {
  position: absolute; top: 8px; left: 4px; z-index: 20; white-space: nowrap; font-weight: 900; color: #fff;
  padding: 7px 18px; border-radius: 14px; font-size: 19px;
  background: linear-gradient(180deg, rgba(20,26,34,0.92), rgba(10,13,18,0.92));
  border: 1.5px solid rgba(255,255,255,0.22);
  box-shadow: 0 8px 26px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,0.14);
}
.pill b { color: var(--c); }
.glow-val { position: absolute; top: 14px; right: 4px; z-index: 20; font-family: 'Orbitron', sans-serif;
  font-weight: 800; direction: ltr; white-space: nowrap; letter-spacing: 1px; font-size: 22px; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,.85), 0 0 18px var(--cm); }
#bar { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 440px; height: 16px;
  border-radius: 999px; background: rgba(8,10,14,0.72);
  border: 1.5px solid rgba(255,255,255,0.22);
  box-shadow: 0 6px 22px rgba(0,0,0,.5), inset 0 2px 6px rgba(0,0,0,.7); overflow: hidden; z-index: 20; }
#barfill { height: 100%; width: 42%; border-radius: 999px; position: relative;
  background: linear-gradient(90deg, var(--pill), var(--c));
  box-shadow: 0 0 14px var(--cm); transition: width .3s ease; }
#barfill::after { content: ""; position: absolute; inset: 2px 35% 52% 5px; border-radius: 999px;
  background: rgba(255,255,255,0.4); }
#pctlab { position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%); z-index: 20;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 19px; color: #fff; direction: ltr;
  text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 18px var(--cm); }
#fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; text-align: center; padding: 20px; z-index: 50; }
</style>
</head>
<body>
<div id="hud">
  <div id="bar"><div id="barfill"></div></div>
  <div id="pctlab">42%</div>
</div>
<div id="fallback">المتصفح مش بيدعم WebGL</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
/* إعداد الويدجت — على الباك اند __INITIAL_CONFIG__ بتتعوض بكونفج الحساب */
let CONFIG = {};
try { CONFIG = __INITIAL_CONFIG__; } catch (e) {}

const params = new URLSearchParams(location.search);
const PAGE_ID = params.get("id") || "goal-dragon";
const type   = (params.get("type")   || CONFIG.type   || "likes").toLowerCase();
const goal   = parseInt(params.get("goal") || params.get("target") || CONFIG.target || 100) || 100;
const startPct = parseFloat(params.get("start"));
const titleOverride = params.get("title") || CONFIG.title || "";

const TYPES = {
  likes:    { label: "لايكات",    statsKey: "likes",      emoji: "💖" },
  follows:  { label: "متابعين",   statsKey: "followers",  emoji: "✨" },
  coins:    { label: "كوينز",     statsKey: "totalCoins", emoji: "🌟" },
  gifts:    { label: "هدايا",     statsKey: "gifts",      emoji: "🎁" },
  shares:   { label: "مشاركات",   statsKey: "shares",     emoji: "🍥" },
};
const T = TYPES[type] || TYPES.likes;
const LABEL = titleOverride || (T.emoji + " فقّس التنين — هدف " + T.label);

const C = (params.get("color") || CONFIG.color || "#7ce0a0").replace("#", "");
function rgb(hex) { return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]; }
function shade(f) { const [r,g,b] = rgb(C); const m = v => Math.max(0, Math.min(255, Math.round(v * f))); return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")"; }
function colA(a) { const [r,g,b] = rgb(C); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }
function colN(f) { const [r,g,b] = rgb(C); const m = v => Math.max(0, Math.min(255, Math.round(v * f))); return (m(r) << 16) | (m(g) << 8) | m(b); }

document.documentElement.style.setProperty("--c", "#" + C);
document.documentElement.style.setProperty("--cm", colA(0.7));
document.documentElement.style.setProperty("--pill", shade(0.85));

let cur = Math.round(goal * 0.42);
if (!isNaN(startPct)) cur = Math.round(goal * Math.max(0, Math.min(100, startPct)) / 100);
let shown = cur;
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

const hud = document.getElementById("hud");
function fit() {
  const s = Math.min(window.innerWidth / 640, window.innerHeight / 640) * 0.96;
  hud.style.transform = "translate(-50%,-50%) scale(" + s.toFixed(3) + ")";
}
window.addEventListener("resize", fit); fit();

const pillEl = document.createElement("div");
pillEl.className = "pill";
pillEl.innerHTML = LABEL.replace(T.emoji, "<b>" + T.emoji + "</b>");
hud.appendChild(pillEl);
const valEl = document.createElement("div");
valEl.className = "glow-val"; hud.appendChild(valEl);
const barFill = document.getElementById("barfill");
const pctLab = document.getElementById("pctlab");

function renderHUD() {
  const p = Math.max(0, Math.min(100, Math.round((cur / goal) * 100)));
  pctLab.textContent = p + "%";
  barFill.style.width = Math.max(2, p) + "%";
  valEl.textContent = fmt(shown) + " / " + fmt(goal);
}

if (!window.THREE) {
  document.getElementById("fallback").style.display = "flex";
} else {

/* ============ مشهد واقعي ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
camera.position.set(0, 1.7, 8.2); camera.lookAt(0, 1.4, 0);

/* بيئة استوديو فوتوريال مبنية إجرائيًا */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
(() => {
  const cvs = document.createElement("canvas"); cvs.width = 16; cvs.height = 256;
  const ctx = cvs.getContext("2d");
  const gr = ctx.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, "#31394a"); gr.addColorStop(0.5, "#151922"); gr.addColorStop(1, "#07090d");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, 16, 256);
  const domeTex = new THREE.CanvasTexture(cvs);
  domeTex.colorSpace = THREE.SRGBColorSpace;
  envScene.add(new THREE.Mesh(
    new THREE.SphereGeometry(20, 16, 16),
    new THREE.MeshBasicMaterial({ map: domeTex, side: THREE.BackSide })
  ));
  function box(w, h, x, y, z, ry, rx, col, inten) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(inten) })
    );
    m.position.set(x, y, z); m.rotation.y = ry; m.rotation.x = rx;
    envScene.add(m);
  }
  box(8, 3, 0, 8, 1, 0, Math.PI / 2, 0xffe8cf, 6.0);
  box(4, 7, -8, 2, 3, Math.PI / 2, 0, 0xffffff, 4.5);
  box(3, 5, 7, 1, -4, -Math.PI / 2.2, 0, 0xbcd2f2, 2.6);
  box(0.7, 9, 6.5, 2, 4, -Math.PI / 2, 0, 0xffffff, 5.0);
})();
scene.environment = pmrem.fromScene(envScene, 0.05).texture;
pmrem.dispose();

/* إضاءة */
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x14181c, 0.35));
const keyLight = new THREE.DirectionalLight(0xfff1dd, 1.5);
keyLight.position.set(3.5, 7, 5); scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(colN(1.2), 1.0);
rimLight.position.set(-5, 2.5, -4); scene.add(rimLight);

/* ---- خامات القشرة الفوتوريالية (لون + بارمب + توهج شقوق) ---- */
function hash(i) { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
function drawCrack(x, S, x0, y0, steps, width, color) {
  x.strokeStyle = color; x.lineWidth = width; x.lineCap = "round"; x.lineJoin = "round";
  x.beginPath(); x.moveTo(x0, y0);
  let cx = x0, cy = y0, a = Math.random() * Math.PI * 2;
  for (let i = 0; i < steps; i++) {
    a += (Math.random() - 0.5) * 1.4;
    cx += Math.cos(a) * (18 + Math.random() * 34);
    cy += Math.sin(a) * (16 + Math.random() * 30);
    x.lineTo(cx, cy);
    // تفريعة جانبية
    if (Math.random() < 0.4) {
      const bx = cx, by = cy, ba = a + (Math.random() - 0.5) * 2.4;
      x.lineTo(bx + Math.cos(ba) * 24, by + Math.sin(ba) * 24);
      x.moveTo(cx, cy);
    }
  }
  x.stroke();
}
function eggMaps(stage) {
  const S = 768;
  const col = document.createElement("canvas"); col.width = col.height = S;
  const bmp = document.createElement("canvas"); bmp.width = bmp.height = S;
  const emi = document.createElement("canvas"); emi.width = emi.height = S;
  const c = col.getContext("2d"), b = bmp.getContext("2d"), e = emi.getContext("2d");
  // أساس جلدي غامق متدرج من لون الثيم
  const [r, g, b2] = rgb(C);
  const base = "rgb(" + Math.round(r * 0.42) + "," + Math.round(g * 0.46) + "," + Math.round(b2 * 0.4) + ")";
  c.fillStyle = base; c.fillRect(0, 0, S, S);
  b.fillStyle = "#808080"; b.fillRect(0, 0, S, S);
  e.fillStyle = "#000"; e.fillRect(0, 0, S, S);
  // بقع مرقطة ( camouflage )
  for (let i = 0; i < 90; i++) {
    const px = hash(i * 3.1) * S, py = S * 0.06 + hash(i * 7.7) * S * 0.85;
    const pr = 12 + hash(i * 1.3) * 42;
    const dk = hash(i * 5.9) > 0.5;
    c.fillStyle = dk ? "rgba(0,0,0,0.22)" : "rgba(255,255,255,0.09)";
    c.beginPath(); c.ellipse(px, py, pr, pr * 0.72, hash(i) * 3, 0, 7); c.fill();
    b.fillStyle = dk ? "rgba(0,0,0,0.25)" : "rgba(255,255,255,0.2)";
    b.beginPath(); b.ellipse(px, py, pr, pr * 0.72, 0, 0, 7); b.fill();
  }
  // نمط حراشف دقيقة
  const cell = 22;
  for (let yy = 0, row = 0; yy < S; yy += cell * 0.72, row++) {
    for (let xx = (row % 2 ? cell / 2 : 0); xx < S; xx += cell) {
      const rr = cell * 0.52;
      c.strokeStyle = "rgba(0,0,0,0.18)"; c.lineWidth = 1.6;
      c.beginPath(); c.arc(xx, yy, rr, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
      b.strokeStyle = "rgba(255,255,255,0.35)"; b.lineWidth = 2;
      b.beginPath(); b.arc(xx, yy, rr, 0.15 * Math.PI, 0.85 * Math.PI); b.stroke();
    }
  }
  // شقوق متوهجة + قشرة متصدعة
  const n = stage === 0 ? 0 : stage === 1 ? 4 : stage === 2 ? 9 : 14;
  for (let i = 0; i < n; i++) {
    const x0 = 50 + hash(i * 13.7 + stage) * (S - 100);
    const y0 = S * 0.2 + hash(i * 3.3 + stage) * S * 0.55;
    if (stage >= 1) {
      // وهج نار جوه الشق — برتقالي ساخن مخلوط بلون الثيم
      drawCrack(c, S, x0, y0, 7, 7, "rgba(" + Math.min(255, r + 160) + "," + Math.round(g * 0.75 + 60) + ",40,0.95)");
      drawCrack(e, S, x0, y0, 7, 6, "rgba(" + Math.min(255, r + 170) + "," + Math.round(g * 0.8 + 70) + ",50,0.95)");
    }
    drawCrack(c, S, x0, y0, 7, 3, "rgba(10,6,4,0.95)");
    drawCrack(b, S, x0, y0, 7, 5, "rgba(0,0,0,0.95)");
  }
  function tex(cv) {
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  return { map: tex(col), bump: tex(bmp), emi: tex(emi) };
}
const EGG_STAGES = [eggMaps(0), eggMaps(1), eggMaps(2), eggMaps(3)];
const eggGlowCol = new THREE.Color(colN(1.5));

/* قص فتح القشرة عند الفقس */
const shellClip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 99);

/* ---- البيضة ---- */
const eggGroup = new THREE.Group();
scene.add(eggGroup);
const eggPts = [
  new THREE.Vector2(0.03, 0.02), new THREE.Vector2(0.85, 0.08), new THREE.Vector2(1.22, 0.42),
  new THREE.Vector2(1.34, 0.95), new THREE.Vector2(1.28, 1.5), new THREE.Vector2(1.05, 2.0),
  new THREE.Vector2(0.78, 2.4), new THREE.Vector2(0.52, 2.65), new THREE.Vector2(0.06, 2.78),
];
const eggGeo = new THREE.LatheGeometry(eggPts, 80);
const eggMat = new THREE.MeshPhysicalMaterial({
  map: EGG_STAGES[0].map, bumpMap: EGG_STAGES[0].bump, bumpScale: 1.1,
  emissiveMap: EGG_STAGES[0].emi, emissive: eggGlowCol, emissiveIntensity: 0.6,
  roughness: 0.42, metalness: 0,
  clearcoat: 0.65, clearcoatRoughness: 0.3,
  envMapIntensity: 0.9,
  side: THREE.DoubleSide, clippingPlanes: [shellClip],
});
const egg = new THREE.Mesh(eggGeo, eggMat);
eggGroup.add(egg);

/* نوار من جوه البيضة */
const glow = new THREE.PointLight(colN(1.4), 2, 9);
glow.position.set(0, 1.3, 0.35);
eggGroup.add(glow);

/* أرضية وظل ناعم */
(() => {
  const c = document.createElement("canvas"); c.width = 256; c.height = 128;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(128, 64, 6, 128, 64, 120);
  g.addColorStop(0, "rgba(0,0,0,0.55)");
  g.addColorStop(0.6, "rgba(0,0,0,0.28)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  x.scale(1, 0.5); x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(8, 4),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.02;
  scene.add(m);
})();

/* ---- التنين الصغير ---- */
const dragon = new THREE.Group();
dragon.visible = false;
scene.add(dragon);
const bodyMat = new THREE.MeshPhysicalMaterial({
  color: colN(0.9), roughness: 0.5, metalness: 0,
  clearcoat: 0.35, clearcoatRoughness: 0.4, envMapIntensity: 0.7,
});
const bellyMat = new THREE.MeshPhysicalMaterial({ color: 0xe8d9b8, roughness: 0.55, envMapIntensity: 0.5 });
const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 32), bodyMat);
body.scale.set(1, 1.12, 0.92); dragon.add(body);
const belly = new THREE.Mesh(new THREE.SphereGeometry(0.5, 28, 28), bellyMat);
belly.scale.set(0.72, 0.85, 0.4); belly.position.set(0, -0.12, 0.42); dragon.add(belly);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 32, 32), bodyMat);
head.scale.set(1.05, 0.95, 0.95); head.position.set(0, 0.72, 0.1); dragon.add(head);
const snout = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 20), bodyMat);
snout.scale.set(1.2, 0.7, 0.8); snout.position.set(0, 0.6, 0.46); dragon.add(snout);
for (const sx of [-1, 1]) {
  const nos = new THREE.Mesh(new THREE.SphereGeometry(0.026, 8, 8), new THREE.MeshBasicMaterial({ color: 0x140a08 }));
  nos.position.set(0.07 * sx, 0.65, 0.62); dragon.add(nos);
}
// عيون زواحف لامعة — صفرا ببؤة عمودية
for (const sx of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 22, 22),
    new THREE.MeshPhysicalMaterial({ color: 0xffc23a, roughness: 0.05, clearcoat: 1, envMapIntensity: 1.6 }));
  eye.scale.set(0.95, 1.15, 0.55); eye.position.set(0.21 * sx, 0.84, 0.36); dragon.add(eye);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), new THREE.MeshBasicMaterial({ color: 0x0c0806 }));
  pupil.scale.set(0.45, 1.5, 0.5); pupil.position.set(0.21 * sx, 0.84, 0.46); dragon.add(pupil);
  const hl = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  hl.position.set(0.21 * sx - 0.05 * sx, 0.94, 0.5); dragon.add(hl);
}
// قرنين وشوك
for (const sx of [-1, 1]) {
  const horn = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.3, 12),
    new THREE.MeshPhysicalMaterial({ color: 0x2c2622, roughness: 0.35, clearcoat: 0.6 }));
  horn.position.set(0.18 * sx, 1.12, -0.02); horn.rotation.z = -0.3 * sx; dragon.add(horn);
}
for (let i = 0; i < 3; i++) {
  const sp = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.17, 10),
    new THREE.MeshPhysicalMaterial({ color: 0x2c2622, roughness: 0.4 }));
  sp.position.set(0, 0.55 - i * 0.22, -0.5 + i * 0.04);
  sp.rotation.x = -0.4 - i * 0.15;
  dragon.add(sp);
}
// جناحين بغشاء جلدي
const wingShape = new THREE.Shape();
wingShape.moveTo(0, 0);
wingShape.quadraticCurveTo(0.55, 0.5, 0.75, 0.05);
wingShape.quadraticCurveTo(0.55, -0.05, 0.45, -0.28);
wingShape.quadraticCurveTo(0.28, -0.02, 0, 0);
const wingGeo = new THREE.ShapeGeometry(wingShape, 12);
const wingMat = new THREE.MeshPhysicalMaterial({
  color: colN(0.65), roughness: 0.5, side: THREE.DoubleSide,
  transparent: true, opacity: 0.92, envMapIntensity: 0.5,
});
const wings = [];
for (const sx of [-1, 1]) {
  const w = new THREE.Mesh(wingGeo, wingMat);
  w.position.set(0.32 * sx, 0.3, -0.25);
  w.rotation.y = sx * -0.5;
  w.scale.x = sx;
  wings.push(w); dragon.add(w);
}
const tail = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.7, 12), bodyMat);
tail.position.set(0, -0.45, -0.5); tail.rotation.x = -2.2; dragon.add(tail);
dragon.position.set(0, -1.6, 0);

/* جمرات متطايرة */
const emberTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 32;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(16, 16, 1, 16, 16, 15);
  g.addColorStop(0, "rgba(255,220,150,1)");
  g.addColorStop(0.4, "rgba(255,140,50,0.85)");
  g.addColorStop(1, "rgba(255,80,20,0)");
  x.fillStyle = g; x.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
})();
const embers = [];
for (let i = 0; i < 10; i++) {
  const m = new THREE.Sprite(new THREE.SpriteMaterial({
    map: emberTex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0,
  }));
  m.scale.setScalar(0.09 + Math.random() * 0.12);
  embers.push({ m, x: (Math.random() - 0.5) * 1.6, v: 0.3 + Math.random() * 0.5, y: 0.4 + Math.random() * 2, ph: Math.random() * 6 });
  scene.add(m);
}

/* انفجار جمرات عند الفقس */
const burst = [];
for (let i = 0; i < 14; i++) {
  const m = new THREE.Sprite(new THREE.SpriteMaterial({
    map: emberTex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0,
  }));
  const a = (i / 14) * Math.PI * 2;
  burst.push({ m, dx: Math.cos(a) * (2.4 + Math.random() * 1.2), dy: Math.sin(a) * (2.2 + Math.random()) });
  m.scale.setScalar(0.3 + Math.random() * 0.25);
  scene.add(m);
}
let burstT = -1;

/* ---- منطق المراحل والفقس ---- */
let hatchK = 0;
function progress() { return Math.max(0, Math.min(1, shown / goal)); }
function stage() {
  const p = progress();
  return p < 0.3 ? 0 : p < 0.55 ? 1 : p < 0.82 ? 2 : 3;
}
function setStage(st) {
  if (eggMat.map !== EGG_STAGES[st].map) {
    eggMat.map = EGG_STAGES[st].map;
    eggMat.bumpMap = EGG_STAGES[st].bump;
    eggMat.emissiveMap = EGG_STAGES[st].emi;
    eggMat.needsUpdate = true;
  }
}
let lastStage = -1;
function tick(t, dt) {
  const p = progress();
  const st = stage();
  if (hatchK < 0.5) setStage(st);
  lastStage = st;
  // فتح القشرة
  const target = p >= 1 ? 1 : 0;
  const prev = hatchK;
  hatchK += (target - hatchK) * Math.min(1, dt * 2.2);
  if (hatchK > 0.4 && prev <= 0.4) burstT = t;
  const openK = Math.max(0, (hatchK - 0.15) / 0.85);
  shellClip.constant = 2.9 - openK * 1.45;
  eggMat.emissiveIntensity = 0.25 + p * 2.4 + hatchK * 1.5 + Math.sin(t * 6) * 0.15 * p;
  glow.intensity = 1.5 + p * 10 + hatchK * 8;
  // رعشة
  let amp = 0.005 + p * 0.035;
  if (Math.max(0, Math.sin(t * 0.85)) > 0.965) amp *= 3;
  eggGroup.rotation.z = Math.sin(t * 16) * amp;
  eggGroup.rotation.x = Math.cos(t * 12.7) * amp * 0.6;
  eggGroup.position.y = Math.sin(t * 1.15) * 0.035;
  // التنين
  const show = hatchK > 0.25;
  dragon.visible = show;
  if (show) {
    const rise = Math.max(0, (hatchK - 0.25) / 0.75);
    dragon.position.y = -1.6 + rise * 2.9 + Math.sin(t * 1.5) * 0.06 * rise;
    dragon.rotation.z = Math.sin(t * 1.2) * 0.05;
  }
  for (let i = 0; i < wings.length; i++) {
    wings[i].rotation.z = (i ? -1 : 1) * (0.25 + Math.abs(Math.sin(t * 4.5)) * 0.5);
  }
  // جمرات مستمرة من الشقوق
  for (const em of embers) {
    em.y += em.v * dt;
    if (em.y > 3.4) { em.y = 0.5 + Math.random() * 0.4; em.x = (Math.random() - 0.5) * 1.6; }
    em.m.position.set(em.x + Math.sin(t * 1.3 + em.ph) * 0.12, em.y, 0.55);
    em.m.material.opacity = Math.min(0.9, 0.15 + p * 0.85) * Math.min(1, (3.4 - em.y) / 0.8);
  }
  // انفجار الفقس
  if (burstT > 0) {
    const k = (t - burstT) / 1.5;
    if (k > 1) burstT = -1;
    for (const b of burst) {
      const kk = Math.min(1, Math.max(0, k));
      b.m.position.set(b.dx * kk, 1.5 + b.dy * kk, 0.6);
      b.m.material.opacity = 1 - kk;
    }
  } else {
    for (const b of burst) b.m.material.opacity = 0;
  }
}

/* ديمو دائم — أول stats حقيقية بتعديها */
let gotReal = false;
setInterval(function () {
  if (gotReal) return;
  const drift = (Math.random() - 0.42) * goal * 0.06;
  cur = Math.max(goal * 0.1, Math.min(goal, cur + drift));
}, 2000);

/* بيانات لايف */
let evtSource = null;
try { evtSource = new EventSource('/widgets/stream'); } catch (e) {}
if (evtSource) {
  evtSource.onmessage = (e) => {
    let m = null;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === "stats" && m.stats) {
      const v = m.stats[T.statsKey];
      if (v !== undefined) { cur = Math.max(0, Number(v) || 0); gotReal = true; }
    } else if (m.type === "config" && m.id === PAGE_ID && m.config) {
      location.reload();
    } else if (m.type === "test") {
      cur = Math.min(goal, cur + Math.round(goal * 0.12));
    }
  };
}

renderHUD();
window.__dbg = { renderer, get hatchK() { return hatchK; }, get clip() { return shellClip.constant; }, get shown() { return shown; }, shellClip, eggMat };
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  shown += (cur - shown) * Math.min(1, dt * 3);
  renderHUD();
  tick(t, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

}
</script>
