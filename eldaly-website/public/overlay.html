<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ELDALY — Champions List</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lalezar&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Cairo', sans-serif; }

.list-wrap { position: absolute; border-radius: 22px; overflow: hidden;
  display: flex; flex-direction: column;
  opacity: 0; transition: opacity .5s; }
.list-wrap.on { opacity: 1; }

.list-head { flex-shrink: 0; text-align: center; padding: 16px 20px 12px; position: relative; }
.list-head .ttl { font-size: 24px; font-weight: 900; letter-spacing: 1px; line-height: 1.2; }
.list-head .orn-line { position: absolute; bottom: 0; left: 15%; right: 15%; height: 2px; }

.list-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; overflow-y: auto; }
.list-body::-webkit-scrollbar { width: 0; }

.row { display: flex; align-items: center; gap: 14px; padding: 11px 16px;
  border-radius: 14px; font-size: 17px; font-weight: 700; color: #fff;
  animation: rowIn .45s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes rowIn { 0% { opacity: 0; transform: translateX(30px) scale(.92); } 100% { opacity: 1; transform: none; } }
.row .num { width: 36px; height: 36px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif;
  font-weight: 900; font-size: 17px; flex-shrink: 0; }
.row .nm { font-weight: 800; flex: 1; }
.row .sc { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 16px; direction: ltr; }

/* الثيمات */
.theme-gold .list-wrap { background: linear-gradient(170deg, #17131f, #0c0a12 70%);
  border: 1.5px solid rgba(212,175,55,0.4); box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,175,55,0.1); }
.theme-gold .ttl { color: #f2dc93; text-shadow: 0 0 16px rgba(212,175,55,0.4); }
.theme-gold .orn-line { background: linear-gradient(90deg, transparent, #d4af37, transparent); }
.theme-gold .row { background: rgba(212,175,55,0.06); border-right: 3px solid #d4af37; }
.theme-gold .row .num { background: rgba(212,175,55,0.15); color: #d4af37; }
.theme-gold .row .sc { color: #f2dc93; }

.theme-cyan .list-wrap { background: rgba(6,20,28,0.88); border: 1.5px solid rgba(0,229,255,0.35); box-shadow: 0 0 45px rgba(0,229,255,0.1); }
.theme-cyan .ttl { color: #00e5ff; text-shadow: 0 0 16px rgba(0,229,255,0.4); }
.theme-cyan .orn-line { background: linear-gradient(90deg, transparent, #00e5ff, transparent); }
.theme-cyan .row { background: rgba(0,229,255,0.05); border-right: 3px solid #00e5ff; }
.theme-cyan .row .num { background: rgba(0,229,255,0.1); color: #00e5ff; }
.theme-cyan .row .sc { color: #7fdbff; }

.theme-rose .list-wrap { background: linear-gradient(170deg, rgba(40,10,30,0.88), rgba(25,8,22,0.92)); border: 1.5px solid rgba(255,100,180,0.4); box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,100,180,0.1); }
.theme-rose .ttl { color: #ff6eb4; text-shadow: 0 0 16px rgba(255,110,180,0.4); }
.theme-rose .orn-line { background: linear-gradient(90deg, transparent, #ff6eb4, transparent); }
.theme-rose .row { background: rgba(255,110,180,0.06); border-right: 3px solid #ff6eb4; }
.theme-rose .row .num { background: rgba(255,110,180,0.1); color: #ff6eb4; }
.theme-rose .row .sc { color: #ffa0c8; }
</style>
</head>
<body class="theme-gold">
<div class="list-wrap on" id="lw">
  <div class="list-head"><div class="ttl" id="ttl">⭐ TOP SUPPORTERS</div><div class="orn-line"></div></div>
  <div class="list-body" id="lb"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const theme = (params.get("theme") || "gold").toLowerCase();
const title = params.get("title") || "⭐ TOP SUPPORTERS";
document.body.className = "theme-" + theme;
document.getElementById("ttl").textContent = title;
const data = [
  { n: "Ahmed Pro", p: 12500 },
  { n: "Sara Queen", p: 9800 },
  { n: "Omar King", p: 7200 },
  { n: "Mona Star", p: 5100 },
  { n: "Ali Tiger", p: 3400 }
];
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!))/g, ","); }
function render(data) {
  const lb = document.getElementById("lb");
  lb.innerHTML = "";
  (data || []).forEach(function(item, i) {
    const d = document.createElement("div");
    d.className = "row";
    d.style.animationDelay = (i * 0.08) + "s";
    const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "";
    d.innerHTML = "<span class='num'>" + (medal || (i+1)) + "</span>" +
      "<span class='nm'>" + item.n + "</span>" +
      "<span class='sc'>" + fmt(item.p) + "</span>";
    lb.appendChild(d);
  });
}
render(data);
</script>
</body>
</html>
