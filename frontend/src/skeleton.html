<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src eldaly: data:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'none'">
<title>ELDALY STREAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0a0c;
    --bg-secondary: #0e0e12;
    --bg-card: #131318;
    --bg-inset: #0f0f14;
    --border: rgba(255, 255, 255, 0.07);
    --gold: #d4af37;
    --text-muted: #6d6960;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-primary); }
  body { font-family: 'Manrope', 'Segoe UI', Tahoma, sans-serif; user-select: none; }

  /* ===== Topbar — مطابق للتطبيق ===== */
  .topbar {
    height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: var(--bg-secondary); border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  .topbar .logo { width: 24px; height: 24px; border-radius: 6px; }
  .topbar .app-name {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 800;
    letter-spacing: 2.5px; color: var(--gold);
  }
  .win-controls { margin-left: auto; display: flex; gap: 8px; }
  .win-controls span { width: 11px; height: 11px; border-radius: 50%; background: #26262e; display: block; }

  /* ===== Layout ===== */
  .wrap { display: flex; width: 100%; height: calc(100% - 46px); }
  .side {
    width: 216px; flex: 0 0 216px; background: var(--bg-secondary);
    border-right: 1px solid var(--border); padding: 18px 14px; display: flex;
    flex-direction: column; gap: 10px;
  }
  .sec-label { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--text-muted); margin: 14px 6px 4px; }
  .sec-label:first-child { margin-top: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; }
  .main { flex: 1; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  /* ===== عناصر السكيلتون ( shimmer ) ===== */
  .sk { position: relative; overflow: hidden; background: #1a1a21; border-radius: 7px; }
  .sk::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(212,175,55,.13), rgba(255,255,255,.05), transparent);
    animation: shimmer 1.6s infinite;
  }
  .sk.nav { width: 78%; height: 12px; }
  .sk.title-gold { width: 220px; height: 30px; border-radius: 5px; }
  .sk.subtitle { width: 300px; height: 12px; }
  .sk.big { width: 42%; height: 20px; }
  .sk.stat { width: 55%; height: 10px; }
  .sk.row { width: 100%; height: 13px; }
  .sk.w60 { width: 60%; } .sk.w75 { width: 75%; } .sk.w45 { width: 45%; } .sk.w85 { width: 85%; } .sk.w35 { width: 35%; }
  .circle { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px; }

  /* ===== كروت المحتوى — نفس الداشبورد ===== */
  .hero {
    background: linear-gradient(180deg, rgba(212,175,55,.05), transparent), var(--bg-card);
    border: 1px solid var(--border); border-radius: 14px; padding: 22px;
    display: flex; align-items: center; gap: 16px;
  }
  .hero .avatar { width: 74px; height: 74px; border-radius: 50%; flex: 0 0 74px; border: 1px solid rgba(212,175,55,.35); }
  .hero .input-sk { flex: 1; height: 42px; border-radius: 10px; background: var(--bg-inset); border: 1px solid var(--border); position: relative; overflow: hidden; }
  .hero .input-sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(212,175,55,.10), transparent); animation: shimmer 1.6s infinite; }
  .hero .btn-sk { width: 110px; height: 42px; border-radius: 10px; flex: 0 0 110px; }
  .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; flex: 1; display: flex; flex-direction: column; gap: 13px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  .card .ico { width: 34px; height: 34px; border-radius: 9px; background: rgba(212,175,55,.10); border: 1px solid rgba(212,175,55,.25); }

  .status { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: var(--text-muted); letter-spacing: .4px; direction: rtl; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-left: 7px; vertical-align: middle; animation: blink 1.2s infinite; }

  @keyframes shimmer { 100% { transform: translateX(100%); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
</style>
</head>
<body>
  <div class="topbar">
    <img class="logo" src="logo.png" alt="">
    <div class="app-name">ELDALY STREAM</div>
    <div class="win-controls"><span></span><span></span><span></span></div>
  </div>
  <div class="wrap">
    <div class="side">
      <div class="sec-label">STREAM</div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w60"></div></div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w45"></div></div>
      <div class="sec-label">AUTOMATION</div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w75"></div></div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w60"></div></div>
      <div class="sec-label">OVERLAYS</div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w45"></div></div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w60"></div></div>
      <div class="sec-label">SYSTEM</div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w75"></div></div>
      <div class="nav-item"><div class="sk circle" style="width:14px;height:14px;flex-basis:14px"></div><div class="sk nav w45"></div></div>
    </div>
    <div class="main">
      <div>
        <div class="sk title-gold"></div>
        <div style="height:10px"></div>
        <div class="sk subtitle w60"></div>
      </div>
      <div class="hero">
        <div class="avatar"></div>
        <div class="input-sk"></div>
        <div class="sk btn-sk"></div>
      </div>
      <div class="panel">
        <div class="sk row w35"></div>
        <div class="sk row w85"></div>
        <div class="sk row w60"></div>
      </div>
      <div class="cards">
        <div class="card"><div class="ico"></div><div class="sk stat w75"></div><div class="sk stat w45"></div></div>
        <div class="card"><div class="ico"></div><div class="sk stat w60"></div><div class="sk stat w45"></div></div>
        <div class="card"><div class="ico"></div><div class="sk stat w75"></div><div class="sk stat w35"></div></div>
      </div>
    </div>
  </div>
  <div class="status"><span class="dot"></span>جاري الاتصال بالسيرفر…</div>
</body>
</html>
