<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firework Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      width: 100vw;
      height: 100vh;
    }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 1px solid rgba(255,255,255,0.01);
      pointer-events: none;
    }

    #container { position: absolute; inset: 0; width: 100vw; height: 100vh; }

    .rocket {
      position: absolute;
      bottom: -100px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      z-index: 10;
      background-size: cover;
      background-position: center;
    }

    .flame {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      background: linear-gradient(to bottom, #fff, #ffeb3b, #ff9800, transparent);
      filter: blur(4px);
      animation: flicker 0.1s infinite alternate;
    }

    @keyframes flicker {
      0%   { height: 40px; opacity: 0.8; }
      100% { height: 60px; opacity: 1; }
    }

    .confetti {
      position: absolute;
      opacity: 0;
      transform-origin: center;
    }

    @keyframes explode {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(720deg); opacity: 0; }
    }

    .user-text {
      position: absolute;
      transform: translate(-50%, -50%) scale(0);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff00de, 0 0 30px #ff00de, 0 0 40px #ff00de;
      opacity: 0;
      white-space: nowrap;
      z-index: 20;
    }

    .user-text.show { animation: popText 3s forwards; }

    @keyframes popText {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      10%  { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      15%  { transform: translate(-50%, -50%) scale(1); opacity: 1; text-shadow: 0 0 10px #fff, 0 0 20px #00ffcc, 0 0 30px #00ffcc, 0 0 40px #00ffcc; }
      80%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
    }

    @keyframes flash {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <div id="container"></div>

  <script>
    const DEFAULTS = {
      posXMin: 20,
      posXMax: 80,
      posYMin: 25,
      posYMax: 55,
      rocketSize: 60,
      particles: 80,
      spread: 200,
      particleSize: 8,
      textSize: 40,
      launchSpeed: 1.5,
    };

    // Load saved config from server injection
    let savedConfig = {};
    try {
      const injected = '__INITIAL_CONFIG__';
      if (!injected.startsWith('__')) {
        savedConfig = JSON.parse(injected);
      }
    } catch(e) {}

    let config = { ...DEFAULTS, ...savedConfig };
    const container = document.getElementById('container');
    const colors = ['#FF3B30', '#34C759', '#007AFF', '#FF9500', '#AF52DE', '#FF2D55', '#5856D6', '#FFCC00'];
    let launchCounter = 0;

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function createFirework(username, iconUrl) {
      const explosionX = rand(config.posXMin, config.posXMax);
      const explosionY = rand(config.posYMin, config.posYMax);
      const rocketSz = config.rocketSize;
      const launchId = 'launch_' + (launchCounter++);

      const rocket = document.createElement('div');
      rocket.className = 'rocket';
      rocket.style.width = rocketSz + 'px';
      rocket.style.height = rocketSz + 'px';
      rocket.style.left = explosionX + '%';
      rocket.style.transform = 'translateX(-50%)';
      rocket.style.backgroundImage = `url('${iconUrl}')`;

      const launchDuration = config.launchSpeed;
      const animName = `rocketLaunch_${launchId}`;
      rocket.style.animation = `${animName} ${launchDuration}s cubic-bezier(0.25, 1, 0.5, 1) forwards`;

      const rocketStyle = document.createElement('style');
      rocketStyle.textContent = `
        @keyframes ${animName} {
          0%   { bottom: -100px; opacity: 1; }
          80%  { bottom: ${100 - explosionY}%; opacity: 1; }
          100% { bottom: ${100 - explosionY}%; opacity: 0; transform: translateX(-50%) scale(0.5); }
        }
      `;
      document.head.appendChild(rocketStyle);

      const flame = document.createElement('div');
      flame.className = 'flame';
      flame.style.height = '40px';
      rocket.appendChild(flame);
      container.appendChild(rocket);

      const explodeDelay = (launchDuration * 0.93) * 1000;
      setTimeout(() => {
        if (rocket.parentNode) rocket.parentNode.removeChild(rocket);
        if (rocketStyle.parentNode) rocketStyle.parentNode.removeChild(rocketStyle);

        const centerX = explosionX;
        const centerY = explosionY;
        const particleCount = config.particles;
        const particleSz = config.particleSize;
        const spreadRadius = config.spread;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'confetti';
          particle.style.width = particleSz + 'px';
          particle.style.height = particleSz + 'px';
          particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          particle.style.left = centerX + '%';
          particle.style.top = centerY + '%';

          const angle = Math.random() * Math.PI * 2;
          const velocity = 50 + Math.random() * spreadRadius;
          const tx = Math.cos(angle) * velocity;
          const ty = Math.sin(angle) * velocity;

          particle.style.setProperty('--tx', `${tx}px`);
          particle.style.setProperty('--ty', `${ty}px`);

          const duration = 0.8 + Math.random() * 0.5;
          particle.style.animation = `explode ${duration}s ease-out forwards`;

          container.appendChild(particle);
          setTimeout(() => { if(particle.parentNode) particle.parentNode.removeChild(particle); }, duration * 1000 + 100);
        }

        const text = document.createElement('div');
        text.className = 'user-text show';
        text.style.fontSize = config.textSize + 'px';
        text.style.left = centerX + '%';
        text.style.top = centerY + '%';
        text.textContent = username;
        container.appendChild(text);

        const flashEl = document.createElement('div');
        flashEl.style.cssText = `position:absolute;top:${centerY}%;left:${centerX}%;transform:translate(-50%,-50%);width:100px;height:100px;background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 70%);border-radius:50%;z-index:5;animation:flash 0.5s ease-out forwards;`;
        container.appendChild(flashEl);

        setTimeout(() => { if(text.parentNode) text.parentNode.removeChild(text); }, 3000);
        setTimeout(() => { if(flashEl.parentNode) flashEl.parentNode.removeChild(flashEl); }, 500);

      }, explodeDelay);
    }

    // ── SSE Event Listener ──
    const evtSource = new EventSource('/widgets/stream');
    evtSource.onmessage = function(event) {
      const data = JSON.parse(event.data);
      if (data.type === 'gift') {
        const username = data.data.uniqueId || data.data.nickname || 'Someone';
        const iconUrl = data.data.avatar || data.data.profilePictureUrl || `https://ui-avatars.com/api/?name=${username}&background=random`;
        createFirework(username, iconUrl);
      }
      if (data.type === 'config' && data.id === 'firework') {
        Object.assign(config, data.config);
      }
      if (data.type === 'test' && data.id === 'firework') {
        createFirework('TestUser', `https://ui-avatars.com/api/?name=T&background=a855f7&color=fff`);
      }
    };
  </script>
</body>
</html>
