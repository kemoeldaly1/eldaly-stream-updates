<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ELDALY STREAM — TikTok Goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; }

.goal-card {
  position: relative; width: 320px; height: 420px;
  border-radius: 22px; overflow: hidden;
  background: linear-gradient(165deg, #0e0b18, #0a0812 60%);
  border: 1.5px solid rgba(212,175,55,0.35);
  box-shadow: 0 20px 70px rgba(0,0,0,0.7), 0 0 50px rgba(212,175,55,0.08);
  animation: cardIn .7s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }

/* الشريط العلوي */
.goal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
}
.goal-title { font-size: 16px; font-weight: 900; color: #f2dc93;
  text-shadow: 0 0 14px rgba(212,175,55,0.35); }
.goal-pct { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900;
  color: #d4af37; direction: ltr; }

/* منطقة الزجاجة */
.bottle-zone {
  position: relative; width: 100%; height: 270px;
  display: flex; align-items: flex-end; justify-content: center;
}

/* الزجاجة — شكل TikTok النوتة الموسيقية بتأثير زجاجي واقعي */
.bottle-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* السائل اللي بيملى من تحت */
.liquid-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg,
    rgba(254,44,85,0.35) 0%,
    rgba(37,244,238,0.25) 40%,
    rgba(25,160,233,0.30) 100%);
  transition: height 1.2s cubic-bezier(.22,1,.36,1);
  z-index: 2;
  clip-path: url(#bottleClip);
}
.liquid-fill .wave {
  position: absolute; top: -8px; left: -50%; width: 200%; height: 16px;
  background: radial-gradient(ellipse 40px 14px at 50% 100%, rgba(255,255,255,0.35), transparent 70%);
  animation: waveShift 2.8s ease-in-out infinite;
}
@keyframes waveShift { 0%,100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }

/* الفقاعات الصاعدة */
.bubble { position: absolute; border-radius: 50%; z-index: 3;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
  animation: bubbleRise linear infinite; pointer-events: none; }
@keyframes bubbleRise { 0% { transform: translateY(0) scale(1); opacity: 0; } 15% { opacity: .7; } 90% { opacity: .4; } 100% { transform: translateY(-200px) scale(.4); opacity: 0; } }

/* شعار تيك توك في نص الزجاجة */
.tt-logo { position: absolute; z-index: 4; left: 50%; top: 42%; transform: translate(-50%,-50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tt-note { width: 52px; height: 52px; filter: drop-shadow(0 0 12px rgba(255,255,255,0.3)); }
.tt-text { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px;
  color: rgba(255,255,255,0.45); letter-spacing: 1px; }

/* العداد — بادج فوق */
.counter-badge {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 5; background: linear-gradient(135deg, #fe2c55, #25f4ee);
  color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: 14px; padding: 5px 16px; border-radius: 100px; direction: ltr;
  box-shadow: 0 4px 18px rgba(254,44,85,0.4);
}
/* الهدف */
.goal-target {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  z-index: 5; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5);
  direction: ltr;
}

/* الزجاجة SVG — إطار زجاجي بشرائح بيضاء عاكسة */
.glass-outline { fill: rgba(8,8,14,0.82); stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
.glass-shine { fill: rgba(255,255,255,0.07); }
.glass-rim { stroke: rgba(255,255,255,0.28); stroke-width: 2; fill: none; }
</style>
</head>
<body>
<div class="goal-card" id="card">
  <div class="goal-head">
    <span class="goal-title" id="g-title">🎯 هدف التيك توك</span>
    <span class="goal-pct" id="g-pct">0%</span>
  </div>
  <div class="bottle-zone">
    <!-- SVG زجاجة تيك توك واقعية -->
    <svg class="bottle-svg" viewBox="0 0 300 270" preserveAspectRatio="xMidYMax meet">
      <defs>
        <clipPath id="bottleClip">
          <path d="M85 40 Q85 25 105 22 L105 15 Q105 8 120 8 L180 8 Q195 8 195 15 L195 22 Q215 25 215 40 L215 200 Q215 245 150 245 Q85 245 85 200 Z"/>
        </clipPath>
        <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fe2c55" stop-opacity="0.30"/>
          <stop offset="0.5" stop-color="#25f4ee" stop-opacity="0.20"/>
          <stop offset="1" stop-color="#19a0e9" stop-opacity="0.28"/>
        </linearGradient>
      </defs>
      <!-- جسم الزجاجة -->
      <path class="glass-outline" d="M85 40 Q85 25 105 22 L105 15 Q105 8 120 8 L180 8 Q195 8 195 15 L195 22 Q215 25 215 40 L215 200 Q215 245 150 245 Q85 245 85 200 Z"/>
      <!-- لمعة زجاجية جانبية -->
      <path class="glass-shine" d="M95 50 Q95 35 110 32 L110 28 Q110 22 118 22 L118 18 Q118 14 125 14 L150 14 Q157 14 157 18 L157 22 Q172 25 172 40 L172 190 Q172 230 150 235 Q130 230 100 190 Z" opacity="0.35"/>
      <!-- حلقة الفم -->
      <rect x="102" y="6" width="96" height="10" rx="5" class="glass-rim"/>
    </svg>
    <!-- السائل -->
    <div class="liquid-fill" id="liquid" style="height:0%">
      <div class="wave"></div>
    </div>
    <!-- شعار تيك توك -->
    <div class="tt-logo">
      <svg class="tt-note" viewBox="0 0 24 24" fill="none">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z" fill="#25f4ee" transform="translate(-1.2,-1.2)" opacity="0.6"/>
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z" fill="#fe2c55" transform="translate(1.2,1.2)" opacity="0.6"/>
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z" fill="#ffffff"/>
      </svg>
      <div class="tt-text">TIKTOK</div>
    </div>
  </div>
  <!-- فقاعات -->
  <div id="bubbles"></div>
  <!-- العداد والهدف -->
  <div class="counter-badge" id="counter">0 / 100</div>
  <div class="goal-target">🎯 الهدف: <span id="target-text">100</span></div>
</div>
<script>
const CONFIG = __INITIAL_CONFIG__;
const params = new URLSearchParams(location.search);
const type = params.get("type") || "likes";
const goal = parseInt(params.get("goal")) || 100;

let cur = 0;
const maxBubbles = 8;

function setProgress(val) {
  cur = Math.min(val, goal);
  const pct = Math.round((cur / goal) * 100);
  document.getElementById("g-pct").textContent = pct + "%";
  document.getElementById("counter").textContent = fmt(cur) + " / " + fmt(goal);
  // ارتفاع السائل
  const zoneH = document.querySelector(".bottle-zone").offsetHeight;
  const liqH = Math.max(0, Math.min(1, cur / goal)) * 240;
  document.getElementById("liquid").style.height = liqH + "px";
}
function fmt(n) { return Number(n).toLocaleString("en-US"); }

// فقاعات زخرفية
set
