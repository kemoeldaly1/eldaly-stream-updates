<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>TikTok Logo Goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@700;900&family=Changa:wght@700;800&family=Orbitron:wght@700;900&family=Reem+Kufi:wght@700&family=Righteous&family=Russo+One&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:transparent!important;width:100vw;height:100vh}
body{font-family:var(--gw-latin,'Righteous'),var(--gw-ar,'Cairo'),'Segoe UI',Tahoma,sans-serif;color:#fff}

/* الحاوية — اللون بيتحكم فيه من الإعدادات (--gc / --gc-rgb) */
.gw-root{
  --gc: #ffd23f;
  --gc-rgb: 255, 210, 63;
  --gw-latin: 'Righteous';
  --gw-ar: 'Cairo';
  --gw-title-size: 30px;
  --gw-count-size: 44px;
  position: relative; width: 100vw; height: 100vh;
  background: transparent; overflow: hidden;
  opacity: 0; transition: opacity .4s ease-in-out;
}
.gw-root.gw-loaded{opacity:1}
.gw-stage{position:relative;width:100%;height:100%}
.gw-mount{position:absolute;inset:0}
.gw-panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gw-title{
  font-size:var(--gw-title-size);font-weight:700;letter-spacing:.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.gw-count{
  font-size:var(--gw-count-size);font-weight:900;
  text-shadow:0 0 20px rgba(var(--gc-rgb),.75),0 2px 6px rgba(0,0,0,.65);
}

/* ===== ثيم bar ===== */
.gw-panel.gw-bar{flex-direction:column;gap:14px;padding:24px}
.gw-bar .bar-wrap{
  width:min(560px,84vw);height:46px;border-radius:999px;padding:6px;
  background:rgba(10,10,14,.72);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 4px 24px rgba(0,0,0,.35);
}
.gw-bar .bar{position:relative;width:100%;height:100%;border-radius:999px;overflow:hidden}
.gw-bar #gwFill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(to right,
    color-mix(in srgb,var(--gc) 65%,#fff) 0%,
    var(--gc) 55%,
    color-mix(in srgb,var(--gc) 70%,#000) 100%);
  box-shadow:0 0 14px var(--gc),0 0 34px rgba(var(--gc-rgb),.6);
  transition:width .8s cubic-bezier(.22,.9,.32,1);
}
.gw-bar.gw-complete #gwFill{animation:gwPulse 1.1s ease-in-out infinite alternate}

/* ===== ثيم bottle-img (قنينتك — صورة + ماسك + سايل نيون) ===== */
.gw-panel.gw-bottle-img{flex-direction:column;gap:10px}
.bottle-wrap{position:relative;height:min(56vh,470px)}
.bottle-wrap img.bottle-art{
  display:block;height:100%;width:auto;z-index:2;position:relative;
  filter:drop-shadow(0 10px 40px rgba(0,0,0,.5));
}
.liquid-glow{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  filter:drop-shadow(0 0 4px rgba(var(--gc-rgb),.38))
          drop-shadow(0 0 12px rgba(var(--gc-rgb),.16));
}
.liquid-mask{
  position:absolute;inset:0;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
}
.liquid-fill{
  position:absolute;left:0;right:0;height:0%;
  background:rgba(var(--gc-rgb),.28);
  transition:top .8s cubic-bezier(.22,.9,.32,1),height .8s cubic-bezier(.22,.9,.32,1);
}
.wave-svg{position:absolute;top:-16px;left:-25%;width:150%;height:46px;display:block;overflow:visible}
.wave-back{animation:gwWaveBack 5.6s linear infinite}
.wave-front{animation:gwWaveFront 3.4s linear infinite}
@keyframes gwWaveBack{to{transform:translateX(-80px)}}
@keyframes gwWaveFront{to{transform:translateX(-60px)}}
.gw-bottle-img.gw-complete .bottle-wrap{animation:gwPulse .9s ease-in-out infinite alternate}

/* الشرارات */
.gw-sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gw-spark{position:absolute}
.gw-spark svg{width:100%;height:100%}

@keyframes gwPulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.35) saturate(1.2)}
}
</style>
</head>
<body>
<div class="gw-root" id="gwRoot">
  <div class="gw-stage">
    <div class="gw-mount" id="gwMount"></div>
    <div class="gw-sparkles" id="gwSparkles"></div>
  </div>
</div>
<script>
(function(){
  /* ── الكونفج المبدئي (بيتحقن من السيرفر) + باراميترات اللينك ── */
  var cfg = {};
  try { cfg = JSON.parse('__INITIAL_CONFIG__') || {}; } catch (e) {}
  var urlParams = new URLSearchParams(window.location.search);
  var widgetId = urlParams.get('id') || 'tiktok-goal';
  var urlType = urlParams.get('type') || 'gift';
  var isMock = urlParams.get('mock') === '1';

  var state = {
    theme: 'bottle-img',
    target: 100,
    title: 'Gift Goal',
    goalType: urlType,
    giftName: '',
    testValue: 10,
    baseline: 0,
    airGap: 0.08,
    current: 0,
    shown: 0,
    gotFirstStats: false,
    artURL: 'tik-shape.webp',
    maskURL: 'tik-mask.png',
  };

  var FONT_PAIRS = {
    pro:   { latin: "'Righteous'", ar: "'Cairo'" },
    tech:  { latin: "'Orbitron'",  ar: "'Changa'" },
    kufi:  { latin: "'Russo One'", ar: "'Reem Kufi'" },
    tight: { latin: "'Bebas Neue'", ar: "'Tajawal'" },
  };

  var root = document.getElementById('gwRoot');
  var mount = document.getElementById('gwMount');
  var els = {};

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function normalizeHex(hex){
    var h = String(hex || '').trim().replace(/^#/, '');
    if (/^[0-9a-f]{3}$/i.test(h)) h = h.split('').map(function(c){ return c + c; }).join('');
    return /^[0-9a-f]{6}$/i.test(h) ? h : null;
  }

  /* ── اللون ── */
  function setGoalColor(hex){
    var h = normalizeHex(hex);
    if (!h) return;
    var n = parseInt(h, 16);
    root.style.setProperty('--gc', '#' + h);
    root.style.setProperty('--gc-rgb', ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255));
  }

  /* ── الخطوط: لاتيني مزخرف + عربي مزخرف (المحارف اللاتينية من الأول
       والعربي بيقع على الخط العربي تلقائيًا) ── */
  function applyFont(name){
    var pair = FONT_PAIRS[String(name || '').toLowerCase()] || FONT_PAIRS.pro;
    root.style.setProperty('--gw-latin', pair.latin);
    root.style.setProperty('--gw-ar', pair.ar);
  }

  /* ── قوالب الثيمات (bar + bottle-img بس) ── */
  var WAVE_SVG =
    '<svg class="wave-svg" viewBox="0 0 240 46" preserveAspectRatio="none" aria-hidden="true">' +
      '<g class="wave-back"><path fill="rgba(var(--gc-rgb), .20)" d="M0,20 Q20,11 40,20 T80,20 T120,20 T160,20 T200,20 T240,20 L240,46 L0,46 Z"/></g>' +
      '<g class="wave-front">' +
        '<path fill="rgba(var(--gc-rgb), .34)" d="M0,16 Q15,7 30,16 T60,16 T90,16 T120,16 T150,16 T180,16 T210,16 T240,16 L240,46 L0,46 Z"/>' +
        '<path fill="none" stroke="rgba(255,255,255,.30)" stroke-width="1.2" d="M0,16 Q15,7 30,16 T60,16 T90,16 T120,16 T150,16 T180,16 T210,16 T240,16"/>' +
      '</g>' +
    '</svg>';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function template(name){
    if (name === 'bar') {
      return '<div class="gw-panel gw-bar">' +
        '<div class="gw-title" id="gwTitle"></div>' +
        '<div class="bar-wrap"><div class="bar"><div id="gwFill"></div></div></div>' +
        '<div class="gw-count" id="gwCount"></div>' +
      '</div>';
    }
    return '<div class="gw-panel gw-bottle-img">' +
      '<div class="gw-title" id="gwTitle"></div>' +
      '<div class="bottle-wrap">' +
        '<div class="liquid-glow"><div class="liquid-mask" id="gwMask"><div class="liquid-fill" id="gwFill">' + WAVE_SVG + '</div></div></div>' +
        '<img class="bottle-art" id="gwArt" src="' + esc(state.artURL) + '" alt="">' +
      '</div>' +
      '<div class="gw-count" id="gwCount"></div>' +
    '</div>';
  }

  function switchTheme(name){
    var t = (name === 'bar') ? 'bar' : 'bottle-img';
    state.theme = t;
    mount.innerHTML = template(t);
    els.title = document.getElementById('gwTitle');
    els.fill = document.getElementById('gwFill');
    els.count = document.getElementById('gwCount');
    els.mask = document.getElementById('gwMask');
    els.panel = mount.firstElementChild;
    els.title.textContent = state.title;
    render(true);
    if (t === 'bottle-img') initMask();
  }

  /* ── الماسك: بيتحسب من صورة الماسك (أو من شفافية صورة القنينة نفسها) ── */
  function loadImage(src){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ resolve(img); };
      img.src = src;
    });
  }

  // أعلى وأộn نقطة معتمة في الصورة — عشان السايل ميتفيعش فوق حدود الشكل
  function maskSpanFromImage(img){
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return { topFrac: 0.08, spanFrac: 0.92 };
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d', { willReadFrequently: true });
    if (!ctx) return { topFrac: 0.08, spanFrac: 0.92 };
    ctx.drawImage(img, 0, 0);
    var d;
    try { d = ctx.getImageData(0, 0, w, h).data; } catch (e) { return { topFrac: 0.08, spanFrac: 0.92 }; }
    var minY = h, maxY = -1;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3] > 128) { if (y < minY) minY = y; if (y > maxY) maxY = y; break; }
      }
      if (maxY >= 0 && y > maxY) break;
    }
    return maxY < 0 ? { topFrac: 0.08, spanFrac: 0.92 } : { topFrac: minY / h, spanFrac: (maxY - minY + 1) / h };
  }

  // بديل: توليد ماسك من شفافية صورة القنينة (flood fill من البرا)
  function buildLiquidMask(img){
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return null;
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d', { willReadFrequently: true });
    if (!ctx) return null;
    ctx.drawImage(img, 0, 0);
    var data;
    try { data = ctx.getImageData(0, 0, w, h); } catch (e) { return null; }
    var px = data.data, N = w * h;
    var outside = new Uint8Array(N), stack = new Int32Array(N), sp = 0;
    function push(i){
      if (!outside[i] && px[i * 4 + 3] < 16) { outside[i] = 1; stack[sp++] = i; }
    }
    var x, y;
    for (x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
    for (y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
    while (sp > 0) {
      var i = stack[--sp];
      x = i % w; y = (i / w) | 0;
      if (x > 0) push(i - 1);
      if (x < w - 1) push(i + 1);
      if (y > 0) push(i - w);
      if (y < h - 1) push(i + w);
    }
    var out = ctx.createImageData(w, h), od = out.data;
    var minY = h, maxY = -1;
    for (var j = 0; j < N; j++) {
      var inside = outside[j] ? 0 : 1;
      od[j * 4] = od[j * 4 + 1] = od[j * 4 + 2] = 255;
      od[j * 4 + 3] = inside ? 255 : 0;
      if (inside) { var yy = (j / w) | 0; if (yy < minY) minY = yy; if (yy > maxY) maxY = yy; }
    }
    ctx.putImageData(out, 0, 0);
    return {
      url: cv.toDataURL('image/png'),
      topFrac: maxY < 0 ? 0 : minY / h,
      spanFrac: maxY < 0 ? 1 : (maxY - minY + 1) / h,
    };
  }

  async function initMask(){
    var lm = els.mask;
    if (!lm) return;
    var mi = await loadImage(state.maskURL);
    if (mi.naturalWidth) {
      var span = maskSpanFromImage(mi);
      lm.style.webkitMaskImage = 'url("' + state.maskURL + '")';
      lm.style.maskImage = 'url("' + state.maskURL + '")';
      lm.dataset.topFrac = String(span.topFrac);
      lm.dataset.spanFrac = String(span.spanFrac);
      render(true);
      return;
    }
    var art = await loadImage(state.artURL);
    var mask = art.naturalWidth ? buildLiquidMask(art) : null;
    if (mask && lm.isConnected) {
      lm.style.webkitMaskImage = 'url("' + mask.url + '")';
      lm.style.maskImage = 'url("' + mask.url + '")';
      lm.dataset.topFrac = String(mask.topFrac);
      lm.dataset.spanFrac = String(mask.spanFrac);
      render(true);
    }
  }

  /* ── الرسم ── */
  function pct(){ return clamp((state.shown / state.target) * 100, 0, 100); }

  function render(instant){
    if (!els.panel) return;
    var done = state.current >= state.target;
    els.panel.classList.toggle('gw-complete', done);
    var p = pct();
    var k = p / 100;

    if (state.theme === 'bar') {
      if (els.fill) {
        if (instant) els.fill.style.transition = 'none';
        else els.fill.style.transition = '';
        els.fill.style.width = p.toFixed(2) + '%';
      }
    } else if (els.fill && els.mask) {
      var topFrac = parseFloat(els.mask.dataset.topFrac || '0');
      var spanFrac = parseFloat(els.mask.dataset.spanFrac || '1');
      var fillSpan = spanFrac * (1 - state.airGap);
      if (instant) els.fill.style.transition = 'none';
      else els.fill.style.transition = '';
      els.fill.style.top = ((topFrac + spanFrac - fillSpan * k) * 100).toFixed(3) + '%';
      els.fill.style.height = (fillSpan * k * 100).toFixed(3) + '%';
    }

    if (els.count) {
      var display = Math.max(0, Math.round(state.shown) - state.baseline);
      els.count.textContent =
        display.toLocaleString('en-US') + ' / ' + Number(state.target).toLocaleString('en-US');
    }
  }

  /* ── حركة ناعمة 0.8s — وأول مزامنة بتحصل قفزة مباشرة ── */
  var rafId = null;
  function tweenTo(to){
    var from = state.shown;
    var t0 = performance.now();
    var DUR = 800;
    if (rafId !== null) cancelAnimationFrame(rafId);
    function step(t){
      var k = Math.min(1, (t - t0) / DUR);
      var e = 1 - Math.pow(1 - k, 3);
      state.shown = from + (to - from) * e;
      render(false);
      if (k < 1) rafId = requestAnimationFrame(step);
      else { state.shown = to; render(false); rafId = null; }
    }
    rafId = requestAnimationFrame(step);
  }

  function setValue(v, instant){
    if (typeof v !== 'number' || isNaN(v)) return;
    state.current = clamp(v, 0, state.target * 10);
    if (instant) {
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null;
      state.shown = state.current;
      render(true);
      return;
    }
    tweenTo(state.current);
  }

  function reset(){
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
    state.current = 0;
    state.shown = 0;
    render(true);
  }

  /* ── تطبيق الإعدادات (مفاتيح جديدة + توافق مع المفاتيح القديمة) ── */
  function applyConfig(c){
    cfg = Object.assign({}, cfg, c || {});
    var v;

    var t = String(cfg.theme || cfg.theme_key || '').toLowerCase();
    if (t !== state.theme && (t === 'bar' || t === 'bottle-img')) switchTheme(t);

    v = cfg.color || cfg.goal_color;
    if (v) setGoalColor(v);

    v = parseFloat(cfg.airgap != null ? cfg.airgap : cfg.airGap);
    if (!isNaN(v)) state.airGap = clamp(v, 0, 0.4);

    v = parseInt(cfg.target != null ? cfg.target : (cfg.goal != null ? cfg.goal : cfg.goal_value), 10);
    if (!isNaN(v) && v > 0) state.target = v;

    v = cfg.title != null ? cfg.title : cfg.goal_title;
    if (v != null && String(v).length) {
      state.title = String(v);
      if (els.title) els.title.textContent = state.title;
    }

    if (cfg.font) applyFont(cfg.font);

    v = parseInt(cfg.titleSize, 10);
    if (!isNaN(v) && v > 0) root.style.setProperty('--gw-title-size', v + 'px');
    v = parseInt(cfg.counterSize, 10);
    if (!isNaN(v) && v > 0) root.style.setProperty('--gw-count-size', v + 'px');

    state.goalType = String(cfg.goaltype || cfg.goalType || urlType || 'gift').toLowerCase();
    state.giftName = String(cfg.giftname || cfg.giftName || '').toLowerCase();
    v = parseInt(cfg['test-value'], 10);
    if (!isNaN(v) && v > 0) state.testValue = v;
    v = parseInt(cfg._baseline, 10);
    state.baseline = isNaN(v) ? 0 : v;

    render(true);
  }

  /* ── الوضع التجريبي (mock=1 في اللينك) ── */
  var demoRaf = null, demoTimer = null;
  function startDemo(){
    reset();
    var to = state.target;
    var t0 = performance.now();
    var DUR = 4200;
    function step(t){
      var k = Math.min(1, (t - t0) / DUR);
      var e = 1 - Math.pow(1 - k, 2);
      setValue(Math.min(to, Math.round(e * to)), false);
      if (k < 1) {
        demoRaf = requestAnimationFrame(step);
      } else {
        demoTimer = setTimeout(function(){
          switchTheme(state.theme === 'bar' ? 'bottle-img' : 'bar');
          startDemo();
        }, 2500);
      }
    }
    demoRaf = requestAnimationFrame(step);
  }

  /* ── الشرارات ── */
  setInterval(function(){
    var layer = document.getElementById('gwSparkles');
    if (!layer || layer.children.length >= 14) return;
    var d = document.createElement('div');
    d.className = 'gw-spark';
    d.innerHTML = '<svg viewBox="0 0 512 512"><path fill="var(--gc)" d="M247.4,106.9C222.7,82.2,205.8,39.2,197.5,0c-8.4,39.2-25.2,82.3-49.9,106.9c-24.7,24.6-67.7,41.5-106.9,49.9c39.2,8.4,82.3,25.2,106.9,49.9c24.7,24.7,41.5,67.7,49.9,106.9c8.4-39.2,25.2-82.3,49.9-106.9c24.6-24.7,67.7-41.5,106.9-49.9C315.1,148.4,272,131.6,247.4,106.9z"/></svg>';
    var size = 5 + Math.random() * 12;
    d.style.width = d.style.height = size + 'px';
    d.style.left = (Math.random() * 100) + '%';
    d.style.top = (Math.random() * 100) + '%';
    layer.appendChild(d);
    var dur = 1600 + Math.random() * 1800;
    var dx = (Math.random() - 0.5) * 60;
    if (d.animate) {
      d.animate([
        { transform: 'translateX(0)', opacity: 0 },
        { opacity: 1, offset: 0.3 },
        { transform: 'translateX(' + dx + 'px)', opacity: 0 },
      ], { duration: dur, easing: 'ease-out' });
    }
    setTimeout(function(){ d.remove(); }, dur);
  }, 400);

  /* ── الإيفنتات الحية — نفس عقد goal-tiktok القديمة بالظبط ── */
  function handleMessage(m){
    if (!m || !m.type) return;
    if (m.type === 'config' && m.id === widgetId) { applyConfig(m.config); return; }
    if (m.type === 'stats') {
      var st = m.stats || {};
      var first = !state.gotFirstStats;
      if (first) state.gotFirstStats = true;
      if (state.goalType === 'likes' && st.likes !== undefined) setValue(Number(st.likes), first);
      if (state.goalType === 'follows' && st.followers !== undefined) setValue(Number(st.followers), first);
      return;
    }
    if (m.type === 'gift' && state.goalType === 'gift') {
      var d = m.data || {};
      if (state.giftName && String(d.giftName || '').toLowerCase() === state.giftName) {
        setValue(state.current + (Number(d.repeatCount) || 1), false);
      }
      return;
    }
    // أزرار Test/Reset من لوحة التحكم (ov:wtest → {type:'test', id, source})
    if (m.type === 'test') {
      if (m.id && m.id !== widgetId) return;
      if (m.source === 'reset') reset();
      else if (m.source === 'test') setValue(state.current + state.testValue, false);
      return;
    }
    // توافق مع البرنامج القديم (/api/ext/command command=tiktok-goal)
    if (m.type === 'ext-tiktok-goal') {
      var x = m.data || {};
      if (x.action === 'test') setValue(state.current + (Number(x.value) || state.testValue), false);
      if (x.action === 'reset') reset();
    }
  }

  /* ── التشغيل ── */
  applyFont(String(cfg.font || 'pro'));
  setGoalColor(cfg.color || cfg.goal_color || 'ffd23f');
  switchTheme(state.theme);
  applyConfig({});
  if (cfg.current_value != null && !isNaN(Number(cfg.current_value))) {
    setValue(Number(cfg.current_value), true);
  }
  root.classList.add('gw-loaded');

  if (isMock) {
    startDemo();
  } else {
    // السطر ده بيتبدل وقت الخدمة بعميل WebSocket بالتوكن (overlay-http)
    var es = new EventSource('/widgets/stream');
    es.onmessage = function(e){
      try { handleMessage(JSON.parse(e.data)); } catch (err) {}
    };
  }
})();
</script>
</body>
</html>
