<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ELDALY STREAM — Follower Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lalezar&family=Changa:wght@700;800&family=Rakkas&family=Bakbak+One&family=Lemon&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Cairo', sans-serif; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; transform-origin: center center; }
.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.ring { position: absolute; inset: -7px; border-radius: 50%; border: 3px solid var(--acc, #d4af37);
  box-shadow: 0 0 18px var(--acc-glow, rgba(212,175,55,0.4)), inset 0 0 12px var(--acc-glow, rgba(212,175,55,0.2)); }
.name { font-weight: 900; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.7); line-height: 1.25; }
.count { font-family: 'Orbitron', sans-serif; font-weight: 900; direction: ltr; line-height: 1;
  text-shadow: 0 0 18px var(--acc-glow, rgba(212,175,55,0.55)), 0 3px 10px rgba(0,0,0,.6); }

/* عنوان الويدجت المزخرف */
.card-title { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-bottom: 4px; z-index: 2; }
.card-title .ttl { font-family: 'Lemon', 'Cairo', serif; letter-spacing: 1px; line-height: 1.15; white-space: nowrap;
  background: linear-gradient(180deg, #ffffff 0%, var(--acc) 62%, #6a4a10 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.65)) drop-shadow(0 0 14px var(--acc-glow)); }
.card-title .orn { height: 2px; width: 52px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--acc)); }
.card-title .orn.r { background: linear-gradient(270deg, transparent, var(--acc)); }
.body { display: flex; flex-direction: column; align-items: center; width: 100%; }
.col { display: flex; flex-direction: column; align-items: center; gap: 4px; }

/* زخارف عايمة (بتظهر حسب الشكل) */
.deco { position: absolute; z-index: 1; pointer-events: none; opacity: 0; display: none;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
#decoA { top: 9%; left: 7%; font-size: 30px; animation: decoFloat 7s ease-in-out infinite; }
#decoB { bottom: 13%; right: 8%; font-size: 24px; animation: decoFloat 8s ease-in-out infinite 1.2s; }
@keyframes decoFloat { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-14px) rotate(10deg); } }

/* شارة الفولو الجديد — ستيكر فوق الركن (مش فوق العنوان) */
.badge { position: absolute; top: -14px; right: 20px; transform: rotate(4deg); z-index: 30;
  background: linear-gradient(135deg, #d4af37, #f2dc93); color: #1a1408; font-weight: 900; font-size: 15px;
  padding: 5px 16px; border-radius: 999px; opacity: 0; pointer-events: none; white-space: nowrap;
  border: 2px solid rgba(255,255,255,0.55);
  box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.badge.show { animation: badgeIn 1.6s ease; }
@keyframes badgeIn { 0% { opacity: 0; transform: rotate(4deg) translateY(-14px) scale(.8); } 15% { opacity: 1; transform: rotate(4deg) translateY(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: rotate(4deg) translateY(-10px); } }

/* حركة الفولو على العداد */
.pop { animation: popAnim .7s cubic-bezier(.34,1.56,.64,1); }
@keyframes popAnim { 0% { transform: scale(1); } 30% { transform: scale(1.22); } 60% { transform: scale(0.94); } 100% { transform: scale(1); } }
.ring-flash { animation: ringFlash .9s ease-out; }
@keyframes ringFlash { 0% { box-shadow: 0 0 0 0 var(--acc-glow), 0 0 24px var(--acc-glow); } 100% { box-shadow: 0 0 0 34px transparent, 0 0 24px transparent; } }

/* ================= 1) كلاسيك ================= */
.shape-classic .card { width: 330px; height: 445px; border-radius: 24px; padding: 14px 10px;
  background: linear-gradient(170deg, #17131f, #0c0a12 70%);
  border: 1.5px solid var(--acc-soft);
  box-shadow: 0 24px 70px rgba(0,0,0,0.65), 0 0 46px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,0.06); }
.shape-classic .card-title { margin-bottom: 14px; }
.shape-classic .card-title .ttl { font-size: 31px; }
.shape-classic .body { gap: 4px; }
.shape-classic .avatar-wrap { width: 146px; height: 146px; margin-bottom: 14px; }
.shape-classic .name { font-size: 30px; margin-bottom: 6px; }
.shape-classic .count { font-size: 48px; color: var(--acc); }

/* ================= 2) جلاس ================= */
.shape-glass .card { width: 610px; height: 250px; border-radius: 26px; flex-direction: column; gap: 4px; padding: 14px 34px;
  background: linear-gradient(120deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 45%, rgba(255,255,255,0.04));
  border: 1.5px solid rgba(255,255,255,0.16);
  box-shadow: 0 22px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12); }
.shape-glass .card-title { margin-bottom: 0; }
.shape-glass .card-title .ttl { font-size: 25px; }
.shape-glass .body { flex-direction: row; align-items: center; gap: 26px; }
.shape-glass .avatar-wrap { width: 132px; height: 132px; }
.shape-glass .col { align-items: flex-start; gap: 6px; }
.shape-glass .name { font-size: 29px; }
.shape-glass .count { font-size: 44px; color: var(--acc); }

/* ================= 3) بار — نحيف مرتب ================= */
.shape-bar .card { width: 580px; height: 158px; border-radius: 32px; flex-direction: column; gap: 2px; padding: 10px 26px;
  background: linear-gradient(90deg, #14101d, #0b0912);
  border: 1.5px solid var(--acc-soft);
  box-shadow: 0 18px 50px rgba(0,0,0,0.6), 0 0 34px var(--acc-glow); }
.shape-bar .card-title { margin-bottom: 0; }
.shape-bar .card-title .ttl { font-size: 20px; }
.shape-bar .card-title .orn { width: 26px; }
.shape-bar .body { flex-direction: row; align-items: center; gap: 18px; }
.shape-bar .avatar-wrap { width: 84px; height: 84px; }
.shape-bar .col { align-items: flex-start; gap: 2px; flex: 1; }
.shape-bar .name { font-size: 23px; }
.shape-bar .count { font-size: 38px; }

/* ================= 4) نيون ================= */
.shape-neon .card { width: 345px; height: 465px; padding: 12px; border-radius: 26px;
  background: linear-gradient(#0d0b14, #0d0b14) padding-box,
              linear-gradient(140deg, #ff2d55, var(--acc), #25f4ee, #ff2d55) border-box;
  border: 2.5px solid transparent;
  background-size: 100% 100%, 300% 300%;
  box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  animation: borderShift 6s linear infinite; }
@keyframes borderShift { 0% { background-position: 0 0, 0% 50%; } 50% { background-position: 0 0, 100% 50%; } 100% { background-position: 0 0, 0% 50%; } }
.shape-neon .card-title { margin-bottom: 14px; }
.shape-neon .card-title .ttl { font-size: 30px;
  background-image: linear-gradient(180deg, #ffffff 0%, var(--acc) 100%); }
.shape-neon .body { gap: 2px; }
.shape-neon .avatar-wrap { width: 146px; height: 146px; margin-bottom: 16px; }
.shape-neon .name { font-size: 28px; margin-bottom: 4px; }
.shape-neon .count { font-size: 46px; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 3px 10px rgba(0,0,0,.6); }

/* ================= 5) ساكورا — بناتي وردي ================= */
.shape-sakura .card { width: 335px; height: 470px; border-radius: 30px; padding: 14px 10px;
  background: linear-gradient(170deg, rgba(255,214,238,0.14), rgba(60,20,50,0.85) 55%, rgba(35,10,30,0.92));
  border: 1.5px solid rgba(255,155,205,0.55);
  box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 55px rgba(255,127,184,0.25), inset 0 1px 0 rgba(255,220,240,0.15); }
.shape-sakura .card-title { margin-bottom: 14px; }
.shape-sakura .card-title .ttl { font-size: 28px;
  background: linear-gradient(180deg, #ffffff 0%, #ffb0d8 60%, #ff7fb8 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(255,127,184,0.6)); }
.shape-sakura .card-title .orn { background: linear-gradient(90deg, transparent, #ff9ed2); }
.shape-sakura .card-title .orn.r { background: linear-gradient(270deg, transparent, #ff9ed2); }
.shape-sakura .body { gap: 4px; }
.shape-sakura .avatar-wrap { width: 146px; height: 146px; margin-bottom: 14px; }
.shape-sakura .ring { border-color: #ffb0d8; box-shadow: 0 0 18px rgba(255,155,205,0.5), inset 0 0 12px rgba(255,155,205,0.25); }
.shape-sakura .name { font-size: 29px; margin-bottom: 6px; }
.shape-sakura .count { font-size: 47px; color: #ffb0d8; text-shadow: 0 0 18px rgba(255,127,184,0.6), 0 3px 10px rgba(0,0,0,.6); }
.shape-sakura .deco { display: block; opacity: 1; }

/* ================= 6) برنسيس — بناتي بنفسجي ================= */
.shape-princess .card { width: 340px; height: 472px; border-radius: 30px; padding: 14px 10px;
  background: linear-gradient(170deg, rgba(216,180,255,0.13), rgba(40,20,70,0.85) 55%, rgba(25,12,45,0.92));
  border: 1.5px solid rgba(190,140,255,0.55);
  box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 55px rgba(180,120,255,0.28), inset 0 1px 0 rgba(240,220,255,0.15); }
.shape-princess .card-title { margin-bottom: 14px; }
.shape-princess .card-title .ttl { font-size: 28px;
  background: linear-gradient(180deg, #ffffff 0%, #d9a8ff 60%, #b47aff 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(180,120,255,0.65)); }
.shape-princess .card-title .orn { background: linear-gradient(90deg, transparent, #c9a2ff); }
.shape-princess .card-title .orn.r { background: linear-gradient(270deg, transparent, #c9a2ff); }
.shape-princess .body { gap: 4px; }
.shape-princess .avatar-wrap { width: 146px; height: 146px; margin-bottom: 14px; }
.shape-princess .ring { border-color: #c9a2ff; box-shadow: 0 0 18px rgba(180,120,255,0.55), inset 0 0 12px rgba(180,120,255,0.25); }
.shape-princess .name { font-size: 29px; margin-bottom: 6px; }
.shape-princess .count { font-size: 47px; color: #d9a8ff; text-shadow: 0 0 18px rgba(180,120,255,0.6), 0 3px 10px rgba(0,0,0,.6); }
.shape-princess .deco { display: block; opacity: 1; }
</style>
</head>
<body class="shape-classic">
<div id="stage">
  <div class="card" id="card">
    <div class="badge" id="badge">+1 New Follower 🎉</div>
    <div class="deco" id="decoA">🌸</div>
    <div class="deco" id="decoB">🌸</div>
    <div class="card-title"><span class="orn"></span><span class="ttl" id="label">Total Followers</span><span class="orn r"></span></div>
    <div class="body">
      <div class="avatar-wrap">
        <div class="ring" id="ring"></div>
        <img class="avatar" id="avatar" alt="">
      </div>
      <div class="col">
        <div class="name" id="name"></div>
        <div class="count" id="count">0</div>
      </div>
    </div>
  </div>
</div>
<script>
window.onerror = function (msg, src, line, col) {
  try { document.title = "ERR: " + msg + " @" + line + ":" + col; } catch (e) {}
};
/* إعداد الويدجت — الكونفج بيحقنه الباك اند هنا */
let CONFIG = {};
try { CONFIG = __INITIAL_CONFIG__; } catch (e) {}

const params = new URLSearchParams(location.search);
const PAGE_ID = params.get("id") || "follower-card";
const shape  = (params.get("shape")  || CONFIG.shape  || "classic").toLowerCase();
const type   = (params.get("type")   || CONFIG.type   || "follows").toLowerCase();
const goal   = parseInt(params.get("goal") || params.get("target") || CONFIG.target || 100) || 100;
const startN = parseInt(params.get("start"));
const titleOverride = params.get("title") || CONFIG.title || "";
let NAME_VAL = params.get("name")  || CONFIG.name  || CONFIG.streamerName || "ELDALY STREAM";
let AVATAR_URL = params.get("avatar") || CONFIG.avatar || CONFIG.streamerAvatar || "";
let SOUND_URL = params.get("sound") || CONFIG.sound || "";
let VOL = Math.max(0, Math.min(1, parseFloat(params.get("vol") || CONFIG.vol || "0.6") || 0.6));
const MUTED = params.get("mute") === "1" || params.get("preview") === "1";
let FONT = (params.get("font") || CONFIG.font || "lalezar").toLowerCase();
const FONT_STACKS = {
  lalezar: "'Lalezar', 'Cairo', sans-serif",
  changa: "'Changa', 'Cairo', sans-serif",
  rakkas: "'Rakkas', 'Cairo', serif",
  bakbak: "'Bakbak One', 'Cairo', sans-serif",
  lemon: "'Lemon', 'Cairo', serif",
  orbitron: "'Orbitron', sans-serif",
  cairo: "'Cairo', sans-serif"
};
function applyFont() {
  const stack = FONT_STACKS[FONT] || FONT_STACKS.lalezar;
  nameEl.style.fontFamily = stack;
  countEl.style.fontFamily = stack;
}
let SOUND_ON = !(CONFIG.soundOn === false || CONFIG.soundOn === "false" || CONFIG.soundOn === 0 || CONFIG.soundOn === "0");

const TYPES = {
  follows:  { label: "Total Followers", statsKey: "followers" },
  likes:    { label: "Total Likes",     statsKey: "likes" },
  coins:    { label: "Total Coins",     statsKey: "totalCoins" },
  gifts:    { label: "Total Gifts",     statsKey: "gifts" },
  shares:   { label: "Total Shares",    statsKey: "shares" },
};
const T = TYPES[type] || TYPES.follows;
const LABEL = titleOverride || T.label;

document.body.className = "shape-" + shape;

let BASE_FOLLOWERS = parseInt(CONFIG.streamerFollowers) || 0;
let sessionZero = null;   /* أول قراءة فولو في الجلسة */
let cur = 120;
if (!isNaN(startN)) cur = Math.max(0, startN);
else if (BASE_FOLLOWERS) cur = BASE_FOLLOWERS;
let shown = cur;
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

const card = document.getElementById("card");
const nameEl = document.getElementById("name");
const labelEl = document.getElementById("label");
const countEl = document.getElementById("count");
const badgeEl = document.getElementById("badge");
const ringEl = document.getElementById("ring");
const avatarEl = document.getElementById("avatar");
const decoA = document.getElementById("decoA");
const decoB = document.getElementById("decoB");

/* زخارف الشكل — بتتغير حسب الثيم */
function setDecos(sh) {
  const a = sh === "sakura" ? "🌸" : sh === "princess" ? "✨" : "";
  decoA.textContent = a || "🌸";
  decoB.textContent = a || "🌸";
}
setDecos(shape);

nameEl.textContent = NAME_VAL;
labelEl.textContent = LABEL;

/* صورة الحساب — لو مفيش صورة نرسم أول حرف من الاسم */
function setAvatar() {
  if (AVATAR_URL) { avatarEl.src = AVATAR_URL; return; }
  const letter = (NAME_VAL.trim()[0] || "E").toUpperCase();
  avatarEl.src = "data:image/svg+xml;utf8," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>" +
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0' stop-color='#f2dc93'/><stop offset='1' stop-color='#c99b2a'/>" +
    "</linearGradient></defs>" +
    "<rect width='300' height='300' fill='url(#g)'/>" +
    "<text x='150' y='196' font-family='Cairo,Arial' font-size='150' font-weight='900' fill='#1a1408' text-anchor='middle'>" + letter + "</text></svg>");
}
setAvatar();

/* لون الويدجت — ذهبي افتراضي وقابل للتغيير لحظيًا */
const C = (params.get("color") || CONFIG.color || "#d4af37").replace("#", "");
function rgb(hex) { const p = String(hex).replace("#", ""); return [parseInt(p.slice(0,2),16), parseInt(p.slice(2,4),16), parseInt(p.slice(4,6),16)]; }
function hexRGB(hex) { const [r,g,b] = rgb(hex); return "rgb(" + r + "," + g + "," + b + ")"; }
function colA(hex, a) { const [r,g,b] = rgb(hex); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }
let ACCENT = "#" + C;
function applyAccent() {
  const root = document.documentElement.style;
  if (shape === "sakura" || shape === "princess") {
    const P = shape === "sakura"
      ? { c: "#ff9ed2", glow: "rgba(255,127,184,0.5)", soft: "rgba(255,155,205,0.45)" }
      : { c: "#c9a2ff", glow: "rgba(201,162,255,0.5)", soft: "rgba(190,140,255,0.4)" };
    root.setProperty("--acc", P.c);
    root.setProperty("--acc-glow", P.glow);
    root.setProperty("--acc-soft", P.soft);
    ringEl.style.borderColor = P.c;
    ringEl.style.boxShadow = "0 0 18px " + P.glow + ", inset 0 0 12px " + P.glow;
    countEl.style.color = P.c;
    return;
  }
  root.setProperty("--acc", ACCENT);
  root.setProperty("--acc-glow", colA(ACCENT, 0.45));
  root.setProperty("--acc-soft", colA(ACCENT, 0.4));
  if (shape !== "neon") countEl.style.color = hexRGB(ACCENT);
}
applyAccent();
applyFont();

/* تطبيق إعدادات جديدة لحظيًا من السوكت — من غير إعادة تحميل */
function applyLive(cfg) {
  if (!cfg || typeof cfg !== "object") return;
  if (typeof cfg.name === "string" && cfg.name.trim()) {
    NAME_VAL = cfg.name;
    nameEl.textContent = NAME_VAL;
    if (!AVATAR_URL) setAvatar();
  }
  if (typeof cfg.avatar === "string") {
    const nv = cfg.avatar.trim();
    if (nv !== AVATAR_URL) { AVATAR_URL = nv; setAvatar(); }
  }
  if (typeof cfg.sound === "string") SOUND_URL = cfg.sound.trim();
  if (cfg.vol !== undefined) VOL = Math.max(0, Math.min(1, Number(cfg.vol) || 0));
  if (typeof cfg.color === "string" && cfg.color) { ACCENT = cfg.color; applyAccent(); }
  if (cfg.soundOn !== undefined) SOUND_ON = !(cfg.soundOn === false || cfg.soundOn === "false" || Number(cfg.soundOn) === 0);
  if (typeof cfg.font === "string" && cfg.font.trim()) {
    FONT = cfg.font.trim().toLowerCase();
    applyFont();
  }
  if (typeof cfg.shape === "string" && cfg.shape) {
    const cls = "shape-" + cfg.shape.toLowerCase();
    if (document.body.className !== cls) {
      document.body.className = cls;
      setDecos(cfg.shape.toLowerCase());
      setTimeout(fit, 60);
    }
  }
}
window.applyLiveConfig = applyLive;

/* تحجيم الكرت على مقاس المصدر */
function fit() {
  const cw = card.offsetWidth, ch = card.offsetHeight;
  if (!cw || !ch) return;
  const s = Math.min(window.innerWidth / cw, window.innerHeight / ch) * 0.96;
  card.style.transform = "scale(" + s.toFixed(3) + ")";
}
window.addEventListener("resize", fit);
setTimeout(fit, 60); fit();

/* صوت الفولو — نغمة افتراضية أو ملف صوت مخصص */
let audioCtx = null;
function playDing() {
  if (!SOUND_ON || MUTED) return;
  if (SOUND_URL) {
    try { const a = new Audio(SOUND_URL); a.volume = VOL; a.play().catch(function(){}); } catch (e) {}
    return;
  }
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [[880, 0], [1318.5, 0.09]].forEach(function (fg) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = fg[0];
      g.gain.setValueAtTime(0.0001, t0 + fg[1]);
      g.gain.exponentialRampToValueAtTime(Math.max(0.01, VOL), t0 + fg[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + fg[1] + 0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + fg[1]); o.stop(t0 + fg[1] + 0.32);
    });
  } catch (e) {}
}
/* فتح الصوت أول تفاعل في المتصفح العادي (OBS بيشغلها تلقائي) */
window.addEventListener("pointerdown", function(){ if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { once: true });
window.addEventListener("keydown", function(){ if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { once: true });

/* حركة الفولو الجديد */
function followFx(withSound) {
  if (withSound) playDing();
  countEl.classList.remove("pop"); void countEl.offsetWidth; countEl.classList.add("pop");
  ringEl.classList.remove("ring-flash"); void ringEl.offsetWidth; ringEl.classList.add("ring-flash");
  badgeEl.classList.remove("show"); void badgeEl.offsetWidth; badgeEl.classList.add("show");
}

function render() {
  countEl.textContent = fmt(shown);
}

/* ديمو دائم — أول stats حقيقية بتعديها */
let gotReal = false;
setInterval(function () {
  if (gotReal) return;
  cur += Math.random() < 0.65 ? 1 : 2;
  followFx(false);
}, 6500);

/* بيانات لايف */
let evtSource = null;
try { evtSource = new EventSource('/widgets/stream'); } catch (e) {}
if (evtSource) {
  evtSource.onmessage = (e) => {
    let m = null;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === "stats" && m.stats) {
      const v = m.stats[T.statsKey];
      if (v !== undefined) {
        const prev = cur;
        if (sessionZero === null) sessionZero = Math.max(0, Number(v) || 0);
        cur = BASE_FOLLOWERS + Math.max(0, (Number(v) || 0) - sessionZero);
        gotReal = true;
        if (cur > prev) followFx(true);
      }
    } else if (m.type === "config" && m.id === PAGE_ID && m.config) {
      applyLive(m.config);
    } else if (m.type === "streamer-profile" && m.data) {
      BASE_FOLLOWERS = Number(m.data.followers) || BASE_FOLLOWERS;
      applyLive({ name: m.data.nickname, avatar: m.data.avatar });
    } else if (m.type === "test") {
      cur += 1;
      followFx(true);
    }
  };
}

render();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  shown += (cur - shown) * Math.min(1, dt * 4);
  render();
  requestAnimationFrame(frame);
}
/* منع تكرار صوت أول تحميل */
lastSeen = cur;
requestAnimationFrame(frame);
</script>
</body>
