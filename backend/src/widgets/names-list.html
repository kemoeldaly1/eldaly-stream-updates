<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ELDALY — Names List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: "Cairo", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  :root {
    --nl-glow: #00ffe1;
    --nl-glow-rgb: 0, 255, 225;
    --nl-badge: #ff0055;
    --nl-badge-rgb: 255, 0, 85;
    --nl-bg: rgba(13, 15, 26, 0.55);
  }

  /* ===== Outer wrapper — sizing only (cyber uses it as border shell) ===== */
  .nl-box {
    width: 285px; height: 500px;
    display: flex; flex-direction: column;
    --nl-radius: 18px;
  }
  .nl-inner {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    padding: 16px 14px 12px;
    border-radius: var(--nl-radius);
    background: var(--nl-bg);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
    position: relative;
    overflow: hidden;
  }

  /* ===== Header ===== */
  .nl-header {
    flex-shrink: 0;
    text-align: center;
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    position: relative;
  }
  .nl-title {
    font-size: 26px; font-weight: 900;
    color: var(--nl-glow);
    text-shadow: 0 0 16px rgba(var(--nl-glow-rgb), 0.55);
    line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nl-list {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 9px;
    overflow-y: auto;
    scroll-behavior: smooth;
    scrollbar-width: none; -ms-overflow-style: none;
    padding-inline: 2px;
  }
  .nl-list::-webkit-scrollbar { display: none; }

  /* ===== Name card ===== */
  .nl-card {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.14);
    animation: nlIn 0.35s ease forwards;
    flex-shrink: 0;
  }
  .nl-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .nl-num {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, rgba(var(--nl-badge-rgb), 1), rgba(var(--nl-badge-rgb), 0.55));
    box-shadow: 0 3px 10px rgba(var(--nl-badge-rgb), 0.35);
  }
  .nl-name {
    font-size: 19px; font-weight: 800; color: #fff;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nl-crown {
    font-size: 21px; flex-shrink: 0;
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.85));
    animation: nlCrown 2.2s ease-in-out infinite;
  }
  .nl-empty {
    margin: auto;
    padding: 22px 16px;
    border: 1.5px dashed rgba(255, 255, 255, 0.22);
    border-radius: 14px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 14px; font-weight: 700;
    text-align: center;
  }

  @keyframes nlIn {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes nlCrown {
    0%, 100% { transform: scale(1) rotate(-4deg); }
    50%      { transform: scale(1.12) rotate(4deg); }
  }

  /* ============================================================
     SHAPE: NEON — dark shell, glowing borders, neon bars
     ============================================================ */
  .nl-box.shape-neon .nl-inner {
    background: var(--nl-bg);
    border: 2px solid var(--nl-glow);
    box-shadow:
      0 0 22px rgba(var(--nl-glow-rgb), 0.35),
      inset 0 0 26px rgba(var(--nl-glow-rgb), 0.08);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .nl-box.shape-neon .nl-header { border-bottom: 1px solid rgba(var(--nl-glow-rgb), 0.35); }
  .nl-box.shape-neon .nl-title { text-shadow: 0 0 8px rgba(var(--nl-glow-rgb), 0.9), 0 0 26px rgba(var(--nl-glow-rgb), 0.5); }
  .nl-box.shape-neon .nl-card {
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid rgba(var(--nl-glow-rgb), 0.30);
    border-inline-start: 3px solid var(--nl-glow);
    border-radius: 9px;
    box-shadow: inset 0 0 14px rgba(var(--nl-glow-rgb), 0.05);
  }
  .nl-box.shape-neon .nl-num {
    box-shadow: 0 0 14px rgba(var(--nl-badge-rgb), 0.75);
  }

  /* ============================================================
     SHAPE: GOLD — VIP luxury, gradient title, gilded cards
     ============================================================ */
  .nl-box.shape-gold { --nl-radius: 16px; }
  .nl-box.shape-gold .nl-inner {
    background:
      linear-gradient(var(--nl-bg), var(--nl-bg)),
      linear-gradient(160deg, #f7dd8a 0%, #b8860b 30%, #6b4a08 55%, #b8860b 80%, #f7dd8a 100%);
    background-clip: padding-box, border-box;
    border: 2px solid transparent;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), inset 0 0 24px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .nl-box.shape-gold .nl-header { border-bottom: 1px solid rgba(212, 175, 55, 0.5); }
  .nl-box.shape-gold .nl-title {
    background-image: linear-gradient(180deg, #fff3b0 0%, #ffd700 45%, #b8860b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
  }
  .nl-box.shape-gold .nl-card {
    background: rgba(212, 175, 55, 0.10);
    border: 1px solid rgba(212, 175, 55, 0.38);
    border-radius: 10px;
  }
  .nl-box.shape-gold .nl-num {
    background: linear-gradient(160deg, #ffe98a 0%, #ffd700 40%, #b8860b 100%);
    color: #241a02;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
  }
  .nl-box.shape-gold .nl-crown { filter: drop-shadow(0 0 7px rgba(255, 215, 0, 1)); }

  /* ============================================================
     SHAPE: ROYAL — animated gradient border (purple → pink)
     ============================================================ */
  .nl-box.shape-royal { --nl-radius: 20px; }
  .nl-box.shape-royal .nl-inner {
    background:
      linear-gradient(var(--nl-bg), var(--nl-bg)) padding-box,
      linear-gradient(130deg, var(--nl-glow), #ec4899, #8b5cf6, var(--nl-glow)) border-box;
    background-size: 100% 100%, 300% 300%;
    animation: nlRoyal 7s linear infinite;
    border: 2px solid transparent;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  @keyframes nlRoyal {
    0%   { background-position: 0% 0%, 0% 50%; }
    50%  { background-position: 0% 0%, 100% 50%; }
    100% { background-position: 0% 0%, 0% 50%; }
  }
  .nl-box.shape-royal .nl-header {
    border-bottom: 1px solid rgba(236, 72, 153, 0.4);
  }
  .nl-box.shape-royal .nl-title {
    background-image: linear-gradient(90deg, var(--nl-glow), #ec4899);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 12px rgba(236, 72, 153, 0.45));
  }
  .nl-box.shape-royal .nl-card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(var(--nl-glow-rgb), 0.28);
    border-radius: 14px;
  }
  .nl-box.shape-royal .nl-num {
    background: linear-gradient(135deg, var(--nl-badge), rgba(var(--nl-badge-rgb), 0.55));
  }

  /* ============================================================
     SHAPE: MINIMAL — borderless clean rows, thin separators
     ============================================================ */
  .nl-box.shape-minimal { --nl-radius: 14px; }
  .nl-box.shape-minimal .nl-inner {
    border: none;
    box-shadow: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 10px 10px;
  }
  .nl-box.shape-minimal .nl-header {
    border-bottom: 2px solid rgba(var(--nl-glow-rgb), 0.55);
    padding-bottom: 8px;
  }
  .nl-box.shape-minimal .nl-title {
    letter-spacing: 4px;
    font-size: 21px;
    text-transform: uppercase;
    text-shadow: none;
  }
  .nl-box.shape-minimal .nl-card {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 0;
    padding: 8px 4px;
  }
  .nl-box.shape-minimal .nl-num {
    background: none;
    box-shadow: none;
    width: auto; min-width: 34px;
    color: var(--nl-badge);
    font-size: 21px;
  }
  .nl-box.shape-minimal .nl-crown { font-size: 19px; }

  /* ============================================================
     SHAPE: CYBER — chamfered shell, scanlines, angular badges
     ============================================================ */
  .nl-box.shape-cyber { --nl-radius: 0px; }
  .nl-box.shape-cyber .nl-inner {
    background:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 4px),
      var(--nl-bg);
    border: 2px solid var(--nl-glow);
    clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    box-shadow: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .nl-box.shape-cyber .nl-header { border-bottom: 1px solid rgba(var(--nl-glow-rgb), 0.5); }
  .nl-box.shape-cyber .nl-title { letter-spacing: 2px; }
  .nl-box.shape-cyber .nl-card {
    background: rgba(var(--nl-glow-rgb), 0.07);
    border: 1px solid rgba(var(--nl-glow-rgb), 0.25);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    border-radius: 0;
  }
  .nl-box.shape-cyber .nl-num {
    border-radius: 0;
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    box-shadow: none;
  }

  /* ============================================================
     SHAPE: BARS — wide rows with progress-style side ribbon
     ============================================================ */
  .nl-box.shape-bars { --nl-radius: 14px; }
  .nl-box.shape-bars .nl-inner {
    border: 1.5px solid rgba(var(--nl-glow-rgb), 0.45);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .nl-box.shape-bars .nl-card {
    background: linear-gradient(90deg, rgba(var(--nl-glow-rgb), 0.16), rgba(255, 255, 255, 0.04) 55%);
    border: none;
    border-inline-start: 4px solid var(--nl-glow);
    border-radius: 9px;
  }
  .nl-box.shape-bars .nl-num { border-radius: 9px; width: 34px; height: 34px; font-size: 15px; }
</style>
</head>
<body>
  <div class="nl-box" id="nlBox">
    <div class="nl-inner">
      <div class="nl-header"><h2 class="nl-title" id="nlTitle">TOP FANS</h2></div>
      <div class="nl-list" id="nlList"></div>
    </div>
  </div>

<script>
/* Widget bootstrap — the backend injects the account config object below */
let CONFIG = {};
try { CONFIG = __INITIAL_CONFIG__; } catch (e) {}

const params = new URLSearchParams(location.search);
const PAGE_ID = params.get("id") || "names-list-1";
const DEMO = params.get("demo") === "1";

let TITLE   = params.get("title") || CONFIG.title || "TOP FANS";
let NAMES   = (DEMO && !CONFIG.names) ? "Ahmed\nKarim\nMostafa\nYoussef\nOmar\nAdham" : (CONFIG.names || "");
let CROWNS  = Array.isArray(CONFIG.crowns) ? CONFIG.crowns : [];
let SHAPE   = (params.get("shape") || CONFIG.shape || "glass").toLowerCase();
let BGCOLOR = CONFIG.bgColor || "#0d0f1a";
let OPACITY = (CONFIG.opacity === undefined || CONFIG.opacity === null) ? 55 : Number(CONFIG.opacity) || 0;
let GLOW    = CONFIG.glow || "#00ffe1";
let BADGE   = CONFIG.badge || "#ff0055";
let TSIZE   = Number(CONFIG.titleSize) || 26;
let NSIZE   = Number(CONFIG.nameSize) || 19;
let WIDTH   = Number(CONFIG.width) || 285;
let MAXH    = Number(CONFIG.maxHeight) || 500;

const box    = document.getElementById("nlBox");
const titleEl = document.getElementById("nlTitle");
const listEl  = document.getElementById("nlList");

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/[&<>"']/g, (m) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]
  ));
}

function hexRgb(h) {
  let s = String(h || "").replace("#", "").trim();
  if (s.length === 3) s = s.split("").map((c) => c + c).join("");
  const n = parseInt(s, 16);
  if (isNaN(n)) return [0, 255, 225];
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function applyVars() {
  const rs = document.documentElement.style;
  const glow = hexRgb(GLOW).join(",");
  const badge = hexRgb(BADGE).join(",");
  const bg = hexRgb(BGCOLOR).join(",");
  rs.setProperty("--nl-glow", GLOW);
  rs.setProperty("--nl-glow-rgb", glow);
  rs.setProperty("--nl-badge", BADGE);
  rs.setProperty("--nl-badge-rgb", badge);
  const op = Math.max(0, Math.min(100, OPACITY)) / 100;
  rs.setProperty("--nl-bg", "rgba(" + bg + "," + op + ")");
  box.style.width = WIDTH + "px";
  box.style.height = MAXH + "px";
  titleEl.style.fontSize = TSIZE + "px";
}

function renderList() {
  const names = String(NAMES || "")
    .split("\n")
    .map((s) => s.trim())
    .filter((s) => s !== "");
  const crownSet = new Set(CROWNS);
  box.className = "nl-box shape-" + (SHAPE || "glass");
  titleEl.textContent = TITLE || "";
  if (!names.length) {
    listEl.innerHTML = '<div class="nl-empty">✦ Waiting for names ✦<br><span style="font-size:11px;opacity:.7">Add names from the app</span></div>';
    return;
  }
  let html = "";
  names.forEach((name, idx) => {
    html += (
      '<div class="nl-card">' +
        '<div class="nl-main">' +
          '<div class="nl-num">' + (idx + 1) + "</div>" +
          '<span class="nl-name" style="font-size:' + NSIZE + 'px">' + escapeHtml(name) + "</span>" +
        "</div>" +
        (crownSet.has(idx) ? '<span class="nl-crown">👑</span>' : "") +
      "</div>"
    );
  });
  listEl.innerHTML = html;
  listEl.scrollTop = listEl.scrollHeight;
}

function applyAll() {
  applyVars();
  renderList();
}

/* Live config pushes arrive through the stream client below */
let evtSource = null;
try { evtSource = new EventSource('/widgets/stream'); } catch (e) {}
if (evtSource) {
  evtSource.onmessage = (e) => {
    let m = null;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === "config" && m.id === PAGE_ID && m.config) {
      const c = m.config;
      if (c.title !== undefined) TITLE = c.title;
      if (c.names !== undefined) NAMES = c.names;
      if (Array.isArray(c.crowns)) CROWNS = c.crowns;
      if (c.shape) SHAPE = String(c.shape).toLowerCase();
      if (c.bgColor) BGCOLOR = c.bgColor;
      if (c.opacity !== undefined && c.opacity !== null) OPACITY = Number(c.opacity) || 0;
      if (c.glow) GLOW = c.glow;
      if (c.badge) BADGE = c.badge;
      if (c.titleSize) TSIZE = Number(c.titleSize) || 26;
      if (c.nameSize) NSIZE = Number(c.nameSize) || 19;
      if (c.width) WIDTH = Number(c.width) || 285;
      if (c.maxHeight) MAXH = Number(c.maxHeight) || 500;
      applyAll();
    }
  };
}

applyAll();
</script>
</body>
</html>
