<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Image Goal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:transparent;width:100vw;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;direction:ltr}
.container{display:flex;flex-direction:column;align-items:center;gap:16px}
.title{font-size:24px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.6);letter-spacing:.5px;opacity:.9}
.img-wrap{position:relative;width:250px;height:250px;display:flex;align-items:center;justify-content:center}
/* The goal image — starts grayscale, fills with color */
.goal-img{width:100%;height:100%;object-fit:contain;filter:grayscale(100%) brightness(0.7);transition:filter 1.2s ease-in-out}
/* Color overlay reveal mask — CSS mask approach */
.color-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:inset(100% -1000px -1000px -1000px);transition:clip-path 1.2s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 20px rgba(255,180,50,.3))}
/* Counter overlay */
.counter{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;background:rgba(0,0,0,.65);border-radius:30px;padding:6px 20px;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.counter-value{font-size:26px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.counter-total{font-size:13px;font-weight:600;opacity:.6;margin-left:2px}
/* Pulse on increment */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.img-wrap.pulsing{animation:pulse .5s ease-in-out}
/* Shimmer overlay when filling */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shimmer{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);background-size:200% 100%;opacity:0;transition:opacity .3s}
.img-wrap.pulsing .shimmer{opacity:1;animation:shimmer .8s ease-in-out}
/* Sparkle particles */
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,#ffd700,#ff6b00)}
@keyframes sparkleFly{0%{opacity:1;transform:translate(0,0) scale(1.5)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}}
/* Full glow when 100% */
@keyframes fullGlow{0%,100%{filter:drop-shadow(0 0 15px rgba(255,200,50,.3))}50%{filter:drop-shadow(0 0 35px rgba(255,200,50,.7))}}
.img-wrap.complete .color-layer{animation:fullGlow 2s ease-in-out infinite}
/* Rainbow sparkle border when complete */
@keyframes rainbowBorder{0%{border-color:rgba(255,50,50,.5)}25%{border-color:rgba(255,200,50,.5)}50%{border-color:rgba(50,255,50,.5)}75%{border-color:rgba(50,150,255,.5)}100%{border-color:rgba(255,50,50,.5)}}
.img-wrap.complete .counter{animation:rainbowBorder 3s linear infinite}
</style>
</head>
<body>
<div class="container" id="container">
  <div class="title" id="goalTitle">Goal</div>
  <div class="img-wrap" id="imgWrap">
    <img class="goal-img" id="goalImgGray" src="" alt="Goal">
    <img class="color-layer" id="goalImgColor" src="" alt="Goal Color">
    <div class="shimmer"></div>
    <div class="counter" id="counter">
      <span class="counter-value" id="counterValue">0</span>
      <span class="counter-total" id="counterTotal">/ 1000</span>
    </div>
  </div>
</div>

<script>
(function(){
let cfg={};try{cfg=JSON.parse('__INITIAL_CONFIG__')}catch(e){}
const urlParams=new URLSearchParams(window.location.search);
const widgetId=urlParams.get('id')||'heart-goal';
const goalType=urlParams.get('type')||cfg.goalType||'likes';

let goal=parseInt(cfg.goal)||1000;
let title=cfg.title||'Goal';
let currentValue=0;
let giftName=(cfg.giftName||'').toLowerCase();
let imgSrc='';

const titleEl=document.getElementById('goalTitle');
const counterVal=document.getElementById('counterValue');
const counterTot=document.getElementById('counterTotal');
const imgWrap=document.getElementById('imgWrap');
const goalImgGray=document.getElementById('goalImgGray');
const goalImgColor=document.getElementById('goalImgColor');

function applyConfig(c){
  cfg=c||{};
  goal=parseInt(c.goal)||1000;
  title=c.title||'Goal';
  giftName=(c.giftName||'').toLowerCase();

  titleEl.textContent=title;

  // Image source
  if(c.image){
    imgSrc='/media/'+encodeURIComponent(c.image);
    goalImgGray.src=imgSrc;
    goalImgColor.src=imgSrc;
    goalImgGray.style.display='block';
    goalImgColor.style.display='block';
  }

  // Image size & scale
  const sz=parseInt(c.imageSize)||250;
  const sc=parseFloat(c.imageScale)||1;
  imgWrap.style.width=sz+'px';
  imgWrap.style.height=sz+'px';
  imgWrap.style.transform=`scale(${sc})`;

  // Positions
  const ty=parseInt(c.titleY)||0;
  const cy=parseInt(c.counterY)||0;
  titleEl.style.transform=`translateY(${ty}px)`;
  document.querySelector('.counter').style.transform=`translate(-50%, calc(50% + ${cy}px))`;

  // Counter style
  const counter = document.querySelector('.counter');
  if(c.counterStyle === 'hidden') {
    counter.style.display = 'none';
  } else if(c.counterStyle === 'minimal') {
    counter.style.display = 'flex';
    counter.style.background = 'transparent';
    counter.style.border = 'none';
    counter.style.backdropFilter = 'none';
    counter.style.boxShadow = 'none';
  } else {
    counter.style.display = 'flex';
    counter.style.background = 'rgba(0,0,0,.65)';
    counter.style.border = '1px solid rgba(255,255,255,.15)';
    counter.style.backdropFilter = 'blur(8px)';
    counter.style.boxShadow = '0 8px 32px rgba(0,0,0,.3)';
  }

  counterTot.textContent='/ '+goal.toLocaleString();
  updateFill(currentValue);
}

function updateFill(val){
  currentValue=val;
  const baseline = cfg._baseline || 0;
  const displayCurrent = Math.max(0, currentValue - baseline);
  const pct=Math.min(1,Math.max(0,displayCurrent/goal));

  // Animate the color layer reveal — clip from bottom up
  const clipTop = 100 - (pct * 100);
  let topInset = clipTop + '%';
  if(pct >= 1) topInset = '-1000px'; // Expand top when fully completed so the glow isn't cut off
  goalImgColor.style.clipPath = `inset(${topInset} -1000px -1000px -1000px)`;

  // Make gray layer slightly brighter as progress increases
  const brightness = 0.7 + (pct * 0.3);
  const grayscale = 100 - (pct * 30); // partially desaturate even the gray layer
  goalImgGray.style.filter = `grayscale(${grayscale}%) brightness(${brightness})`;

  counterVal.textContent=displayCurrent.toLocaleString();
  counterTot.textContent='/ '+goal.toLocaleString();

  // Pulse animation
  imgWrap.classList.add('pulsing');
  setTimeout(()=>imgWrap.classList.remove('pulsing'),500);

  // Complete state
  if(pct>=1){
    imgWrap.classList.add('complete');
    spawnSparkles();
  }else{
    imgWrap.classList.remove('complete');
  }
}

function spawnSparkles(){
  for(let i=0;i<12;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    const angle=Math.random()*Math.PI*2;
    const dist=40+Math.random()*80;
    s.style.left='50%';
    s.style.top='50%';
    s.style.setProperty('--sx',(Math.cos(angle)*dist)+'px');
    s.style.setProperty('--sy',(Math.sin(angle)*dist)+'px');
    s.style.animation='sparkleFly .9s ease-out forwards';
    s.style.animationDelay=(i*40)+'ms';
    s.style.width=(3+Math.random()*4)+'px';
    s.style.height=s.style.width;
    imgWrap.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}

applyConfig(cfg);

const es=new EventSource('/widgets/stream');
es.onmessage=(e)=>{try{const m=JSON.parse(e.data);
  if(m.type==='config'&&m.id===widgetId)applyConfig(m.config);
  if(m.type==='stats'){
    const gt=cfg.goalType||goalType;
    if(gt==='likes'&&m.stats.likes!==undefined)updateFill(m.stats.likes);
    if(gt==='follows'&&m.stats.followers!==undefined)updateFill(m.stats.followers);
  }
  // Gift-based goal
  if(m.type==='gift'&&(cfg.goalType||goalType)==='gift'){
    if(giftName&&(m.data.giftName||'').toLowerCase()===giftName){
      currentValue+=(m.data.repeatCount||1);
      updateFill(currentValue);
    }
  }
  if(m.type==='ext-heart-goal'){
    const d=m.data;
    if(d.action==='test'){
      currentValue += (d.value||10);
      updateFill(currentValue);
    }
    if(d.action==='reset'){
      currentValue=0;
      updateFill(0);
    }
  }
}catch(err){}};
})();
</script>
</body>
</html>
