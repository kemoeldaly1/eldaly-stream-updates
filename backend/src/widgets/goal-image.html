<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ELDALY STREAM — Goal Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Lemon&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Cairo', sans-serif; }
#wrap { position: absolute; transform-origin: top left; }
#liquid, #shapeimg { position: absolute; inset: 0; width: 100%; height: 100%; }
#shapeimg { -webkit-user-drag: none; user-select: none; }
.t-title {
  position: absolute; font-family: 'Lemon', 'Cairo', serif; direction: ltr; white-space: nowrap;
  background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 0 16px var(--cm));
}
.glow-val {
  position: absolute; font-family: 'Lemon', 'Cairo', serif; direction: ltr; white-space: nowrap;
  color: var(--v-col); text-shadow: 0 3px 0 rgba(0,0,0,.65), 0 0 18px var(--cm);
}
#fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; text-align: center; padding: 20px; z-index: 50; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="liquid" viewBox="0 0 1166 1349" preserveAspectRatio="none">
    <defs>
      <mask id="liqMask"><image id="maskimg" href="" width="1166" height="1349"></image></mask>
      <linearGradient id="frontGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="fs1" offset="0%" stop-color="#a03e00"></stop>
        <stop id="fs2" offset="100%" stop-color="#ff8800"></stop>
      </linearGradient>
      <linearGradient id="backGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="bs1" offset="0%" stop-color="#7a2e00"></stop>
        <stop id="bs2" offset="100%" stop-color="#c65a00"></stop>
      </linearGradient>
    </defs>
    <g mask="url(#liqMask)">
      <path id="backWave" fill="url(#backGrad)" opacity="0.9"></path>
      <path id="frontWave" fill="url(#frontGrad)"></path>
      <path id="surfLine" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4"></path>
      <g id="bubbles"></g>
    </g>
  </svg>
  <img id="shapeimg" src="" alt="">
  <div class="t-title" id="title"></div>
  <div class="glow-val" id="val"></div>
</div>
<div id="fallback">مفيش صورة للشكل ده — حط img-&lt;name&gt;.png و img-&lt;name&gt;-mask.png</div>
<script>
/* إعداد الويدجت — على الباك اند __INITIAL_CONFIG__ بتتعوض بكونفج الحساب */
let CONFIG = {};
try { CONFIG = __INITIAL_CONFIG__; } catch (e) {}

const params = new URLSearchParams(location.search);
const PAGE_ID = params.get("id") || "goal-image";
const imgName = (params.get("img") || CONFIG.img || "tik").toLowerCase();
const type   = (params.get("type")   || CONFIG.type   || "coins").toLowerCase();
const goal   = parseInt(params.get("goal") || params.get("target") || CONFIG.target || 100) || 100;
const startPct = parseFloat(params.get("start"));
const titleOverride = params.get("title") || CONFIG.title || "";

const TYPES = {
  likes:    { label: "Like Goal",   statsKey: "likes" },
  follows:  { label: "Follow Goal", statsKey: "followers" },
  coins:    { label: "Gift Goal",   statsKey: "totalCoins" },
  gifts:    { label: "Gift Goal",   statsKey: "gifts" },
  shares:   { label: "Share Goal",  statsKey: "shares" },
};
const T = TYPES[type] || TYPES.coins;
const LABEL = titleOverride || T.label;

/* ألوان افتراضية لكل صورة — مع لمسة تغيير عن المرجع، وباراميتر color بيعدها */
const DEF_COL = { tik: "#0a84ff", bottle: "#ff1f1f", heart: "#ee4a78", flask: "#f25fc0" };
const C = (params.get("color") || CONFIG.color || DEF_COL[imgName] || "#0a84ff").replace("#", "");
function rgb(hex) { return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]; }
function colA(a) { const [r,g,b] = rgb(C); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }
function hexRGB(hex) { return "rgb(" + rgb(hex).join(",") + ")"; }

document.documentElement.style.setProperty("--c", "#" + C);
document.documentElement.style.setProperty("--cm", colA(0.7));
document.documentElement.style.setProperty("--v-col", (function(){ const [r,g,b] = rgb(C); const m = v => Math.max(0, Math.min(255, Math.round(v*1.25))); return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")"; })());

/* أبعاد الصورة بتتقرأ من الصورة نفسها عند التحميل */
let IMG_W = 1166, IMG_H = 1349;
const TOP_Y_FRAC = { tik: 0.204, bottle: 0.12, heart: 0.354, flask: 0.12 };
let topY = 275;

let cur = Math.round(goal * 0.42);
if (!isNaN(startPct)) cur = Math.round(goal * Math.max(0, Math.min(100, startPct)) / 100);
let shown = cur;
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

const shapeImg = document.getElementById("shapeimg");
const maskImg = document.getElementById("maskimg");
const titleEl = document.getElementById("title");
const valEl = document.getElementById("val");
const wrap = document.getElementById("wrap");

function fit() {
  const k = Math.min(window.innerWidth / IMG_W, window.innerHeight / IMG_H) * 0.98;
  wrap.style.width = IMG_W + "px"; wrap.style.height = IMG_H + "px";
  wrap.style.transform = "scale(" + k.toFixed(4) + ")";
  wrap.style.left = ((window.innerWidth - IMG_W * k) / 2) + "px";
  wrap.style.top = ((window.innerHeight - IMG_H * k) / 2) + "px";
  /* حجم النصوص متناسب مع الصورة */
  titleEl.style.fontSize = Math.round(IMG_W * 0.058) + "px";
  titleEl.style.left = Math.round(IMG_W * 0.035) + "px";
  titleEl.style.top = Math.round(IMG_H * 0.265) + "px";
  titleEl.style.backgroundImage = "linear-gradient(180deg,#9fd0ff 0%,#" + C + " 55%,#0a54b0 100%)";
  valEl.style.fontSize = Math.round(IMG_W * 0.048) + "px";
  valEl.style.left = Math.round(IMG_W * 0.035) + "px";
  valEl.style.top = Math.round(IMG_H * 0.345) + "px";
}
window.addEventListener("resize", fit);

function renderHUD() {
  const p = Math.max(0, Math.min(100, Math.round((cur / goal) * 100)));
  valEl.textContent = fmt(shown) + " / " + fmt(goal);
}

/* تلوين السايل بلون الثيم */
function paintLiquid() {
  const dark = (function(){ const [r,g,b] = rgb(C); const m = v => Math.round(v * 0.42); return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")"; })();
  const mid  = (function(){ const [r,g,b] = rgb(C); const m = v => Math.round(v * 0.72); return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")"; })();
  document.getElementById("fs1").setAttribute("stop-color", dark);
  document.getElementById("fs2").setAttribute("stop-color", hexRGB(C));
  document.getElementById("bs1").setAttribute("stop-color", shade2(0.32));
  document.getElementById("bs2").setAttribute("stop-color", shade2(0.55));
}
function shade2(f) { const [r,g,b] = rgb(C); const m = v => Math.max(0, Math.min(255, Math.round(v * f))); return "rgb(" + m(r) + "," + m(g) + "," + m(b) + ")"; }

/* موجات سينية */
function waveD(yBase, amp, phase, close) {
  const W = IMG_W, H = IMG_H;
  let d = close ? ("M -40 " + (H + 40) + " L -40 " + (yBase + Math.sin(phase) * amp).toFixed(1)) : "";
  for (let x = -40; x <= W + 40; x += 16) {
    const y = yBase + Math.sin(x / 95 + phase) * amp + Math.sin(x / 34 - phase * 1.7) * amp * 0.32;
    d += (close ? " L " : (d ? " L " : "M ")) + x + " " + y.toFixed(1);
  }
  if (close) d += " L " + (W + 40) + " " + (H + 40) + " Z";
  return d;
}

/* فقاعات */
const bubG = document.getElementById("bubbles");
const bubbles = [];
for (let i = 0; i < 10; i++) {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("r", (5 + Math.random() * 9).toFixed(1));
  c.setAttribute("fill", "rgba(255,255,255,0.5)");
  c.setAttribute("opacity", "0");
  bubG.appendChild(c);
  bubbles.push({ c, x: Math.random() * IMG_W, off: Math.random(), v: 0.10 + Math.random() * 0.18, w: 0.5 + Math.random() * 1.4 });
}

let phase = 0;
function tick(t, dt) {
  phase += dt * 1.6;
  const p = Math.max(0, Math.min(1, shown / goal));
  const yBase = (IMG_H + 12) - p * ((IMG_H + 12) - topY);
  document.getElementById("backWave").setAttribute("d", waveD(yBase + 7, 11, phase * 0.82 + 1.4, true));
  document.getElementById("frontWave").setAttribute("d", waveD(yBase, 9, phase, true));
  document.getElementById("surfLine").setAttribute("d", waveD(yBase, 9, phase, false));
  const top = yBase - 8;
  for (const b of bubbles) {
    b.off += dt * b.v;
    if (b.off > 1) { b.off = 0; b.x = Math.random() * IMG_W; }
    b.c.setAttribute("cx", (b.x + Math.sin(t / 400 * b.w) * 10).toFixed(1));
    b.c.setAttribute("cy", (IMG_H - b.off * (IMG_H - top)).toFixed(1));
    b.c.setAttribute("opacity", (b.off < 0.12 ? b.off / 0.12 * 0.6 : Math.max(0, 0.6 * (1 - (b.off - 0.12) / 0.88))).toFixed(2));
  }
}

/* ديمو دائم — أول stats حقيقية بتعديها */
let gotReal = false;
setInterval(function () {
  if (gotReal) return;
  const drift = (Math.random() - 0.42) * goal * 0.05;
  cur = Math.max(goal * 0.12, Math.min(goal, cur + drift));
}, 2200);

/* بيانات لايف */
let evtSource = null;
try { evtSource = new EventSource('/widgets/stream'); } catch (e) {}
if (evtSource) {
  evtSource.onmessage = (e) => {
    let m = null;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === "stats" && m.stats) {
      const v = m.stats[T.statsKey];
      if (v !== undefined) { cur = Math.max(0, Number(v) || 0); gotReal = true; }
    } else if (m.type === "config" && m.id === PAGE_ID && m.config) {
      location.reload();
    } else if (m.type === "test") {
      cur = Math.min(goal, cur + Math.round(goal * 0.12));
    }
  };
}

/* تحميل الصور وبناء المشهد */
shapeImg.src = "img-" + imgName + ".png";
maskImg.setAttribute("href", "img-" + imgName + "-mask.png");
titleEl.textContent = LABEL;
let loaded = 0;
function onImg() {
  loaded++;
  if (shapeImg.naturalWidth) {
    IMG_W = shapeImg.naturalWidth;
    IMG_H = shapeImg.naturalHeight;
    document.getElementById("liquid").setAttribute("viewBox", "0 0 " + IMG_W + " " + IMG_H);
    maskImg.setAttribute("width", IMG_W);
    maskImg.setAttribute("height", IMG_H);
    topY = IMG_H * (TOP_Y_FRAC[imgName] || 0.2);
  }
  fit(); renderHUD();
}
shapeImg.onload = onImg;
shapeImg.onerror = function () { document.getElementById("fallback").style.display = "flex"; };
fit(); paintLiquid(); renderHUD();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  shown += (cur - shown) * Math.min(1, dt * 3);
  renderHUD();
  tick(t, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
