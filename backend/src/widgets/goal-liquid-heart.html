<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Liquid Heart Goal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:transparent!important;width:100vw;height:100vh}
body{font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;color:#fff}

.scene{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.goal-wrap{display:flex;flex-direction:column;align-items:center;position:relative}

.heart-container{
  position:relative;width:350px;height:350px;
  display:flex;align-items:center;justify-content:center;
  animation:heartFloat 4s ease-in-out infinite;
}
@keyframes heartFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.liquid-svg{position:absolute;inset:0;width:100%;height:100%}
.heart-outline{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:10;pointer-events:none;
  filter:drop-shadow(0 0 15px var(--heart-glow, rgba(255,50,80,.4))) drop-shadow(0 5px 20px rgba(0,0,0,.5));
}

.heart-label{
  position:absolute;top:var(--label-top, -40px);left:50%;transform:translateX(-50%);
  font-size:var(--label-size, 22px);font-weight:800;
  text-shadow:0 2px 12px rgba(0,0,0,.6);letter-spacing:.5px;
  z-index:20;white-space:nowrap;
}

.heart-counter{
  position:absolute;bottom:var(--counter-bottom, -35px);left:50%;transform:translateX(-50%);
  font-size:var(--counter-size, 18px);font-weight:700;
  padding:6px 22px;border-radius:999px;
  background:var(--counter-bg, #d4522d);
  border:2px solid var(--counter-border, #ffe5a5);
  box-shadow:0 0 12px #fff3;
  z-index:20;white-space:nowrap;
}

.percentage-display{
  position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:15;
  font-size:42px;font-weight:900;
  background:linear-gradient(180deg,var(--pct-from,#ff3366),var(--pct-to,#ffffff));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.7));
}

@keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.wave-front{animation:waveMove var(--wave-speed-front, 3s) linear infinite}
.wave-back{animation:waveMove var(--wave-speed-back, 5s) linear infinite reverse}

/* Stars */
@keyframes starFloat{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}
}
.star{
  position:absolute;z-index:12;opacity:0;
  animation:starFloat var(--star-speed, 2s) ease-out infinite;
  font-size:var(--star-size, 14px);
}

/* Pulse on update */
@keyframes heartPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.heart-container.pulsing{animation:heartPulse .5s ease-in-out}

/* Complete glow */
@keyframes fullGlow{0%,100%{filter:drop-shadow(0 0 15px var(--heart-glow, rgba(255,50,80,.3)))}50%{filter:drop-shadow(0 0 40px var(--heart-glow, rgba(255,50,80,.7)))}}
.heart-container.complete .heart-outline{animation:fullGlow 2s ease-in-out infinite}
</style>
</head>
<body>
<div class="scene">
  <div class="goal-wrap">
    <div class="heart-container" id="container">
      <svg viewBox="0 0 350 350" class="liquid-svg">
        <defs>
          <clipPath id="heartClip">
            <path d="M175,310 C100,260 15,210 15,130 C15,70 60,30 110,30 C140,30 165,50 175,75 C185,50 210,30 240,30 C290,30 335,70 335,130 C335,210 250,260 175,310 Z"/>
          </clipPath>
          <linearGradient id="waveFrontGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" id="wfg1" stop-color="#ff1a4d"/>
            <stop offset="100%" id="wfg2" stop-color="#ff6699"/>
          </linearGradient>
          <linearGradient id="waveBackGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" id="wbg1" stop-color="#cc1144"/>
            <stop offset="100%" id="wbg2" stop-color="#ff3366"/>
          </linearGradient>
        </defs>
        <g clip-path="url(#heartClip)">
          <path id="waveBack" class="wave-back" fill="url(#waveBackGrad)" d=""/>
          <path id="waveFront" class="wave-front" fill="url(#waveFrontGrad)" d=""/>
        </g>
      </svg>

      <svg viewBox="0 0 350 350" class="heart-outline">
        <path d="M175,310 C100,260 15,210 15,130 C15,70 60,30 110,30 C140,30 165,50 175,75 C185,50 210,30 240,30 C290,30 335,70 335,130 C335,210 250,260 175,310 Z"
          fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/>
        <!-- Glass highlight -->
        <path d="M85,100 Q70,140 80,180" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10" stroke-linecap="round"/>
      </svg>

      <div id="stars"></div>
      <div class="percentage-display" id="pctDisplay">0%</div>
    </div>
    <div class="heart-label" id="goalLabel">Follow Goal</div>
    <div class="heart-counter" id="goalCounter">0 / 100</div>
  </div>
</div>

<script>
(function(){
  let cfg={};try{cfg=JSON.parse('__INITIAL_CONFIG__')}catch(e){}
  const urlParams=new URLSearchParams(window.location.search);
  const widgetId=urlParams.get('id')||'liquid-heart-goal';
  const goalType=urlParams.get('type')||cfg.goalType||'follows';

  let goal=parseInt(cfg.goal)||100;
  let title=cfg.title||'Follow Goal';
  let currentValue=0;
  let giftName=(cfg.giftName||'').toLowerCase();
  let accentR=parseInt(cfg.accentR)||255, accentG=parseInt(cfg.accentG)||50, accentB=parseInt(cfg.accentB)||80;

  // Settings
  let waveSpeed=parseFloat(cfg.waveSpeed)||3;
  let starSpeed=parseFloat(cfg.starSpeed)||2;
  let starSize=parseInt(cfg.starSize)||14;
  let labelTop=parseInt(cfg.labelTop)||-40;
  let counterBottom=parseInt(cfg.counterBottom)||-35;
  let labelSize=parseInt(cfg.labelSize)||22;
  let counterSize=parseInt(cfg.counterSize)||18;

  const labelEl=document.getElementById('goalLabel');
  const counterEl=document.getElementById('goalCounter');
  const pctEl=document.getElementById('pctDisplay');
  const container=document.getElementById('container');

  function setColors(){
    const root=document.documentElement;
    root.style.setProperty('--heart-glow',`rgba(${accentR},${accentG},${accentB},.5)`);
    root.style.setProperty('--pct-from',`rgb(${accentR},${accentG},${accentB})`);
    root.style.setProperty('--counter-bg',`rgba(${Math.floor(accentR*.8)},${Math.floor(accentG*.4)},${Math.floor(accentB*.4)},.9)`);
    root.style.setProperty('--counter-border',`rgba(255,230,180,.6)`);
    root.style.setProperty('--wave-speed-front',waveSpeed+'s');
    root.style.setProperty('--wave-speed-back',(waveSpeed*1.7)+'s');
    root.style.setProperty('--star-speed',starSpeed+'s');
    root.style.setProperty('--star-size',starSize+'px');
    root.style.setProperty('--label-top',labelTop+'px');
    root.style.setProperty('--counter-bottom',counterBottom+'px');
    root.style.setProperty('--label-size',labelSize+'px');
    root.style.setProperty('--counter-size',counterSize+'px');
    document.getElementById('wfg1').setAttribute('stop-color',`rgb(${accentR},${Math.floor(accentG*.5)},${Math.floor(accentB*.5)})`);
    document.getElementById('wfg2').setAttribute('stop-color',`rgb(${accentR},${accentG},${accentB})`);
    document.getElementById('wbg1').setAttribute('stop-color',`rgb(${Math.floor(accentR*.8)},${Math.floor(accentG*.4)},${Math.floor(accentB*.4)})`);
    document.getElementById('wbg2').setAttribute('stop-color',`rgb(${accentR},${Math.floor(accentG*.7)},${Math.floor(accentB*.7)})`);
  }

  function generateWavePath(baseY, amp, freq, phase){
    let d=`M 0 350 L 0 ${baseY} `;
    for(let x=0;x<=700;x+=3){
      const y=baseY+Math.sin((x*freq/350+phase)*Math.PI*2)*amp+Math.sin((x*freq*1.7/350+phase*1.5)*Math.PI*2)*amp*.3;
      d+=`L ${x} ${y} `;
    }
    d+=`L 700 350 Z`;return d;
  }

  let animPhase=0;
  function animate(){
    animPhase+=(0.05 / (waveSpeed || 3));
    const pct=Math.min(1,Math.max(0,currentValue/goal));
    const baseY=320-(pct*280);
    document.getElementById('waveBack').setAttribute('d',generateWavePath(baseY-4,5,2,animPhase*0.7));
    document.getElementById('waveFront').setAttribute('d',generateWavePath(baseY,7,2,animPhase));
    requestAnimationFrame(animate);
  }

  // Spawn stars
  function spawnStar(){
    const pct=currentValue/goal;if(pct<=0)return;
    const starsEl=document.getElementById('stars');
    const star=document.createElement('div');
    star.className='star';
    const emojis=['⭐','✨','💫','🌟'];
    star.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    const angle=Math.random()*Math.PI*2;
    const dist=60+Math.random()*100;
    star.style.left='50%';star.style.top='45%';
    star.style.setProperty('--sx',(Math.cos(angle)*dist)+'px');
    star.style.setProperty('--sy',(Math.sin(angle)*dist)+'px');
    star.style.animationDuration=(1.5+Math.random()*2)+'s';
    star.style.animationDelay=(Math.random())+'s';
    star.style.fontSize=(10+Math.random()*10)+'px';
    starsEl.appendChild(star);
    setTimeout(()=>star.remove(),4000);
  }
  setInterval(spawnStar,600);

  function applyConfig(c){
    cfg=c||{};
    goal=parseInt(c.goal)||100;title=c.title||'Follow Goal';
    giftName=(c.giftName||'').toLowerCase();
    accentR=parseInt(c.accentR)||255;accentG=parseInt(c.accentG)||50;accentB=parseInt(c.accentB)||80;
    waveSpeed=parseFloat(c.waveSpeed)||3;
    starSpeed=parseFloat(c.starSpeed)||2;
    starSize=parseInt(c.starSize)||14;
    labelTop=parseInt(c.labelTop)||-40;
    counterBottom=parseInt(c.counterBottom)||-35;
    labelSize=parseInt(c.labelSize)||22;
    counterSize=parseInt(c.counterSize)||18;
    setColors();updateDisplay();
  }

  function updateDisplay(){
    const pct=Math.min(100,Math.max(0,(currentValue/goal)*100));
    labelEl.textContent=title;
    counterEl.textContent=`${currentValue.toLocaleString()} / ${goal.toLocaleString()}`;
    pctEl.textContent=Math.floor(pct)+'%';
    container.classList.add('pulsing');setTimeout(()=>container.classList.remove('pulsing'),500);
    if(pct>=100)container.classList.add('complete');else container.classList.remove('complete');
  }

  function updateGoal(val){currentValue=Math.min(val,goal);updateDisplay();}

  setColors();updateDisplay();animate();

  const es=new EventSource('/widgets/stream');
  es.onmessage=(e)=>{try{const m=JSON.parse(e.data);
    if(m.type==='config'&&m.id===widgetId)applyConfig(m.config);
    if(m.type==='stats'){
      const gt=cfg.goalType||goalType;
      if(gt==='likes'&&m.stats.likes!==undefined)updateGoal(m.stats.likes);
      if(gt==='follows'&&m.stats.followers!==undefined)updateGoal(m.stats.followers);
    }
    if(m.type==='gift'&&(cfg.goalType||goalType)==='gift'){
      if(giftName&&(m.data.giftName||'').toLowerCase()===giftName){currentValue+=(m.data.repeatCount||1);updateGoal(currentValue);}
    }
    if(m.type==='ext-liquid-heart-goal'){
      const d=m.data;
      if(d.action==='test'){currentValue+=(d.value||10);updateGoal(currentValue);}
      if(d.action==='reset'){currentValue=0;updateGoal(0);}
    }
  }catch(err){}};
})();
</script>
</body>
</html>
