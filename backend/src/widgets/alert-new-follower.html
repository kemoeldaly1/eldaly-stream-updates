<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>New Follower Alert</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:transparent!important;width:100vw;height:100vh}
body{font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;color:#fff}

.alert-container{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  opacity:0;transform:scale(.7) translateY(20px);
  transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1);
}
.alert-container.visible{opacity:1;transform:scale(1) translateY(0)}

/* 3D Rotating Rings */
.avatar-wrap{
  position:relative;width:160px;height:160px;
  display:flex;align-items:center;justify-content:center;
  perspective:600px;
}

.ring{
  position:absolute;border-radius:50%;border:2px solid;
  animation-timing-function:linear;animation-iteration-count:infinite;
}
.ring-1{
  width:140px;height:140px;
  border-color:rgba(37,244,238,.4);
  animation:ring3d1 4s linear infinite;
}
.ring-2{
  width:155px;height:155px;
  border-color:rgba(254,44,85,.3);border-width:1.5px;
  animation:ring3d2 6s linear infinite;
}
.ring-3{
  width:125px;height:125px;
  border-color:rgba(168,85,247,.3);border-width:1px;border-style:dashed;
  animation:ring3d3 8s linear infinite;
}

@keyframes ring3d1{
  0%{transform:rotateX(60deg) rotateZ(0deg)}
  100%{transform:rotateX(60deg) rotateZ(360deg)}
}
@keyframes ring3d2{
  0%{transform:rotateX(70deg) rotateY(45deg) rotateZ(0deg)}
  100%{transform:rotateX(70deg) rotateY(45deg) rotateZ(-360deg)}
}
@keyframes ring3d3{
  0%{transform:rotateX(50deg) rotateY(-30deg) rotateZ(0deg)}
  100%{transform:rotateX(50deg) rotateY(-30deg) rotateZ(360deg)}
}

.avatar-circle{
  width:90px;height:90px;border-radius:50%;overflow:hidden;
  border:3px solid rgba(255,255,255,.2);
  box-shadow:0 0 25px rgba(37,244,238,.3),0 0 50px rgba(254,44,85,.2);
  z-index:5;
}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.avatar-circle .placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:36px;background:linear-gradient(135deg,#1a1a2e,#16213e);
}

/* Info */
.follower-name{
  font-size:24px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,#25f4ee,#a855f7,#fe2c55);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 3s ease infinite;
}
@keyframes gradientShift{0%{background-position:0% center}50%{background-position:100% center}100%{background-position:0% center}}

.welcome-msg{
  font-size:15px;color:rgba(255,255,255,.5);font-weight:500;
  text-shadow:0 1px 8px rgba(0,0,0,.5);
}

/* Particles */
@keyframes particleOrbit{
  0%{opacity:0;transform:rotate(0deg) translateX(var(--orbit,80px)) rotate(0deg) scale(0)}
  20%{opacity:1;transform:rotate(72deg) translateX(var(--orbit,80px)) rotate(-72deg) scale(1)}
  80%{opacity:.5}
  100%{opacity:0;transform:rotate(360deg) translateX(var(--orbit,80px)) rotate(-360deg) scale(0)}
}
.orbit-particle{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:rgba(37,244,238,.7);box-shadow:0 0 8px rgba(37,244,238,.5);
  animation:particleOrbit 4s linear infinite;
}

/* Entry effect */
@keyframes entryBurst{
  0%{opacity:1;transform:scale(0)}
  50%{opacity:.3;transform:scale(2)}
  100%{opacity:0;transform:scale(3)}
}
.entry-burst{
  position:absolute;width:100px;height:100px;border-radius:50%;
  border:2px solid rgba(37,244,238,.4);
  animation:entryBurst 1s ease-out forwards;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="alert-container" id="alertContainer">
  <div class="avatar-wrap" id="avatarWrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="avatar-circle" id="avatarCircle">
      <div class="placeholder" id="avatarContent">👤</div>
    </div>
  </div>
  <div class="follower-name" id="followerName">—</div>
  <div class="welcome-msg" id="welcomeMsg">متابع جديد 🎉</div>
  <div id="particlesContainer" style="position:absolute;width:100%;height:100%;pointer-events:none;"></div>
</div>

<script>
(function(){
  let cfg={};try{cfg=JSON.parse('__INITIAL_CONFIG__')}catch(e){}
  const urlParams=new URLSearchParams(window.location.search);
  const widgetId=urlParams.get('id')||'new-follower';

  const alertContainer=document.getElementById('alertContainer');
  const followerNameEl=document.getElementById('followerName');
  const welcomeMsgEl=document.getElementById('welcomeMsg');
  const avatarContent=document.getElementById('avatarContent');
  const avatarWrap=document.getElementById('avatarWrap');

  let message=cfg.message||'متابع جديد 🎉';
  let showDuration=parseInt(cfg.showDuration)||6000;
  let hideTimer=null;

  function applyConfig(c){
    cfg=c||{};
    message=c.message||'متابع جديد 🎉';
    showDuration=parseInt(c.showDuration)||6000;
  }

  function showAlert(data){
    const name=data.uniqueId||data.nickname||data.username||'User';
    const avatar=data.profilePictureUrl||data.avatar||'';

    followerNameEl.textContent='@'+name;
    welcomeMsgEl.textContent=message;

    if(avatar){
      avatarContent.outerHTML=`<img id="avatarContent" src="${avatar}" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='<div class=\\'placeholder\\' id=\\'avatarContent\\'>👤</div>'"/>`;
    }else{
      const el=document.getElementById('avatarContent');
      if(el&&el.tagName==='IMG')el.outerHTML=`<div class="placeholder" id="avatarContent">👤</div>`;
    }

    // Entry burst effect
    const burst=document.createElement('div');
    burst.className='entry-burst';
    burst.style.left='50%';burst.style.top='50%';
    burst.style.transform='translate(-50%,-50%)';
    avatarWrap.appendChild(burst);
    setTimeout(()=>burst.remove(),1200);

    // Spawn orbit particles
    spawnOrbitParticles();

    alertContainer.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{
      alertContainer.classList.remove('visible');
    },showDuration);
  }

  function spawnOrbitParticles(){
    const ct=document.getElementById('particlesContainer');
    for(let i=0;i<8;i++){
      const p=document.createElement('div');
      p.className='orbit-particle';
      p.style.left='50%';p.style.top='40%';
      p.style.setProperty('--orbit',(60+Math.random()*40)+'px');
      p.style.animationDelay=(Math.random()*3)+'s';
      p.style.animationDuration=(3+Math.random()*3)+'s';
      const colors=['rgba(37,244,238,.7)','rgba(254,44,85,.7)','rgba(168,85,247,.7)'];
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.boxShadow=`0 0 8px ${p.style.background}`;
      ct.appendChild(p);
      setTimeout(()=>p.remove(),8000);
    }
  }

  const es=new EventSource('/widgets/stream');
  es.onmessage=(e)=>{try{const m=JSON.parse(e.data);
    if(m.type==='config'&&m.id===widgetId)applyConfig(m.config);
    if(m.type==='follow'){showAlert(m.data);}
    if(m.type==='test'&&m.id===widgetId){
      showAlert({uniqueId:'TestUser',nickname:'Test Follower',profilePictureUrl:''});
    }
  }catch(err){}};
})();
</script>
</body>
</html>
