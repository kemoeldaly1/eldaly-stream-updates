name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build installer
        run: npm run build -- --publish never
        working-directory: frontend

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content frontend/package.json | ConvertFrom-Json).version
          gh release upload $env:GITHUB_REF_NAME `
            "frontend/dist/ELDALY-STREAM-Setup-$version.exe" `
            "frontend/dist/ELDALY-STREAM-Setup-$version.exe.blockmap" `
            "frontend/dist/latest.yml" `
            --clobber