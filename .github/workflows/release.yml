name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build installer
        run: npm run build -- --publish never
        working-directory: frontend

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content frontend/package.json | ConvertFrom-Json).version
          # فحص إجباري قبل الرفع: البناء ولatest.yml لازم يطابقوا نسخة package.json
          # (مرة release باسم v2.3.14 كان جوّاه اسم ملف 2.3.13 — نمنع تكرارها)
          $setupExe = "frontend/dist/ELDALY-STREAM-Setup-$version.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Error "No installer for version $version - build does not match package.json"
            exit 1
          }
          $ymlVersion = (Select-String -Path "frontend/dist/latest.yml" -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          if ($ymlVersion -ne $version) {
            Write-Error "latest.yml says $ymlVersion but package.json says $version - stopping upload"
            exit 1
          }
          # إنشاء الـ release لو مش موجود (upload بيطلب release موجود مسبقًا)
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "ELDALY STREAM $version" --notes "ELDALY STREAM v$version" --target main
            # GitHub عنده تأخير اتساق — الريليز بيتعمل بس مش بيتشاف فوراً.
            # نستنى لحد ما view ينجح قبل ما نرفع (الرفع على ريليز مش منتشر = 404)
            $ready = $false
            for ($w = 1; $w -le 15; $w++) {
              Start-Sleep -Seconds 5
              gh release view $env:GITHUB_REF_NAME 2>$null
              if ($LASTEXITCODE -eq 0) { $ready = $true; Write-Host "Release visible after $((w*5))s"; break }
            }
            if (-not $ready) { Write-Error "Release not visible after 75s"; exit 1 }
          }
          $files = @(
            "frontend/dist/ELDALY-STREAM-Setup-$version.exe",
            "frontend/dist/ELDALY-STREAM-Setup-$version.exe.blockmap",
            "frontend/dist/latest.yml",
            "frontend/dist/ELDALY-STREAM-Setup-Latest.exe"
          )
          # الرفع مع إعادة محاولة — سيرفرات رفع GitHub بترجع HTTP 500/404 أحيانًا
          # مع الملفات الكبيرة (81MB)، و gh أحيانًا يطبع خطأ ويخرج 0 — عشان كده
          # التحقق بعد كل محاولة هو الحكم الحقيقي مش كود الخروج
          $max = 5
          $ok = $false
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "== Upload attempt $i of $max =="
            gh release upload $env:GITHUB_REF_NAME @files --clobber
            Start-Sleep -Seconds 5
            # قائمة الريليزات بيشوف المسودات كمان (releases/tags مش بيشوفهم)
            $rel = gh api "repos/${{ github.repository }}/releases" | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME } | Select-Object -First 1
            $missing = @()
            if ($rel -and $rel.assets) {
              foreach ($f in $files) {
                $name = Split-Path $f -Leaf
                if (-not ($rel.assets | Where-Object { $_.name -eq $name })) { $missing += $name }
              }
            } else {
              $missing = @("release-not-found")
            }
            if ($missing.Count -eq 0) { $ok = $true; break }
            Write-Host "Missing after attempt ${i}: $($missing -join ', ')"
            if ($i -lt $max) { Write-Host "Retrying in 45s..."; Start-Sleep -Seconds 45 }
          }
          if (-not $ok) { Write-Error "Upload failed after $max attempts"; exit 1 }
          # لو الريليز مسودة — انشره (gh ساعات بسيبه draft والأوبديتر مش بيشوفه)
          $rel = gh api "repos/${{ github.repository }}/releases" | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME } | Select-Object -First 1
          if ($rel -and $rel.draft) {
            Write-Host "Release is a draft - publishing..."
            gh api -X PATCH "repos/${{ github.repository }}/releases/$($rel.id)" -f draft=false | Out-Null
            Write-Host "Published."
          }
          Write-Host "All $($files.Count) assets verified and release published."